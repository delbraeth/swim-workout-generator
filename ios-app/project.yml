# XcodeGen spec → generates SetForge.xcodeproj.
#
#   brew install xcodegen
#   cd ios-app && xcodegen generate && open SetForge.xcodeproj
#
# Keeping the project description in YAML (rather than a checked-in .xcodeproj)
# avoids merge-hostile pbxproj diffs and keeps the source of truth readable.
name: SetForge
options:
  bundleIdPrefix: io.setforge
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  SetForgeKit:
    path: Packages/SetForgeKit

targets:
  SetForge:
    type: application
    platform: iOS
    sources:
      - path: SetForge
        excludes:
          - "**/*.entitlements"
    dependencies:
      - package: SetForgeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.setforge.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: SetForge
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        CODE_SIGN_ENTITLEMENTS: SetForge/SetForge.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Sign in with Apple requires a real (paid) Apple Developer Team to sign;
    # set DEVELOPMENT_TEAM via xcconfig or in Xcode's Signing & Capabilities.
