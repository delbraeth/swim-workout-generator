    // ═══════════════════════════════════════════════════════════════
    //  RUN WORKOUT OVERLAY
    //  Full-screen step-through: one section at a time, iPhone-sized.
    // ═══════════════════════════════════════════════════════════════

    const SECTION_EMOJIS = { warmup: "🌊", drill: "🎯", main: "💪", cooldown: "🧊" };

    function RunWorkoutOverlay({ workout, restSecs, onClose }) {
      const [idx, setIdx]               = useState(0);
      const [paceIdx, setPaceIdx]       = useState(null);
      const [elapsed, setElapsed]       = useState(0); // seconds since workout started
      const blocks  = workout.blocks;

      // Wall-clock elapsed timer — runs from mount, never pauses
      useEffect(() => {
        const id = setInterval(() => setElapsed(e => e + 1), 1000);
        return () => clearInterval(id);
      }, []);

      const allSets = useMemo(() =>
        blocks.flatMap((block, bIdx) =>
          block.sets.map((set, sIdx) => ({ set, blockIdx: bIdx, setIdx: sIdx }))
        ), [blocks]);

      function handlePaceNext() {
        if (paceIdx + 1 < allSets.length) {
          const next = allSets[paceIdx + 1];
          setIdx(next.blockIdx);
          setPaceIdx(paceIdx + 1);
        } else {
          setPaceIdx(null);
          onClose();
        }
      }
      const block   = blocks[idx];
      const total   = blocks.length;
      const isFirst = idx === 0;
      const isLast  = idx === total - 1;
      const s       = SECTION_STYLES[block.section] || SECTION_STYLES.main;
      const emoji   = SECTION_EMOJIS[block.section] || "🏊";

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 9999,
          background: "#0f172a", overflowY: "auto",
          display: "flex", flexDirection: "column",
          fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        }}>
          {/* Top bar: close + progress dots + counter */}
          <div style={{
            display: "flex", justifyContent: "space-between", alignItems: "center",
            padding: "16px 20px", borderBottom: "1px solid #1e293b",
            position: "sticky", top: 0, background: "#0f172a", zIndex: 1,
          }}>
            <button onClick={onClose} style={{
              background: "transparent", border: "none", color: "#94a3b8",
              fontSize: 28, lineHeight: 1, cursor: "pointer",
              padding: "4px 8px", borderRadius: 8, minWidth: 44, minHeight: 44,
            }}>✕</button>
            <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
              {blocks.map((_, i) => (
                <div key={i} style={{
                  width: i === idx ? 28 : 8, height: 8, borderRadius: 999,
                  background: i === idx ? "#3b82f6" : "#334155",
                  transition: "width 0.2s",
                }} />
              ))}
            </div>
            <div style={{ minWidth: 52, textAlign: "right", lineHeight: 1.3 }}>
              <div style={{ fontSize: 13, color: "#64748b", fontWeight: 600 }}>{idx + 1}/{total}</div>
              <div style={{ fontSize: 12, color: "#334155", fontFamily: "monospace", fontWeight: 600 }}>
                {Math.floor(elapsed / 60)}:{String(elapsed % 60).padStart(2, "0")}
              </div>
            </div>
          </div>

          {/* Section header */}
          <div style={{ background: s.headerBg, padding: "24px 20px 20px" }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: s.headerText, textTransform: "uppercase", letterSpacing: "0.12em", opacity: 0.7, marginBottom: 6 }}>
              Section {idx + 1} of {total}
            </div>
            <div style={{ fontSize: 34, fontWeight: 900, color: s.headerText, lineHeight: 1.1, marginBottom: 6 }}>
              {emoji} {block.name}
            </div>
            <div style={{ fontSize: 15, color: s.headerText, opacity: 0.85, fontWeight: 600 }}>
              {block.totalYards.toLocaleString()} yards
            </div>
          </div>

          {/* Sets — tap any card to open the pace clock */}
          <div style={{ flex: 1, padding: "16px 20px", display: "flex", flexDirection: "column", gap: 12 }}>
            {block.sets.map((set, i) => (
              <div key={i}
                onClick={() => setPaceIdx(blocks.slice(0, idx).reduce((acc, b) => acc + b.sets.length, 0) + i)}
                style={{
                  background: "#1e293b", borderRadius: 14,
                  border: `1px solid ${s.border}`, padding: "18px 18px 14px",
                  cursor: "pointer", WebkitTapHighlightColor: "transparent",
                }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
                  <div style={{ fontSize: 30, fontWeight: 900, color: "#fff", marginBottom: 8, letterSpacing: "-0.02em", lineHeight: 1 }}>
                    {set.reps} <span style={{ color: "#475569", fontWeight: 400 }}>×</span> {set.dist}
                    <span style={{ fontSize: 16, fontWeight: 500, color: "#64748b", marginLeft: 6 }}>yds</span>
                  </div>
                  <span style={{ fontSize: 11, color: "#334155", fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.08em", paddingTop: 4 }}>
                    ▶ pace
                  </span>
                </div>
                <div style={{ fontSize: 19, color: "#e2e8f0", lineHeight: 1.45, marginBottom: 10 }}>
                  {set.desc}
                </div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, alignItems: "baseline" }}>
                  <span style={{
                    background: "#0f172a", color: "#38bdf8",
                    padding: "4px 12px", borderRadius: 999,
                    fontSize: 16, fontWeight: 700, fontFamily: "monospace",
                    whiteSpace: "nowrap",
                  }}>
                    ⏱ {set.interval}
                  </span>
                  <span style={{ color: "#94a3b8", fontSize: 16, fontStyle: "italic", lineHeight: 1.4 }}>
                    {set.focus}
                  </span>
                </div>
              </div>
            ))}
          </div>

          {/* Pace clock — rendered over this overlay when a set is tapped */}
          {paceIdx !== null && (
            <PaceClockView
              key={paceIdx}
              set={allSets[paceIdx].set}
              sectionName={workout.blocks[allSets[paceIdx].blockIdx].name}
              onClose={() => setPaceIdx(null)}
              onNext={handlePaceNext}
              isLastSet={paceIdx === allSets.length - 1}
              restSecs={restSecs}
            />
          )}

          {/* Navigation */}
          <div style={{
            display: "flex", gap: 12, padding: "16px 20px 36px",
            borderTop: "1px solid #1e293b", background: "#0f172a",
            position: "sticky", bottom: 0,
          }}>
            {!isFirst ? (
              <button onClick={() => setIdx(i => i - 1)} style={{
                flex: 1, padding: "17px 0", borderRadius: 14,
                border: "1px solid #334155", background: "#1e293b",
                color: "#e2e8f0", fontSize: 17, fontWeight: 700, cursor: "pointer",
                minHeight: 54,
              }}>
                ← Previous
              </button>
            ) : (
              <div style={{ flex: 1 }} />
            )}
            <button onClick={() => isLast ? onClose() : setIdx(i => i + 1)} style={{
              flex: isFirst ? 2 : 1, padding: "17px 0", borderRadius: 14,
              border: "none",
              background: isLast ? "#16a34a" : "#3b82f6",
              color: "#fff", fontSize: 17, fontWeight: 700, cursor: "pointer",
              boxShadow: "0 4px 16px rgba(0,0,0,0.35)",
              minHeight: 54,
            }}>
              {isLast ? "✓ Finish" : "Next →"}
            </button>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  ACCESS GATE
    // ═══════════════════════════════════════════════════════════════

    function AccessGate({ onSuccess }) {
      const [code,    setCode]    = useState("");
      const [error,   setError]   = useState(null);
      const [loading, setLoading] = useState(false);

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!code.trim()) return;
        setLoading(true); setError(null);
        try {
          const res  = await fetch(`${API_BASE}/verify-code`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ code: code.trim() }),
          });
          const data = await res.json();
          if (data.ok) {
            onSuccess(code.trim());
          } else {
            setError("Incorrect code — try again.");
            setCode("");
          }
        } catch (_) {
          setError("Could not reach server. Check your connection.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div style={{
          minHeight: "100vh",
          background: "linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%)",
          display: "flex", alignItems: "center", justifyContent: "center",
          fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          padding: "24px",
        }}>
          <div style={{ width: "100%", maxWidth: 380, textAlign: "center" }}>
            <div style={{ fontSize: 56, marginBottom: 12 }}>🏊‍♂️</div>
            <h1 style={{ fontSize: 24, fontWeight: 900, color: "#fff", margin: "0 0 6px", letterSpacing: "-0.02em" }}>
              Swim Workout Generator
            </h1>
            <p style={{ color: "#64748b", fontSize: 14, margin: "0 0 32px" }}>
              Enter your access code to continue
            </p>
            <form onSubmit={handleSubmit} style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              <input
                type="password"
                value={code}
                onChange={e => setCode(e.target.value)}
                placeholder="Access code"
                autoFocus
                style={{
                  width: "100%", padding: "16px 18px", borderRadius: 12,
                  border: `1.5px solid ${error ? "#ef4444" : "#334155"}`,
                  background: "#1e293b", color: "#fff",
                  fontSize: 18, fontFamily: "inherit", outline: "none",
                  textAlign: "center", letterSpacing: "0.1em",
                }}
              />
              {error && (
                <div style={{ color: "#f87171", fontSize: 14 }}>{error}</div>
              )}
              <button
                type="submit"
                disabled={loading || !code.trim()}
                style={{
                  padding: "16px 0", borderRadius: 12, border: "none",
                  background: code.trim() ? "#3b82f6" : "#334155",
                  color: code.trim() ? "#fff" : "#64748b",
                  fontSize: 16, fontWeight: 700, cursor: code.trim() ? "pointer" : "not-allowed",
                  transition: "background 0.15s",
                }}>
                {loading ? "Checking…" : "Enter"}
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  MAIN APP
    // ═══════════════════════════════════════════════════════════════

    function App() {
      const [selectedType, setSelectedType] = useState(null);
      const [maxYards, setMaxYards]         = useState(2400);
      const [workout, setWorkout]           = useState(null);
      const [hover, setHover]               = useState(null);
      const [equipment, setEquipment]       = useState({
        kickboard: false, fins: false, paddles: false, pullBuoy: false,
      });

      // History state
      const [view, setView]                       = useState("generator"); // "generator" | "history"
      const [history, setHistory]                 = useState(() => loadLocalHistory());
      const [historyLoaded, setHistoryLoaded]     = useState(false);
      const [loadedFromHistoryId, setLoadedFromHistoryId] = useState(null);
      const [saveStatus, setSaveStatus]           = useState(null); // null | "saving" | "saved" | "error"
      const [saveError, setSaveError]             = useState(null);
      const [dateDraft, setDateDraft]             = useState(() => new Date().toISOString().slice(0, 10));
      const [noteDraft, setNoteDraft]             = useState("");
      const [initialsDraft, setInitialsDraft]     = useState(() => {
        try { return normalizeInitials(localStorage.getItem(USER_INITIALS_KEY) || ""); }
        catch (_) { return ""; }
      });
      // Per-section regeneration error: { section: "warmup"|"drill"|"main"|"cooldown", message } | null
      const [regenError, setRegenError]           = useState(null);
      // Run Workout overlay: null when inactive, or the workout/entry object being stepped through
      const [runWorkout, setRunWorkout]           = useState(null);
      const [showRestPicker, setShowRestPicker]   = useState(false);
      const [restSecs,      setRestSecs]          = useState(10); // null=manual, 0/5/10/15=auto
      // Print dialog: show "save before printing?" prompt for unsaved workouts
      const [showPrintDialog, setShowPrintDialog] = useState(false);
      // Auth: authChecked flips to true once we know whether a stored code is valid
      const [accessCode,  setAccessCode]  = useState(null);
      const [authChecked, setAuthChecked] = useState(false);

      // On mount: verify any stored access code, then proceed
      useEffect(() => {
        const stored = localStorage.getItem(ACCESS_CODE_KEY);
        if (!stored) { setAuthChecked(true); return; }
        fetch(`${API_BASE}/verify-code`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: stored }),
        })
          .then(r => r.json())
          .then(data => {
            if (data.ok) { setAccessCode(stored); }
            else { localStorage.removeItem(ACCESS_CODE_KEY); }
            setAuthChecked(true);
          })
          .catch(() => {
            // Network error on verify — trust the stored code rather than locking out
            setAccessCode(stored);
            setAuthChecked(true);
          });
      }, []);

      // On mount: fetch live history from the API, merge with localStorage cache
      useEffect(() => {
        let cancelled = false;
        fetch(`${API_BASE}/workouts`, { cache: "no-store" })
          .then(r => r.ok ? r.json() : [])
          .then(remote => {
            if (cancelled) return;
            const merged = mergeById(loadLocalHistory(), Array.isArray(remote) ? remote : []);
            setHistory(merged);
            saveLocalHistory(merged);
            setHistoryLoaded(true);
          })
          .catch(() => { if (!cancelled) setHistoryLoaded(true); });
        return () => { cancelled = true; };
      }, []);

      const [openSwapKey, setOpenSwapKey] = useState(null);

      const handleToggleSwap = useCallback((blockIdx, setIdx) => {
        const key = `${blockIdx}-${setIdx}`;
        setOpenSwapKey(prev => prev === key ? null : key);
      }, []);

      const handleApplySwap = useCallback((blockIdx, setIdx, newSet) => {
        setWorkout(prev => {
          const blocks = prev.blocks.map((b, bi) => {
            if (bi !== blockIdx) return b;
            const sets = b.sets.map((s, si) => si === setIdx ? newSet : s);
            const totalYards = sets.reduce((sum, s) => sum + s.reps * s.dist, 0);
            return { ...b, sets, totalYards };
          });
          return { ...prev, blocks };
        });
        setOpenSwapKey(null);
      }, []);

      // ── Pace rescaling ────────────────────────────────────────────
      const PACE_BASELINE_SECS = 120; // app intervals calibrated for 2:00/100yd
      const [paceInput, setPaceInput] = useState("2:00");

      const handleApplyPace = useCallback(() => {
        const parts = paceInput.trim().split(":");
        if (parts.length !== 2) return;
        const userSecs = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
        if (!userSecs || userSecs < 30 || userSecs > 300) return;
        const ratio = userSecs / PACE_BASELINE_SECS;
        setWorkout(prev => {
          const newBlocks = prev.blocks.map(b => ({
            ...b,
            sets: b.sets.map(s => ({ ...s, interval: scaleInterval(s.interval, ratio) })),
          }));
          return { ...prev, blocks: newBlocks, estimatedMin: calcEstimatedMin(newBlocks) };
        });
      }, [paceInput]);

      // ── Per-set interval editing ──────────────────────────────────
      const [editIntervalKey,   setEditIntervalKey]   = useState(null);
      const [editIntervalDraft, setEditIntervalDraft] = useState("");

      const handleStartEditInterval = useCallback((bIdx, sIdx, current) => {
        setEditIntervalKey(`${bIdx}-${sIdx}`);
        setEditIntervalDraft(current);
        setOpenSwapKey(null);
      }, []);

      const handleCommitInterval = useCallback((bIdx, sIdx, draft) => {
        const val = draft.trim();
        if (val) {
          setWorkout(prev => {
            const newBlocks = prev.blocks.map((b, bi) => bi !== bIdx ? b : {
              ...b,
              sets: b.sets.map((s, si) => si !== sIdx ? s : { ...s, interval: val }),
            });
            return { ...prev, blocks: newBlocks, estimatedMin: calcEstimatedMin(newBlocks) };
          });
        }
        setEditIntervalKey(null);
        setEditIntervalDraft("");
      }, []);

      const handleCancelInterval = useCallback(() => {
        setEditIntervalKey(null);
        setEditIntervalDraft("");
      }, []);

      const handleGenerate = useCallback(() => {
        if (!selectedType) return;
        setWorkout(generateWorkout(selectedType, maxYards, equipment));
        setLoadedFromHistoryId(null);
        setSaveStatus(null); setSaveError(null);
        setRegenError(null);
        setDateDraft(new Date().toISOString().slice(0, 10));
        setNoteDraft("");
        setOpenSwapKey(null);
        setEditIntervalKey(null);
        setPaceInput("2:00");
      }, [selectedType, maxYards, equipment]);

      // Regenerate one section in place, holding the other three fixed.
      // On failure (no valid alternative), keep the workout untouched and
      // surface a per-section inline error.
      const handleRegenerateSection = useCallback((sectionKey) => {
        if (!workout || !selectedType) return;
        const result = regenerateSection(workout, selectedType, sectionKey, maxYards, equipment);
        if (result.error) {
          setRegenError({ section: sectionKey, message: result.error });
          return;
        }
        setWorkout(result.workout);
        setRegenError(null);
        // A single-section regen makes this a fresh, unsaved workout — even if
        // it was previously loaded from history.
        setLoadedFromHistoryId(null);
        setSaveStatus(null); setSaveError(null);
      }, [workout, selectedType, maxYards, equipment]);

      const handleTypeSelect = (id) => { setSelectedType(id); setWorkout(null); setLoadedFromHistoryId(null); setSaveStatus(null); setRegenError(null); };
      const handleMaxChange  = (v)  => { setMaxYards(v); setWorkout(null); setLoadedFromHistoryId(null); setSaveStatus(null); setRegenError(null); };
      const handleEquipChange = (id, on) => {
        setEquipment(prev => ({ ...prev, [id]: on }));
        setWorkout(null);
        setLoadedFromHistoryId(null);
        setSaveStatus(null);
        setRegenError(null);
      };

      // Save the current workout to history (POST to worker, optimistic local update)
      const handleSave = useCallback(async () => {
        if (!workout || !selectedType) return;
        setSaveStatus("saving"); setSaveError(null);
        const meta = WORKOUT_TYPES.find(t => t.id === selectedType);
        const cleanInitials = normalizeInitials(initialsDraft);
        // Remember the last-used initials for next time (best-effort).
        try {
          if (cleanInitials) localStorage.setItem(USER_INITIALS_KEY, cleanInitials);
        } catch (_) {}
        const entry = {
          id: makeEntryId(),
          savedAt: new Date().toISOString(),
          dateCompleted: dateDraft,
          type: selectedType,
          typeLabel: meta ? meta.label : selectedType,
          totalYards: workout.totalYards,
          estimatedMin: workout.estimatedMin,
          maxYardsCap: maxYards,
          equipment: { ...equipment },
          blocks: workout.blocks.map(b => ({
            name: b.name, section: b.section, totalYards: b.totalYards,
            sets: b.sets.map(s => ({ ...s })),
          })),
          userInitials: cleanInitials,
          notes: (noteDraft || "").trim(),
        };
        // Optimistic: add to local cache and state immediately
        setHistory(prev => {
          const next = mergeById(prev, [entry]);
          saveLocalHistory(next);
          return next;
        });
        try {
          const res = await fetch(`${API_BASE}/log-workout`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-access-code": accessCode || "" },
            body: JSON.stringify(entry),
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            throw new Error(body.error || `HTTP ${res.status}`);
          }
          setSaveStatus("saved");
          setNoteDraft("");
        } catch (err) {
          setSaveStatus("error");
          setSaveError(err.message || String(err));
        }
      }, [workout, selectedType, maxYards, equipment, dateDraft, noteDraft, initialsDraft]);

      const handleUpdateNotes = useCallback(async (id, notes) => {
        setHistory(prev => {
          const next = prev.map(e => e.id === id ? { ...e, notes } : e);
          saveLocalHistory(next);
          return next;
        });
        try {
          await fetch(`${API_BASE}/workouts/${id}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json", "x-access-code": accessCode || "" },
            body: JSON.stringify({ notes }),
          });
        } catch (err) { console.error("Failed to update notes:", err); }
      }, []);

      const handleDelete = useCallback(async (id) => {
        setHistory(prev => {
          const next = prev.filter(e => e.id !== id);
          saveLocalHistory(next);
          return next;
        });
        try {
          await fetch(`${API_BASE}/workouts/${id}`, {
            method: "DELETE",
            headers: { "x-access-code": accessCode || "" },
          });
        } catch (err) { console.error("Failed to delete entry:", err); }
      }, []);

      // Load a past workout into the generator view and trigger Print
      const handleLoadAndPrint = useCallback((entry) => {
        setSelectedType(entry.type);
        setMaxYards(entry.maxYardsCap || 2400);
        setEquipment(entry.equipment || { kickboard: false, fins: false, paddles: false, pullBuoy: false });
        // Reconstruct a workout-shaped object from the saved entry
        setWorkout({
          blocks: entry.blocks,
          totalYards: entry.totalYards,
          estimatedMin: entry.estimatedMin,
          typeId: entry.type,
        });
        setLoadedFromHistoryId(entry.id);
        setSaveStatus(null);
        setRegenError(null);
        setView("generator");
        // Wait for the next paint, then open the print dialog
        setTimeout(() => window.print(), 150);
      }, []);

      // Repeat a historical workout as a fresh, unsaved one. Same blocks/type/
      // equipment as the source entry, but loadedFromHistoryId stays null so
      // the Save form appears with today's date and empty notes. Per-section
      // regenerate buttons remain enabled — user can shuffle pieces before
      // logging the repeat as its own history entry.
      const handleRepeatFromHistory = useCallback((entry) => {
        setSelectedType(entry.type);
        setMaxYards(entry.maxYardsCap || 2400);
        setEquipment(entry.equipment || { kickboard: false, fins: false, paddles: false, pullBuoy: false });
        setWorkout({
          blocks: entry.blocks,
          totalYards: entry.totalYards,
          estimatedMin: entry.estimatedMin,
          typeId: entry.type,
        });
        setLoadedFromHistoryId(null);     // treat as fresh / unsaved
        setSaveStatus(null); setSaveError(null);
        setRegenError(null);
        setDateDraft(new Date().toISOString().slice(0, 10));
        setNoteDraft("");
        setView("generator");
      }, []);

      // Auth gate — render nothing while checking, show gate if no valid code
      if (!authChecked) return null;
      if (!accessCode) return (
        <AccessGate onSuccess={code => {
          localStorage.setItem(ACCESS_CODE_KEY, code);
          setAccessCode(code);
        }} />
      );

      const meta = WORKOUT_TYPES.find(t => t.id === selectedType);
      const sectionColors = ["#38bdf8", "#2dd4bf", "#3b82f6", "#94a3b8"];
      const typeMin = selectedType ? minYardsForType(selectedType) : 0;
      const canGenerate = selectedType && maxYards >= typeMin;

      return (
        <div style={{ minHeight: "100vh", background: "linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%)" }}>
          {/* Header */}
          <div className="screen-only" style={{ background: "#0f172a", borderBottom: "1px solid #1e40af", boxShadow: "0 4px 20px rgba(0,0,0,0.4)" }}>
            <div style={{ maxWidth: 940, margin: "0 auto", padding: "20px 24px", display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ fontSize: 36 }}>🏊‍♂️</span>
              <div style={{ flex: 1 }}>
                <h1 style={{ fontSize: 26, fontWeight: 900, color: "#fff", margin: 0, letterSpacing: "-0.02em" }}>Swim Workout Generator</h1>
                <p style={{ color: "#93c5fd", fontSize: 13, margin: "2px 0 0" }}>~60 min · Masters / Competitive Swimmer</p>
              </div>
              <button onClick={() => setView(v => v === "generator" ? "history" : "generator")}
                style={{
                  padding: "8px 14px", borderRadius: 8,
                  border: "1px solid #334155", background: "#1e293b",
                  color: "#e2e8f0", fontSize: 13, fontWeight: 600,
                  cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6,
                }}>
                {view === "generator" ? "📜 History" : "⏎ Generator"}
                {view === "generator" && history.length > 0 && (
                  <span style={{ background: "#3b82f6", color: "#fff", borderRadius: 999, padding: "1px 8px", fontSize: 10, fontWeight: 700 }}>
                    {history.length}
                  </span>
                )}
              </button>
            </div>
          </div>

          <div style={{ maxWidth: 940, margin: "0 auto", padding: "32px 24px" }}>

            {view === "history" && (
              <HistoryView
                history={history}
                historyLoaded={historyLoaded}
                onUpdateNotes={handleUpdateNotes}
                onDelete={handleDelete}
                onLoadAndPrint={handleLoadAndPrint}
                onRepeat={handleRepeatFromHistory}
                onRun={entry => { setRunWorkout(entry); setShowRestPicker(true); }}
              />
            )}

            {view === "generator" && <>

            {/* Workout type selector */}
            <p className="screen-only" style={{ color: "#93c5fd", fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.15em", marginBottom: 12, marginTop: 0 }}>
              Select Workout Type
            </p>
            <div className="screen-only" style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 20 }}>
              {WORKOUT_TYPES.map(t => {
                const isSel = selectedType === t.id;
                const isHov = hover === t.id;
                return (
                  <button key={t.id}
                    onClick={() => handleTypeSelect(t.id)}
                    onMouseEnter={() => setHover(t.id)}
                    onMouseLeave={() => setHover(null)}
                    style={{
                      borderRadius: 12, border: `2px solid ${isSel ? t.selBg : t.border}`,
                      padding: 16, textAlign: "left", cursor: "pointer",
                      background: isSel ? t.selBg : "#1e293b",
                      color: isSel ? "#fff" : "#e2e8f0",
                      transform: isSel ? "scale(1.02)" : isHov ? "scale(1.01)" : "scale(1)",
                      transition: "all 0.15s",
                      boxShadow: isSel ? "0 8px 24px rgba(0,0,0,0.35)" : "none",
                      outline: "none",
                    }}>
                    <div style={{ fontSize: 24, marginBottom: 4 }}>{t.emoji}</div>
                    <div style={{ fontWeight: 700, fontSize: 13 }}>{t.label}</div>
                    <div style={{ fontSize: 11, marginTop: 2, opacity: 0.75 }}>{t.description}</div>
                  </button>
                );
              })}
            </div>

            <div className="screen-only">
              {/* Equipment checkboxes */}
              <EquipmentPicker equipment={equipment} onChange={handleEquipChange} />

              {/* Max Yardage Slider */}
              <YardageSlider value={maxYards} onChange={handleMaxChange} selectedType={selectedType} />

              {/* Generate Button */}
              <button
                onClick={handleGenerate}
                disabled={!canGenerate}
                style={{
                  width: "100%", padding: "14px 0", borderRadius: 12, border: "none",
                  fontWeight: 700, fontSize: 15, cursor: canGenerate ? "pointer" : "not-allowed",
                  background: canGenerate ? meta.selBg : "#334155",
                  color: canGenerate ? "#fff" : "#64748b",
                  boxShadow: canGenerate ? "0 8px 24px rgba(0,0,0,0.3)" : "none",
                  transition: "all 0.15s", marginBottom: 32, outline: "none",
                }}>
                {workout ? "🔄 Generate New Workout" : "🏊 Generate Workout"}
              </button>
            </div>

            {/* Workout display */}
            {workout && (
              <div>
                {/* Summary bar (screen) */}
                <div className="screen-only" style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 12, padding: 20, marginBottom: 16, display: "flex", flexWrap: "wrap", gap: 24, alignItems: "center" }}>
                  <span style={{ background: meta.badge, color: meta.badgeText, borderRadius: 999, padding: "4px 12px", fontSize: 12, fontWeight: 700 }}>
                    {meta.emoji} {meta.label}
                  </span>
                  {[
                    ["Total Yardage",  `${workout.totalYards.toLocaleString()} yards`],
                    ["Est. Duration",   `~${workout.estimatedMin} min`],
                    ["Target Range",   `1,900 – ${maxYards.toLocaleString()} yds`],
                  ].map(([label, val]) => (
                    <div key={label}>
                      <div style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>{label}</div>
                      <div style={{ fontSize: 20, fontWeight: 900, color: "#fff" }}>
                        {val.split(" ")[0]}
                        <span style={{ fontSize: 12, fontWeight: 400, color: "#94a3b8" }}> {val.split(" ").slice(1).join(" ")}</span>
                      </div>
                    </div>
                  ))}
                  <div style={{ marginLeft: "auto", display: "flex", gap: 8 }}>
                    <button
                      onClick={() => { setRunWorkout(workout); setShowRestPicker(true); }}
                      style={{
                        padding: "10px 16px", borderRadius: 8,
                        border: "1px solid #3b82f6", background: "#1e3a5f", color: "#93c5fd",
                        fontSize: 13, fontWeight: 700, cursor: "pointer",
                        display: "inline-flex", alignItems: "center", gap: 6,
                      }}
                      title="Step through this workout section by section">
                      ▶ Run
                    </button>
                    <button
                      onClick={() => {
                        if (loadedFromHistoryId) {
                          // Already saved — print directly
                          window.print();
                        } else {
                          // Unsaved fresh workout — ask first
                          setShowPrintDialog(true);
                        }
                      }}
                      style={{
                        padding: "10px 16px", borderRadius: 8,
                        border: "1px solid #475569", background: "#0f172a", color: "#e2e8f0",
                        fontSize: 13, fontWeight: 700, cursor: "pointer",
                        display: "inline-flex", alignItems: "center", gap: 6,
                      }}
                      title="Print a clean B&W 8.5×11 version of this workout">
                      🖨 Print Workout
                    </button>
                  </div>
                </div>

                {/* Print-only header */}
                <div className="print-only print-header">
                  <h1 className="print-title">{meta.label} Swim Workout</h1>
                  <p className="print-subtitle">{meta.description}</p>
                  <div className="print-meta">
                    <span><b>Date:</b> {new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</span>
                    <span><b>Total:</b> {workout.totalYards.toLocaleString()} yds</span>
                    <span><b>Duration:</b> ~{workout.estimatedMin} min</span>
                    <span><b>Pace target:</b> ~{paceInput} / 100 yds</span>
                  </div>
                </div>

                {/* Section breakdown bar (screen only) */}
                <div className="screen-only" style={{ display: "flex", gap: 3, height: 10, borderRadius: 999, overflow: "hidden", marginBottom: 8 }}>
                  {workout.blocks.map((b, i) => (
                    <div key={i}
                      style={{ width: `${(b.totalYards / workout.totalYards * 100).toFixed(1)}%`, background: sectionColors[i] }}
                      title={`${b.name}: ${b.totalYards} yds`}
                    />
                  ))}
                </div>
                <div className="screen-only" style={{ display: "flex", gap: 16, marginBottom: 20, flexWrap: "wrap" }}>
                  {workout.blocks.map((b, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, fontSize: 11, color: "#94a3b8" }}>
                      <span style={{ width: 8, height: 8, borderRadius: "50%", background: sectionColors[i], display: "inline-block" }} />
                      <span style={{ color: sectionColors[i] }}>{b.name}</span>
                      <span>({b.totalYards} yds)</span>
                    </div>
                  ))}
                </div>

                {/* Pace control (screen only) */}
                <div className="screen-only" style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 16, padding: "10px 16px", background: "#1e293b", borderRadius: 10, border: "1px solid #334155", flexWrap: "wrap" }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>100 yd pace</span>
                  <input
                    type="text"
                    value={paceInput}
                    onChange={e => setPaceInput(e.target.value)}
                    onKeyDown={e => e.key === "Enter" && handleApplyPace()}
                    placeholder="M:SS"
                    style={{ width: 58, fontFamily: "monospace", fontSize: 13, padding: "4px 7px", borderRadius: 6, border: "1px solid #475569", background: "#0f172a", color: "#e2e8f0" }}
                  />
                  <button onClick={handleApplyPace}
                    style={{ fontSize: 12, fontWeight: 600, padding: "4px 13px", borderRadius: 6, border: "1px solid #3b82f6", background: "#1d4ed8", color: "#fff", cursor: "pointer" }}>
                    Rescale all
                  </button>
                  <span style={{ fontSize: 11, color: "#475569" }}>· Click any interval to edit directly</span>
                </div>

                {/* Workout blocks */}
                {workout.blocks.map((block, i) => (
                  <WorkoutBlock
                    key={i}
                    block={block}
                    equipment={equipment}
                    onRegenerate={handleRegenerateSection}
                    regenError={regenError && regenError.section === block.section ? regenError.message : null}
                    blockIdx={i}
                    openSwapKey={openSwapKey}
                    onToggleSwap={handleToggleSwap}
                    onApplySwap={handleApplySwap}
                    editIntervalKey={editIntervalKey}
                    editIntervalDraft={editIntervalDraft}
                    setEditIntervalDraft={setEditIntervalDraft}
                    onStartEditInterval={handleStartEditInterval}
                    onCommitInterval={handleCommitInterval}
                    onCancelInterval={handleCancelInterval}
                  />
                ))}

                {/* Coach note (screen only — user opted not to include in print) */}
                <div className="screen-only" style={{ marginTop: 20, background: "rgba(30,41,59,0.6)", borderRadius: 12, padding: 16, border: "1px solid #334155", color: "#94a3b8", fontSize: 13 }}>
                  <span style={{ fontWeight: 600, color: "#cbd5e1" }}>📋 Coach's Note: </span>
                  Intervals are calibrated for a masters pace of 2:00–2:15/100 yds. Adjust ±10–15 sec to match your base.
                  Always prioritize stroke mechanics over hitting a split — especially on drill and technique sets.
                </div>

                {/* Save-to-history form (only for freshly generated workouts) */}
                {!loadedFromHistoryId && (
                  <SaveToHistoryForm
                    dateDraft={dateDraft} setDateDraft={setDateDraft}
                    initialsDraft={initialsDraft} setInitialsDraft={setInitialsDraft}
                    noteDraft={noteDraft} setNoteDraft={setNoteDraft}
                    saveStatus={saveStatus} saveError={saveError}
                    onSave={handleSave}
                  />
                )}

                {/* Banner for workouts loaded from history */}
                {loadedFromHistoryId && (
                  <div className="screen-only" style={{ marginTop: 20, background: "#1e293b", border: "1px dashed #475569", borderRadius: 8, padding: "10px 14px", fontSize: 12, color: "#94a3b8" }}>
                    📜 Loaded from history. To save a new workout, click <b>Generate New Workout</b> above.
                  </div>
                )}
              </div>
            )}

            {/* Empty state */}
            {!workout && (
              <div className="screen-only" style={{ textAlign: "center", padding: "60px 0", color: "#475569" }}>
                <div style={{ fontSize: 56, marginBottom: 12 }}>🌊</div>
                <p style={{ fontSize: 18, fontWeight: 500, color: "#94a3b8", margin: 0 }}>Pick a type, set your max yardage, and generate</p>
                <p style={{ fontSize: 13, marginTop: 4, color: "#475569" }}>Each press produces a fresh workout within your range</p>
              </div>
            )}

            </>}
          </div>
          {showPrintDialog && (
            <div className="screen-only" style={{
              position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)",
              display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000,
            }}
              onClick={() => setShowPrintDialog(false)}>
              <div style={{
                background: "#1e293b", border: "1px solid #334155", borderRadius: 12,
                padding: "28px 32px", maxWidth: 400, width: "90%", boxShadow: "0 20px 60px rgba(0,0,0,0.6)",
              }}
                onClick={e => e.stopPropagation()}>
                <div style={{ fontSize: 22, marginBottom: 8 }}>🖨 Print Workout</div>
                <p style={{ color: "#cbd5e1", fontSize: 14, margin: "0 0 24px 0", lineHeight: 1.5 }}>
                  Would you like to save this workout to your history before printing?
                </p>
                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  <button
                    onClick={async () => {
                      setShowPrintDialog(false);
                      await handleSave();
                      setTimeout(() => window.print(), 150);
                    }}
                    style={{
                      flex: 1, padding: "10px 16px", borderRadius: 8,
                      border: "none", background: "#2563eb", color: "#fff",
                      fontSize: 13, fontWeight: 700, cursor: "pointer",
                    }}>
                    Save &amp; Print
                  </button>
                  <button
                    onClick={() => { setShowPrintDialog(false); setTimeout(() => window.print(), 150); }}
                    style={{
                      flex: 1, padding: "10px 16px", borderRadius: 8,
                      border: "1px solid #475569", background: "transparent", color: "#cbd5e1",
                      fontSize: 13, fontWeight: 600, cursor: "pointer",
                    }}>
                    Print Without Saving
                  </button>
                  <button
                    onClick={() => setShowPrintDialog(false)}
                    style={{
                      width: "100%", padding: "8px 16px", borderRadius: 8,
                      border: "1px solid #334155", background: "transparent", color: "#64748b",
                      fontSize: 13, cursor: "pointer", marginTop: 2,
                    }}>
                    Cancel
                  </button>
                </div>
              </div>
            </div>
          )}
          {showRestPicker && runWorkout && (
            <RestPickerModal
              restSecs={restSecs}
              onChange={setRestSecs}
              onStart={() => setShowRestPicker(false)}
              onCancel={() => { setRunWorkout(null); setShowRestPicker(false); }}
            />
          )}
          {!showRestPicker && runWorkout && (
            <RunWorkoutOverlay workout={runWorkout} restSecs={restSecs} onClose={() => setRunWorkout(null)} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
