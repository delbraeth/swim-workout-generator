<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swim Workout Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #0f172a; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    /* Slider styling */
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    /* Default visibility for the print/screen helper classes */
    .print-only { display: none; }

    /* Equipment picker — responsive grid (auto-fits 4 cols on desktop, 2 on mobile) */
    .equipment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

    /* ────────────────────────────────────────────────────────────
       PRINT STYLES — clean, high-contrast, 8.5×11 B&W
       Hides all interactive UI, strips backgrounds and colors,
       and uses serif typography for readable swim-deck output.
       ──────────────────────────────────────────────────────────── */
    @media print {
      @page { size: letter portrait; margin: 0.55in 0.5in; }

      html, body {
        background: #fff !important;
        color: #000 !important;
        font-family: Georgia, "Times New Roman", serif !important;
        font-size: 11pt !important;
        line-height: 1.35 !important;
      }

      /* Strip every background, shadow, and color so output is pure B&W */
      *, *::before, *::after {
        background: #fff !important;
        background-color: #fff !important;
        background-image: none !important;
        color: #000 !important;
        box-shadow: none !important;
        text-shadow: none !important;
        border-color: #000 !important;
      }

      .screen-only { display: none !important; }
      .print-only  { display: block !important; }

      /* Print header — workout title, type, date, totals */
      .print-header {
        border-bottom: 2.5pt solid #000 !important;
        padding-bottom: 8pt !important;
        margin-bottom: 14pt !important;
      }
      .print-title {
        font-size: 22pt !important;
        font-weight: 700 !important;
        margin: 0 !important;
        letter-spacing: -0.01em !important;
      }
      .print-subtitle {
        font-size: 11pt !important;
        margin: 4pt 0 0 0 !important;
        font-style: italic !important;
      }
      .print-meta {
        margin-top: 6pt !important;
        font-size: 11pt !important;
      }
      .print-meta span { margin-right: 18pt !important; }
      .print-meta b { font-weight: 700 !important; }

      /* Workout block — keep section together on one page when possible */
      .workout-block {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        border: 1.5pt solid #000 !important;
        border-radius: 0 !important;
        margin-bottom: 10pt !important;
      }
      .workout-block-header {
        border-bottom: 1pt solid #000 !important;
        padding: 5pt 9pt !important;
        font-size: 11.5pt !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
      }
      .workout-block-header > div > span:first-child { display: none !important; } /* hide colored dot */

      /* Tables */
      .workout-block table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      .workout-block thead tr { border-bottom: 1pt solid #000 !important; }
      .workout-block th {
        padding: 4pt 7pt !important;
        font-size: 8.5pt !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.04em !important;
        text-align: left !important;
        font-family: Georgia, serif !important;
      }
      .workout-block td {
        padding: 5pt 7pt !important;
        font-size: 10pt !important;
        font-style: normal !important;
        border-top: 0.5pt solid #555 !important;
        font-family: Georgia, serif !important;
        vertical-align: top !important;
      }
      .workout-block td:nth-child(1) { font-weight: 700 !important; white-space: nowrap !important; width: 11% !important; }
      .workout-block td:nth-child(2) { font-weight: 700 !important; white-space: nowrap !important; width: 12% !important; }
      .workout-block td:nth-child(3) { width: 42% !important; }
      .workout-block td:nth-child(4) { font-family: "Courier New", monospace !important; white-space: nowrap !important; width: 12% !important; }
      .workout-block td:nth-child(5) { font-style: italic !important; width: 23% !important; }

      /* Equipment badges hidden — equipment is in description text */
      .equipment-badges { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useCallback, useMemo, useEffect } = React;

    // ═══════════════════════════════════════════════════════════════
    //  HISTORY BACKEND CONFIG — same origin as the page, so all paths
    //  are relative. The Node server (see server.js + Dockerfile)
    //  handles GitHub commits server-side; no secrets in this file.
    // ═══════════════════════════════════════════════════════════════
    const API_BASE  = "/api";                 // same origin
    const BUILD_ID  = "2026-05-12 16:49 UTC";         // replaced by _deploy.py at commit time

    // CSRF token bound to the session. Fetched after auth-status confirms login,
    // sent on every write as the X-CSRF-Token header.
    const csrf = { token: null };
    async function refreshCsrf() {
      try {
        const r = await fetch(`${API_BASE}/auth/csrf`, { cache: "no-store" });
        if (!r.ok) return;
        const d = await r.json();
        csrf.token = d.token || null;
      } catch { /* leave previous value */ }
    }
    function csrfHeaders() {
      return csrf.token ? { "X-CSRF-Token": csrf.token } : {};
    }

    // Normalize raw initials input: trim, uppercase, alphanumeric only, max 4 chars.
    function normalizeInitials(raw) {
      return (raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    }

    const HISTORY_LOCAL_KEY = "swim_history_v1";
    const USER_INITIALS_KEY = "swim_user_initials";

    function loadLocalHistory() {
      try { const raw = localStorage.getItem(HISTORY_LOCAL_KEY); return raw ? JSON.parse(raw) : []; }
      catch (_) { return []; }
    }
    function saveLocalHistory(entries) {
      try { localStorage.setItem(HISTORY_LOCAL_KEY, JSON.stringify(entries)); } catch (_) {}
    }
    // Merge two entry lists by id (b wins on conflict), then sort newest-first by dateCompleted.
    function mergeById(a, b) {
      const map = new Map();
      for (const e of a) if (e && e.id) map.set(e.id, e);
      for (const e of b) if (e && e.id) map.set(e.id, e);
      return [...map.values()].sort((x, y) => (y.dateCompleted || "").localeCompare(x.dateCompleted || ""));
    }
    function makeEntryId() {
      return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // ═══════════════════════════════════════════════════════════════
    //  WORKOUT TYPE METADATA
    // ═══════════════════════════════════════════════════════════════
    const WORKOUT_TYPES = [
      { id: "im",        label: "IM Focus",         emoji: "🔄", description: "All four strokes — fly, back, breast, free",
        selBg: "#7c3aed", border: "#c4b5fd", badge: "#ede9fe", badgeText: "#5b21b6" },
      { id: "distance",  label: "Distance",         emoji: "🏊", description: "Longer swims, building aerobic base",
        selBg: "#2563eb", border: "#93c5fd", badge: "#dbeafe", badgeText: "#1e40af" },
      { id: "sprint",    label: "Sprint",           emoji: "⚡", description: "Short, fast swims with full recovery",
        selBg: "#dc2626", border: "#fca5a5", badge: "#fee2e2", badgeText: "#991b1b" },
      { id: "endurance", label: "Endurance",        emoji: "💪", description: "Steady-state, long continuous swims",
        selBg: "#16a34a", border: "#86efac", badge: "#dcfce7", badgeText: "#166534" },
      { id: "technique", label: "Technique",        emoji: "🎯", description: "Drills, kick sets, and stroke refinement",
        selBg: "#0d9488", border: "#5eead4", badge: "#ccfbf1", badgeText: "#115e59" },
      { id: "mixed",     label: "Mixed",            emoji: "🔀", description: "Sprints, distance, and drills combined",
        selBg: "#ea580c", border: "#fdba74", badge: "#ffedd5", badgeText: "#9a3412" },
      { id: "back",      label: "Specialty Back",   emoji: "🔙", description: "Backstroke focus across drills and main set",
        selBg: "#0891b2", border: "#67e8f9", badge: "#cffafe", badgeText: "#155e75" },
      { id: "breast",    label: "Specialty Breast", emoji: "🐸", description: "Breaststroke focus across drills and main set",
        selBg: "#db2777", border: "#f9a8d4", badge: "#fce7f3", badgeText: "#9d174d" },
      { id: "fly",       label: "Specialty Fly",    emoji: "🦋", description: "Butterfly focus (with free recovery throughout)",
        selBg: "#ca8a04", border: "#facc15", badge: "#fef9c3", badgeText: "#854d0e" },
    ];

    const SECTION_STYLES = {
      warmup:   { bg: "#f0f9ff", border: "#bae6fd", headerBg: "#e0f2fe", headerText: "#075985", dot: "#0ea5e9" },
      drill:    { bg: "#f0fdfa", border: "#99f6e4", headerBg: "#ccfbf1", headerText: "#134e4a", dot: "#14b8a6" },
      main:     { bg: "#f8fafc", border: "#e2e8f0", headerBg: "#334155", headerText: "#ffffff", dot: "#64748b" },
      cooldown: { bg: "#f9fafb", border: "#e5e7eb", headerBg: "#f3f4f6", headerText: "#374151", dot: "#9ca3af" },
    };

    // ═══════════════════════════════════════════════════════════════
    //  EFFORT-ZONE TAXONOMY (Session 2 H foundation)
    //  5 zones, green → red intensity gradient. Used for the small color
    //  pip rendered on block headers and on divergent set rows.
    //  Options can set `primary_zone` (and optional `secondary_zones`)
    //  explicitly; otherwise `inferZone()` derives a sensible default.
    // ═══════════════════════════════════════════════════════════════
    const ZONES = {
      easy:      { id: "easy",      label: "Easy",      color: "#22c55e", rank: 1 },
      aerobic:   { id: "aerobic",   label: "Aerobic",   color: "#3b82f6", rank: 2 },
      threshold: { id: "threshold", label: "Threshold", color: "#eab308", rank: 3 },
      vo2:       { id: "vo2",       label: "VO2",       color: "#f97316", rank: 4 },
      anaerobic: { id: "anaerobic", label: "Anaerobic", color: "#ef4444", rank: 5 },
    };
    const ZONE_ORDER = ["easy", "aerobic", "threshold", "vo2", "anaerobic"];

    // ═══════════════════════════════════════════════════════════════
    //  MESOCYCLE / TRAINING PHASE (N5)
    //  Five phases. User sets one in the Profile modal; it sticks until
    //  changed. The generator multiplies main-set pick weights by the
    //  phase's per-zone multiplier (in addition to fav/repeat/recent).
    //  Naming note: "recovery" PHASE is a longer-term setting; "recovery
    //  mode" (item C) is a per-generation toggle. They compose: a recovery-
    //  phase swimmer can still flip recovery mode on for an extra-easy day.
    // ═══════════════════════════════════════════════════════════════
    const PHASES = {
      base:     { id: "base",     label: "Base",     emoji: "🌱", color: "#0ea5e9",
                  description: "Aerobic foundation — high easy/aerobic volume",
                  multipliers: { easy: 1.2, aerobic: 1.5, threshold: 0.8, vo2: 0.5, anaerobic: 0.5 } },
      build:    { id: "build",    label: "Build",    emoji: "🔨", color: "#3b82f6",
                  description: "Threshold/VO2 emphasis — push the ceiling",
                  multipliers: { easy: 0.8, aerobic: 1.0, threshold: 1.5, vo2: 1.3, anaerobic: 0.8 } },
      peak:     { id: "peak",     label: "Peak",     emoji: "⛰️", color: "#a855f7",
                  description: "Race-specific intensity — sharpen the sword",
                  multipliers: { easy: 0.8, aerobic: 0.8, threshold: 1.0, vo2: 1.5, anaerobic: 1.5 } },
      taper:    { id: "taper",    label: "Taper",    emoji: "📉", color: "#eab308",
                  description: "Reduce volume, preserve sharpness",
                  multipliers: { easy: 1.5, aerobic: 1.3, threshold: 0.7, vo2: 0.5, anaerobic: 0.3 } },
      recovery: { id: "recovery", label: "Recovery", emoji: "🌿", color: "#22c55e",
                  description: "Active recovery — easy aerobic only",
                  multipliers: { easy: 2.0, aerobic: 1.5, threshold: 0.3, vo2: 0.2, anaerobic: 0.1 } },
    };
    const PHASE_ORDER = ["base", "build", "peak", "taper", "recovery"];

    // Parse "On 2:00", "On :45" → seconds (alias of parseIntervalSeconds without
    // depending on that function's later definition).
    function _intervalSecs(intervalStr) {
      if (!intervalStr || /no interval/i.test(intervalStr)) return null;
      const full = intervalStr.match(/(\d+):(\d{2})/);
      if (full) return parseInt(full[1], 10) * 60 + parseInt(full[2], 10);
      const sec  = intervalStr.match(/:(\d{2})/);
      if (sec)  return parseInt(sec[1], 10);
      return null;
    }

    // Heuristic zone inference from a single set's text + interval + distance.
    // Returns one of ZONE_ORDER. Keyword cues in desc/focus dominate; interval
    // tightness (work/total ratio) is the tie-breaker when text is ambiguous.
    function inferSetZone(set, sectionKey) {
      if (!set) return "aerobic";
      const text = `${set.desc || ""} ${set.focus || ""}`.toLowerCase();

      // Cooldowns are always easy unless desc says otherwise.
      if (sectionKey === "cooldown") {
        if (/sprint|fast|hard|all.?out|race/.test(text)) return "aerobic";
        return "easy";
      }

      // Strong keyword cues — explicit intensity language wins over heuristics.
      if (/all.?out|sprint|max(?!imum aerobic)|blast|empty the tank|top speed|race pace/.test(text)) {
        return "anaerobic";
      }
      if (/vo2|fast effort|fast,? hold|fast finish|fast close|fast,? fatigued/.test(text)) {
        return "vo2";
      }
      if (/threshold|t.?pace|rpe ?[78]/.test(text)) return "threshold";
      if (/easy|recovery|smooth|drill|technique/.test(text)) {
        // Warmups and drills lean easy/aerobic — bias to easy on these cues.
        return (sectionKey === "warmup" || sectionKey === "drill") ? "easy" : "aerobic";
      }
      if (/descend|build|negative.?split|strong/.test(text)) {
        // Descend/build sets typically climb into threshold by the end.
        return "threshold";
      }
      if (/moderate|steady|aerobic/.test(text)) return "aerobic";

      // Interval-tightness fallback: estimate seconds/100yd then bucket.
      // Tighter intervals = higher zone. This is a coarse signal.
      const secs = _intervalSecs(set.interval);
      const dist = Number(set.dist || 0);
      if (secs && dist > 0) {
        const per100 = secs / (dist / 100);
        if (per100 < 75)  return "anaerobic";     // < 1:15/100 — sprint-tight
        if (per100 < 95)  return "vo2";           // < 1:35/100
        if (per100 < 115) return "threshold";     // < 1:55/100
        if (per100 < 145) return "aerobic";       // < 2:25/100
        return "easy";
      }

      // Section-default fallback when text gives no signal.
      if (sectionKey === "warmup")   return "easy";
      if (sectionKey === "drill")    return "aerobic";
      if (sectionKey === "cooldown") return "easy";
      return "aerobic";
    }

    // Block-level zone: explicit `primary_zone` wins; otherwise take the
    // highest-rank zone across the block's sets (so a block with one vo2
    // finisher is shown as threshold/vo2, not aerobic).
    function inferBlockZone(block) {
      if (!block) return "aerobic";
      if (block.primary_zone && ZONES[block.primary_zone]) return block.primary_zone;
      const sets = Array.isArray(block.sets) ? block.sets : [];
      if (!sets.length) return "aerobic";
      // For warmup/cooldown, take the modal (most common) zone since they're
      // typically uniform and a single accent set shouldn't redefine the block.
      // For drill/main, take the *dominant by yardage* zone.
      const tally = {};
      for (const s of sets) {
        const z = s.zone || inferSetZone(s, block.section);
        const w = (s.reps || 1) * (s.dist || 0);
        tally[z] = (tally[z] || 0) + Math.max(1, w);
      }
      let best = null, bestW = -1;
      for (const [z, w] of Object.entries(tally)) {
        if (w > bestW) { best = z; bestW = w; }
      }
      return best || "aerobic";
    }

    // ═══════════════════════════════════════════════════════════════
    //  WORKOUT DATA — all options as flat arrays
    //  Every totalYards value is verified: sum of (reps × dist)
    // ═══════════════════════════════════════════════════════════════

    const WARMUP_OPTIONS = [
      { typeAffinity: ["sprint"], totalYards: 400, sets: [
          { reps: 1, dist: 400, desc: "Easy Freestyle", interval: "No interval — swim easy", focus: "Loosen up, steady breathing" },
        ]},
      { typeAffinity: ["technique", "sprint"], totalYards: 400, sets: [
          { reps: 1, dist: 200, desc: "Easy Freestyle", interval: "No interval", focus: "Settle into rhythm" },
          { reps: 4, dist:  50, desc: "25 Drill / 25 Easy Swim (stroke choice)", interval: "On 1:15", focus: "Feel for the water" },
        ]},
      { typeAffinity: ["endurance"], totalYards: 400, sets: [
          { reps: 1, dist: 300, desc: "Freestyle — build from easy to moderate", interval: "No interval", focus: "Gradually wake up" },
          { reps: 4, dist:  25, desc: "Kick (no board, streamlined)", interval: "On :40", focus: "Loosen hips and ankles" },
        ]},
      { typeAffinity: ["endurance"], totalYards: 500, sets: [
          { reps: 1, dist: 400, desc: "Freestyle — easy, focus on long stroke", interval: "No interval", focus: "Prime the aerobic engine" },
          { reps: 4, dist:  25, desc: "Backstroke — easy, open the shoulders", interval: "On :45", focus: "Counter the freestyle pull" },
        ]},
      { typeAffinity: ["endurance"], totalYards: 600, sets: [
          { reps: 1, dist: 400, desc: "Freestyle — build from easy to moderate", interval: "No interval", focus: "Aerobic warm-up, long stroke" },
          { reps: 4, dist:  50, desc: "Pull (buoy) — easy, focus on catch and extension", interval: "On 1:20", focus: "Upper-body prime before main set", eq: "pull" },
        ]},
      { typeAffinity: ["endurance"], totalYards: 700, sets: [
          { reps: 1, dist: 400, desc: "Easy Freestyle — settle in, count strokes", interval: "No interval", focus: "Efficiency awareness from the first lap" },
          { reps: 2, dist: 100, desc: "Kick (board optional) — moderate, even effort", interval: "On 2:30", focus: "Activate legs", eq: "kick" },
          { reps: 1, dist: 100, desc: "Easy backstroke — open the shoulders, counter freestyle pull", interval: "No interval", focus: "All-around warm-up close" },
        ]},
      { typeAffinity: ["technique", "endurance"], totalYards: 800, sets: [
          { reps: 1, dist: 400, desc: "Freestyle — very easy, nose down, minimal head movement", interval: "No interval", focus: "Prime body position and breathing pattern" },
          { reps: 4, dist:  50, desc: "Stroke drills — choice, one focus per 50", interval: "On 1:20", focus: "Technical warm-up" },
          { reps: 1, dist: 200, desc: "Freestyle — build from easy to moderate", interval: "No interval", focus: "Ramp up the aerobic engine before main set" },
        ]},
    ];

    const DRILL_OPTIONS = {
      im: [
        { totalYards: 300, sets: [
            { reps: 4, dist: 75, desc: "25 Fly Drill / 25 Back Drill / 25 Breast Drill", interval: "On 2:30", focus: "Feel each IM stroke before the main set" },
          ]},
        { totalYards: 400, sets: [
            { reps: 8, dist: 25, desc: "Stroke drills — 2 each: fly, back, breast, free", interval: "On :40",  focus: "Isolate technique per stroke" },
            { reps: 4, dist: 50, desc: "IM order kick — 12.5 yards each stroke",          interval: "On 1:45", focus: "Kick rhythm for each stroke", eq: "kick" },
          ]},
        { totalYards: 400, sets: [
            { reps: 4, dist: 50, desc: "IM order kick — 12.5 yards each stroke",          interval: "On 1:45", focus: "Wake up legs across IM strokes",   eq: "kick" },
            { reps: 2, dist: 100, desc: "Pull (buoy) — alternate 50 free / 50 stroke choice", interval: "On 2:15", focus: "Upper-body warm-up before IM main set", eq: "pull" },
          ]},
        { totalYards: 200, sets: [
            { reps: 4, dist: 25, desc: "Stroke drills — 1 each: fly, back, breast, free", interval: "On :40", focus: "Brief all-stroke activation" },
            { reps: 4, dist: 25, desc: "IM kick — 6 yards each stroke, no board",         interval: "On :45", focus: "Kick priming across all four strokes" },
          ]},
        { totalYards: 300, sets: [
            { reps: 3, dist: 100, desc: "100 IM — 25 each stroke, easy (not race pace)", interval: "On 2:30", focus: "Stroke flow and transition practice" },
          ]},
        { totalYards: 400, sets: [
            { reps: 4, dist: 100, desc: "100 IM — 25 drill each stroke, smooth transitions", interval: "On 2:30", focus: "Full-stroke drill sequence before IM main set" },
          ]},
        { totalYards: 500, sets: [
            { reps: 5, dist: 100, desc: "100 IM — 25 drill each stroke (fly, back, breast, free)", interval: "On 2:30", focus: "High-rep IM drill sequence before long set" },
          ]},
        { totalYards: 600, sets: [
            { reps: 6, dist: 100, desc: "100 IM — 25 each stroke drill, emphasize transitions", interval: "On 2:30", focus: "Full IM drill volume" },
          ]},
      ],
      distance: [
        { totalYards: 300, sets: [
            { reps: 3, dist: 100, desc: "Pull (buoy) — easy/moderate, focus on catch", interval: "On 2:15", focus: "Prime the pull pattern before distance work", eq: "pull" },
          ]},
        { totalYards: 400, sets: [
            { reps: 4, dist: 100, desc: "Pull (buoy) — moderate pace, high elbow catch", interval: "On 2:15", focus: "Upper body endurance, long stroke", eq: "pull" },
          ]},
        { totalYards: 400, sets: [
            { reps: 6, dist: 50, desc: "Kick — moderate effort (board optional)",  interval: "On 1:45", focus: "Leg conditioning and body position", eq: "kick" },
            { reps: 2, dist: 50, desc: "Freestyle — build from easy to moderate",  interval: "On 1:15", focus: "Prime aerobic engine for main set" },
          ]},
        { totalYards: 400, sets: [
            { reps: 4, dist: 50, desc: "Kick — moderate, focus on body position (board optional)", interval: "On 1:45", focus: "Leg conditioning before distance work", eq: "kick" },
            { reps: 2, dist: 100, desc: "Pull (buoy) — long stroke, focus on catch",              interval: "On 2:15", focus: "Upper-body endurance setup",            eq: "pull" },
          ]},
        { totalYards: 200, sets: [
            { reps: 4, dist: 50, desc: "Pull (buoy) — easy, focus on catch engagement", interval: "On 1:15", focus: "Quick pull priming before distance work", eq: "pull" },
          ]},
        { totalYards: 300, sets: [

    // ═══════════════════════════════════════════════════════════════
    //  BUDGET-AWARE GENERATOR
    //  Filters options so the workout stays within [1900, maxYards]
    // ═══════════════════════════════════════════════════════════════

    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    // Weighted random pick. weightFn(item) returns a positive number.
    // Items with weight 0 are excluded. Falls back to uniform pick if total is 0.
    // ─── Audio cues (W1) ─────────────────────────────────────────────
    // Web Audio API tone generator for rest-timer cues.
    // Lazy-init the AudioContext on first call. iOS requires the first
    // call to happen inside a user gesture; we prime it from the rest
    // picker's Start button (and from any user click that opens Run mode).
    let _audioCtx = null;
    function primeAudioCtx() {
      if (!_audioCtx) {
        try {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          _audioCtx = new AC();
        } catch (_) { return null; }
      }
      if (_audioCtx.state === "suspended") {
        _audioCtx.resume().catch(() => {});
      }
      return _audioCtx;
    }
    function playRestCue(kind) {
      const ctx = primeAudioCtx();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      const now = ctx.currentTime;
      if (kind === "go") {
        osc.frequency.value = 1320;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.35, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.30);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.30);
      } else {
        // Short beep at T-3/T-2/T-1
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.25, now + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.13);
        osc.connect(gain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.13);
      }
    }

    function pickWeighted(arr, weightFn) {
      const weights = arr.map(weightFn);
      const total = weights.reduce((s, w) => s + (w > 0 ? w : 0), 0);
      if (total <= 0) return pick(arr);
      let r = Math.random() * total;
      for (let i = 0; i < arr.length; i++) {
        const w = weights[i] > 0 ? weights[i] : 0;
        r -= w;
        if (r <= 0) return arr[i];
      }
      return arr[arr.length - 1];
    }

    // Returns the main-set label for a block, whether the block came from a
    // freshly generated workout (label preserved by spread), a regenerated
    // section, or a history-loaded entry (handleSave persists `label` now;
    // older rows fall back to parsing the block name).
    function extractMainLabel(block) {
      if (!block || block.section !== "main") return null;
      if (block.label) return block.label;
      const m = (block.name || "").match(/^Main Set — (.+?)(?:\s+×\d+)?$/);
      return m ? m[1] : null;
    }

    const MIN_YARDS  = 1900;
    const MIN_METERS = 2000;

    // Each checked equipment item must be satisfied by ≥ 1 set in the drill+main blocks.
    // satisfiedBy lists the eq tags whose presence counts for that equipment.
    const EQUIP_REQUIREMENTS = {
      kickboard: ["kick", "kickPart"],
      fins:      ["kick", "kickPart", "underkick"],
      paddles:   ["pull"],
      pullBuoy:  ["pull"],
      snorkel:   ["snorkel"],
    };

    function eqTagsIn(option) {
      return new Set(option.sets.filter(s => s.eq).map(s => s.eq));
    }

    function combinationSatisfies(dr, ma, equipment) {
      if (!equipment) return true;
      const tags = new Set([...eqTagsIn(dr), ...eqTagsIn(ma)]);
      for (const k of Object.keys(EQUIP_REQUIREMENTS)) {
        if (equipment[k] && !EQUIP_REQUIREMENTS[k].some(t => tags.has(t))) return false;
      }
      return true;
    }

    // pinnedBlocks: { warmup?, drill?, main?, cooldown? } — sections to hold fixed.
    // For each pinned section the block is used as-is; unpinned sections are generated
    // to fill the remaining budget. Budget math uses freeBudget = maxYards - pinnedTotal.
    // Maps workout type → warmup affinity family. Types not listed get no filter (use all warmups).
    const TYPE_WARMUP_FAMILY = {
      sprint:    "sprint",
      endurance: "endurance",
      distance:  "endurance",
      technique: "technique",
    };

    function generateWorkout(typeId, maxYards, equipment, favorites = [], poolMode = "25y", userMin = null, pinnedBlocks = {}, recentLabels = [], recoveryMode = false, phase = null) {
      const is25m    = poolMode === "25m";
      const is50m    = poolMode === "50m";
      const isMeters = is25m || is50m;
      const allWarmups   = is25m ? WARMUP_OPTIONS_SCM   : is50m ? WARMUP_OPTIONS_50M   : WARMUP_OPTIONS;
      const allCooldowns = is25m ? COOLDOWN_OPTIONS_SCM : is50m ? COOLDOWN_OPTIONS_50M : COOLDOWN_OPTIONS;
      const drillList = is25m
        ? (DRILL_OPTIONS_SCM[typeId] || DRILL_OPTIONS_SCM.mixed || DRILL_OPTIONS_50M[typeId] || DRILL_OPTIONS_50M.mixed || DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed)
        : is50m
        ? (DRILL_OPTIONS_50M[typeId] || DRILL_OPTIONS_50M.mixed || DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed)
        : (DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed);
      let mainList = is25m
        ? (MAIN_OPTIONS_SCM[typeId] || MAIN_OPTIONS_50M[typeId] || MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed)
        : is50m
        ? (MAIN_OPTIONS_50M[typeId] || MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed)
        : (MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed);

      // C: recovery mode — filter mains down to easy/aerobic zone options.
      // If the filter would empty the pool, fall back to all mains and let
      // the +10% interval stretch + repeat-suppression carry the recovery
      // intent on its own.
      if (recoveryMode) {
        const recoveryMains = mainList.filter(o => {
          const z = inferBlockZone({ section: "main", sets: o.sets, primary_zone: o.primary_zone });
          return z === "easy" || z === "aerobic";
        });
        if (recoveryMains.length) mainList = recoveryMains;
      }

      // Fixed yardage from pinned sections; free budget is what remains for unpinned picks
      const pinnedTotal = (pinnedBlocks.warmup   ? pinnedBlocks.warmup.totalYards   : 0)
                        + (pinnedBlocks.drill    ? pinnedBlocks.drill.totalYards    : 0)
                        + (pinnedBlocks.main     ? pinnedBlocks.main.totalYards     : 0)
                        + (pinnedBlocks.cooldown ? pinnedBlocks.cooldown.totalYards : 0);
      const freeBudget  = maxYards - pinnedTotal;
      const hasPins     = pinnedTotal > 0;

      // Per-section minimums (0 for pinned sections — they don't consume free budget)
      const minWu = pinnedBlocks.warmup   ? 0 : Math.min(...allWarmups.map(o => o.totalYards));
      const minDr = pinnedBlocks.drill    ? 0 : Math.min(...drillList.map(o => o.totalYards));
      const minMa = pinnedBlocks.main     ? 0 : Math.min(...mainList.map(o => o.totalYards));
      const minCd = pinnedBlocks.cooldown ? 0 : Math.min(...allCooldowns.map(o => o.totalYards));

      // C: recovery mode drops the absolute floor to 1200y (1300m) so a short
      // easy day is allowed regardless of the type's normal minimum.
      const recoveryFloor = isMeters ? 1300 : 1200;
      const baseAbsMin = recoveryMode
        ? Math.min(recoveryFloor, isMeters ? MIN_METERS : MIN_YARDS)
        : (isMeters ? MIN_METERS : MIN_YARDS);
      const absoluteMin = Math.max(baseAbsMin, userMin || 0);
      // Floor scales with target; relax when pins are present (user chose those blocks)
      const minTotal = hasPins ? absoluteMin : Math.max(absoluteMin, maxYards - 400);

      const hasEquipReq = equipment && Object.values(EQUIP_REQUIREMENTS).length > 0
                         && Object.keys(EQUIP_REQUIREMENTS).some(k => equipment[k]);

      const attempts = (maxYards >= 3000 || hasEquipReq) ? 80 : 30;

      function pickBiased(arr, floor) {
        const preferred = arr.filter(o => o.totalYards >= floor);
        return pick(preferred.length > 0 ? preferred : arr);
      }

      for (let attempt = 0; attempt < attempts; attempt++) {
        let freeUsed = 0; // yards committed to unpinned sections this attempt

        // 1. Warmup
        let wu;
        if (pinnedBlocks.warmup) {
          wu = pinnedBlocks.warmup;
        } else {
          const validWarmups = allWarmups.filter(o =>
            o.totalYards <= freeBudget - minDr - minMa - minCd
          );
          if (!validWarmups.length) break;
          // Prefer warmups whose typeAffinity matches the workout type family
          const warmupFamily = TYPE_WARMUP_FAMILY[typeId] || null;
          const affinityPool = warmupFamily
            ? validWarmups.filter(o => o.typeAffinity && o.typeAffinity.includes(warmupFamily))
            : validWarmups;
          wu = pickBiased(affinityPool.length > 0 ? affinityPool : validWarmups, freeBudget * 0.12);
          freeUsed += wu.totalYards;
        }

        // 2. Drill
        let dr;
        if (pinnedBlocks.drill) {
          dr = pinnedBlocks.drill;
        } else {
          const validDrills = drillList.filter(o =>
            o.totalYards <= freeBudget - freeUsed - minMa - minCd
          );
          if (!validDrills.length) continue;
          dr = pickBiased(validDrills, (freeBudget - freeUsed) * 0.10);
          freeUsed += dr.totalYards;
        }

        // 3. Main — expand pool with ×2 and ×3 repeat variants
        //    (C: recovery mode skips the repeat expansion — short and sweet)
        let ma;
        if (pinnedBlocks.main) {
          ma = pinnedBlocks.main;
        } else {
          const mainBudget = freeBudget - freeUsed - minCd;
          const mainPoolExpanded = recoveryMode
            ? mainList.slice()
            : mainList.flatMap(o => {
                const variants = [o];
                for (const r of [2, 3]) {
                  const rep = { ...o, rounds: r, totalYards: o.totalYards * r };
                  if (rep.totalYards <= mainBudget) variants.push(rep);
                }
                return variants;
              });
          const validMain = mainPoolExpanded.filter(o => o.totalYards <= mainBudget);
          if (!validMain.length) continue;
          const maFloor = Math.max(minMa, mainBudget * 0.65);
          // Weighting:
          //   base    = 1
          //   favorite× 3
          //   repeat(rounds > 1) × 2
          //   recently-used label (last 7d) × 0.25  ← N1 anti-repeat
          //   phase-zone multiplier (e.g. taper: easy×1.5, vo2×0.5) ← N5
          const recentSet = new Set(recentLabels);
          const phaseSpec = phase && PHASES[phase] ? PHASES[phase] : null;
          const mainWeight = (o) => {
            let w = 1;
            if (favorites.length && o.label && favorites.includes(o.label)) w *= 3;
            if ((o.rounds || 1) > 1) w *= 2;
            if (o.label && recentSet.has(o.label)) w *= 0.25;
            if (phaseSpec) {
              const optionZone = inferBlockZone({ section: "main", sets: o.sets, primary_zone: o.primary_zone });
              const m = phaseSpec.multipliers[optionZone];
              if (typeof m === "number") w *= m;
            }
            return w;
          };
          const filteredByFloor = validMain.filter(o => o.totalYards >= maFloor);
          const mainSource = filteredByFloor.length > 0 ? filteredByFloor : validMain;
          ma = pickWeighted(mainSource, mainWeight);
          freeUsed += ma.totalYards;
        }

        // 4. Equipment satisfaction check
        if (hasEquipReq && !combinationSatisfies(dr, ma, equipment)) continue;

        // 5. Cooldown
        let cd;
        if (pinnedBlocks.cooldown) {
          cd = pinnedBlocks.cooldown;
        } else {
          const remaining = freeBudget - freeUsed;
          const validCooldowns = allCooldowns.filter(o => o.totalYards <= remaining);
          if (!validCooldowns.length) continue;
          cd = pick(validCooldowns);
        }

        const total = wu.totalYards + dr.totalYards + ma.totalYards + cd.totalYards;
        if (total >= minTotal && total <= maxYards) {
          return buildWorkout(typeId, wu, dr, ma, cd, total);
        }
      }

      // Fallback: largest valid combination, respecting pins
      const byYardsDesc = (a, b) => b.totalYards - a.totalYards;
      let fbFree = 0;

      let wu;
      if (pinnedBlocks.warmup) {
        wu = pinnedBlocks.warmup;
      } else {
        const wuPool = allWarmups.filter(o => o.totalYards <= freeBudget - minDr - minMa - minCd);
        wu = (wuPool.length ? wuPool.slice().sort(byYardsDesc) : allWarmups.slice().sort(byYardsDesc))[0];
        fbFree += wu.totalYards;
      }

      let dr;
      if (pinnedBlocks.drill) {
        dr = pinnedBlocks.drill;
      } else {
        let drCandidates = drillList.filter(o => o.totalYards <= freeBudget - fbFree - minMa - minCd);
        if (!drCandidates.length) drCandidates = drillList;
        drCandidates = drCandidates.slice().sort(byYardsDesc);
        if (hasEquipReq) {
          const eqPreferred = drCandidates.filter(d =>
            mainList.some(m =>
              m.totalYards <= freeBudget - fbFree - d.totalYards - minCd &&
              combinationSatisfies(d, m, equipment)
            )
          );
          if (eqPreferred.length) drCandidates = eqPreferred;
        }
        dr = drCandidates[0];
        fbFree += dr.totalYards;
      }

      let ma;
      if (pinnedBlocks.main) {
        ma = pinnedBlocks.main;
      } else {
        const fbMainBudget = freeBudget - fbFree - minCd;
        const fbMainExpanded = recoveryMode
          ? mainList.slice()
          : mainList.flatMap(o => {
              const variants = [o];
              for (const r of [2, 3]) {
                const rep = { ...o, rounds: r, totalYards: o.totalYards * r };
                if (rep.totalYards <= fbMainBudget) variants.push(rep);
              }
              return variants;
            });
        let mainCandidates = fbMainExpanded.filter(o => o.totalYards <= fbMainBudget);
        if (!mainCandidates.length) mainCandidates = mainList;
        mainCandidates = mainCandidates.slice().sort(byYardsDesc);
        if (hasEquipReq) {
          const eqMain = mainCandidates.filter(m => combinationSatisfies(dr, m, equipment));
          if (eqMain.length) mainCandidates = eqMain;
        }
        ma = mainCandidates[0];
        fbFree += ma.totalYards;
      }

      let cd;
      if (pinnedBlocks.cooldown) {
        cd = pinnedBlocks.cooldown;
      } else {
        const cdPool = allCooldowns.filter(o => o.totalYards <= freeBudget - fbFree);
        cd = (cdPool.length ? cdPool.slice().sort(byYardsDesc) : allCooldowns.slice().sort(byYardsDesc))[0];
      }

      const total = wu.totalYards + dr.totalYards + ma.totalYards + cd.totalYards;
      return buildWorkout(typeId, wu, dr, ma, cd, total);
    }

    function buildWorkout(typeId, wu, dr, ma, cd, total) {
      const mainName = ma.rounds > 1
        ? `Main Set — ${ma.label} ×${ma.rounds}`
        : `Main Set — ${ma.label}`;
      const blocks = [
        { name: "Warm-Up",              section: "warmup",   ...wu },
        { name: "Drill / Pre-Main Set", section: "drill",    ...dr },
        { name: mainName, section: "main", ...ma, roundRestSecs: ma.roundRestSecs ?? 30 },
        { name: "Cool-Down",            section: "cooldown", ...cd },
      ];
      const estimatedMin = calcEstimatedMin(blocks);
      return { blocks, totalYards: total, estimatedMin, typeId };
    }

    // ─── Per-section regeneration ────────────────────────────────────
    // Replace ONE section of an existing workout. The other three sections
    // are held fixed, so the new pick must (a) keep total yardage in
    // [MIN_YARDS, maxYards] and (b) preserve the equipment-coverage invariant
    // across drill+main if any equipment is checked.
    const SECTION_KEYS = ["warmup", "drill", "main", "cooldown"];

    // Stable signature so we can exclude the current pick when alternatives exist.
    // Built from the full sets array so it matches across (a) fresh blocks
    // (which spread the option, including `label`), (b) raw pool options, and
    // (c) history-loaded blocks (which have `label` stripped by handleSave).
    function sectionFingerprint(b) {
      if (!b || !Array.isArray(b.sets)) return "";
      const sig = b.sets.map(s => `${s.reps}x${s.dist}|${s.desc}`).join("/");
      return `${b.totalYards}|r${b.rounds || 1}|${sig}`;
    }

    // Returns { workout, error }. On success, workout is a fresh object with the
    // requested section replaced. On failure, error is a human-readable reason
    // and the caller should keep the prior workout unchanged.
    function regenerateSection(workout, typeId, sectionKey, maxYards, equipment, poolMode = "25y", userMin = null, recentLabels = [], recoveryMode = false, phase = null) {
      if (!workout || !Array.isArray(workout.blocks) || workout.blocks.length !== 4) {
        return { workout: null, error: "No workout to update." };
      }
      const idx = SECTION_KEYS.indexOf(sectionKey);
      if (idx < 0) return { workout: null, error: "Unknown section." };

      const is25m    = poolMode === "25m";
      const is50m    = poolMode === "50m";
      const isMeters = is25m || is50m;
      const blocks = workout.blocks;
      const current = blocks[idx];
      const others = blocks.reduce((sum, b, i) => i === idx ? sum : sum + b.totalYards, 0);
      const lower = Math.max(0, Math.max(isMeters ? MIN_METERS : MIN_YARDS, userMin || 0) - others);
      const upper = maxYards - others;

      let pool;
      if (sectionKey === "warmup")        pool = is25m ? WARMUP_OPTIONS_SCM   : is50m ? WARMUP_OPTIONS_50M   : WARMUP_OPTIONS;
      else if (sectionKey === "cooldown") pool = is25m ? COOLDOWN_OPTIONS_SCM : is50m ? COOLDOWN_OPTIONS_50M : COOLDOWN_OPTIONS;
      else if (sectionKey === "drill")    pool = is25m
        ? (DRILL_OPTIONS_SCM[typeId] || DRILL_OPTIONS_SCM.mixed || DRILL_OPTIONS_50M[typeId] || DRILL_OPTIONS_50M.mixed || DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed)
        : is50m
        ? (DRILL_OPTIONS_50M[typeId] || DRILL_OPTIONS_50M.mixed || DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed)
        : (DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed);
      else {
        let basePool = is25m
          ? (MAIN_OPTIONS_SCM[typeId] || MAIN_OPTIONS_50M[typeId] || MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed)
          : is50m
          ? (MAIN_OPTIONS_50M[typeId] || MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed)
          : (MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed);
        // C: in recovery mode, only consider easy/aerobic mains, no repeat variants.
        if (recoveryMode) {
          const recoveryMains = basePool.filter(o => {
            const z = inferBlockZone({ section: "main", sets: o.sets, primary_zone: o.primary_zone });
            return z === "easy" || z === "aerobic";
          });
          if (recoveryMains.length) basePool = recoveryMains;
          pool = basePool.slice();
        } else {
          // Expand with ×2 and ×3 repeat variants
          pool = basePool.flatMap(o => {
            const variants = [o];
            for (const r of [2, 3]) {
              variants.push({ ...o, rounds: r, totalYards: o.totalYards * r });
            }
            return variants;
          });
        }
      }

      const hasEquipReq = equipment && Object.keys(EQUIP_REQUIREMENTS).some(k => equipment[k]);
      const partnerDrill = blocks[1]; // used when regenerating main
      const partnerMain  = blocks[2]; // used when regenerating drill

      const passesEquip = (candidate) => {
        if (!hasEquipReq) return true;
        if (sectionKey === "drill") return combinationSatisfies(candidate, partnerMain, equipment);
        if (sectionKey === "main")  return combinationSatisfies(partnerDrill, candidate, equipment);
        return true; // warmup/cooldown carry no equipment tags
      };

      const fitsBudget = (o) => o.totalYards >= lower && o.totalYards <= upper;
      let validAll = pool.filter(o => fitsBudget(o) && passesEquip(o));
      if (!validAll.length) {
        return { workout: null, error: hasEquipReq
          ? "No option for this section fits the remaining yardage and your equipment selection."
          : "No option for this section fits the remaining yardage budget." };
      }

      // Prefer type-matched warmups on regen (same logic as generateWorkout)
      if (sectionKey === "warmup") {
        const warmupFamily = TYPE_WARMUP_FAMILY[typeId] || null;
        if (warmupFamily) {
          const affinityPool = validAll.filter(o => o.typeAffinity && o.typeAffinity.includes(warmupFamily));
          if (affinityPool.length > 0) validAll = affinityPool;
        }
      }

      const curFp = sectionFingerprint(current);
      const novel = validAll.filter(o => sectionFingerprint(o) !== curFp);
      if (!novel.length) {
        return { workout: null, error: "Only one option fits these constraints — adjust max yards or equipment for more variety." };
      }
      // N1: down-weight recently-used labels (main section only — no labels elsewhere).
      // N5: layer phase multipliers on top of the recent-label down-weight.
      const recentSet = new Set(recentLabels);
      const phaseSpec = phase && PHASES[phase] ? PHASES[phase] : null;
      const picked = sectionKey === "main"
        ? pickWeighted(novel, (o) => {
            let w = (o.label && recentSet.has(o.label)) ? 0.25 : 1;
            if (phaseSpec) {
              const optionZone = inferBlockZone({ section: "main", sets: o.sets, primary_zone: o.primary_zone });
              const m = phaseSpec.multipliers[optionZone];
              if (typeof m === "number") w *= m;
            }
            return w;
          })
        : pick(novel);

      const NAME_BY_SECTION = {
        warmup:   "Warm-Up",
        drill:    "Drill / Pre-Main Set",
        cooldown: "Cool-Down",
      };
      const newBlock = sectionKey === "main"
        ? { name: `Main Set — ${picked.label}`, section: "main", ...picked }
        : { name: NAME_BY_SECTION[sectionKey], section: sectionKey, ...picked };

      const newBlocks = blocks.map((b, i) => i === idx ? newBlock : b);
      const total = newBlocks.reduce((s, b) => s + b.totalYards, 0);

      return { workout: { blocks: newBlocks, totalYards: total, estimatedMin: calcEstimatedMin(newBlocks), typeId }, error: null };
    }

    // ═══════════════════════════════════════════════════════════════
    //  EQUIPMENT — checkbox state shapes set descriptions at render time
    //  (yardage, intervals, and focus are unchanged — equipment is a
    //   "what gear you use" detail, not a different exercise)
    // ═══════════════════════════════════════════════════════════════

    const EQUIPMENT_LIST = [
      { id: "kickboard", label: "Kickboard", icon: "🟦", description: "Use a board for kick sets" },
      { id: "fins",      label: "Fins",      icon: "🐬", description: "Add fins to kick & underwater sets" },
      { id: "paddles",   label: "Paddles",   icon: "🤚", description: "Add paddles to pull sets" },
      { id: "pullBuoy",  label: "Pull Buoy", icon: "🛟", description: "Confirms buoy use on pull sets" },
      { id: "snorkel",   label: "Snorkel",   icon: "🤿", description: "Adds snorkel cue to freestyle drill and technique sets" },
    ];

    // Returns the equipment items (in display order) that apply to a given set
    // based on the set's `eq` tag and the user's current checkbox state.
    function equipmentForSet(set, equip) {
      if (!set.eq) return [];
      const items = [];
      if (set.eq === "kick" || set.eq === "kickPart") {
        if (equip.kickboard) items.push("kickboard");
        if (equip.fins)      items.push("fins");
      } else if (set.eq === "underkick") {
        // Underwater kick is from streamline — kickboard doesn't apply, fins do
        if (equip.fins)      items.push("fins");
      } else if (set.eq === "pull") {
        if (equip.paddles)   items.push("paddles");
        if (equip.pullBuoy)  items.push("buoy");
      } else if (set.eq === "snorkel") {
        if (equip.snorkel)   items.push("snorkel");
      }
      return items;
    }

    // Rewrite a set's description based on which compatible equipment is checked.
    // Yardage and intervals never change — only the prose updates to be explicit
    // about which gear to grab.
    function enhanceDesc(set, equip) {
      const items = equipmentForSet(set, equip);
      if (items.length === 0) return set.desc;
      const eqText = items.join(" + ");
      if (set.eq === "kick") {
        return set.desc
          .replace(/\s*\(board optional\)/i, "")
          .replace(/^IM order kick\b/, `IM order kick with ${eqText}`)
          .replace(/^Kick\b/, `Kick with ${eqText}`);
      }
      if (set.eq === "underkick") {
        return set.desc.replace(/^Underwater kick\b/, `Underwater kick with ${eqText}`);
      }
      if (set.eq === "kickPart") {
        // Multi-part set ("Kick 25 / Drill 25 / Swim 25") — annotate kick portions
        return `${set.desc}  ·  kick portions with ${eqText}`;
      }
      if (set.eq === "pull") {
        return set.desc.replace(/Pull\s*\(buoy\)/i, `Pull with ${eqText}`);
      }
      if (set.eq === "snorkel") {
        return set.desc + "  ·  use snorkel";
      }
      return set.desc;
    }

    // ═══════════════════════════════════════════════════════════════
    //  SET SWAP HELPERS
    // ═══════════════════════════════════════════════════════════════

    function parseIntervalSecs(str) {
      if (!str) return null;
      const m = str.match(/^On\s+(\d*):(\d{1,2})/i);
      if (!m) return null;
      const mins = m[1] === "" ? 0 : parseInt(m[1], 10);
      const secs = parseInt(m[2], 10);
      if (isNaN(mins) || isNaN(secs)) return null;
      return mins * 60 + secs;
    }

    function formatIntervalSecs(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `On ${m}:${String(s).padStart(2, "0")}`;
    }

    function scaleInterval(intervalStr, ratio) {
      const secs = parseIntervalSecs(intervalStr);
      if (secs === null) return intervalStr;
      const scaled = Math.max(30, Math.round((secs * ratio) / 5) * 5);
      return formatIntervalSecs(scaled);
    }

    // Format a workout as plain text for clipboard sharing.
    function workoutToText(workout, meta, paceInput, unit = "yds") {
      if (!workout) return "";
      const lines = [];
      const estMin = calcEstimatedMin(workout.blocks);
      lines.push(`${meta.label} Swim Workout — ${workout.totalYards.toLocaleString()} ${unit} (~${estMin} min)`);
      if (paceInput) lines.push(`Pace target: ${paceInput}/100`);
      lines.push("");
      for (const block of workout.blocks) {
        const rounds = block.rounds || 1;
        const roundNote = rounds > 1 ? `  ×${rounds} rounds, ${block.roundRestSecs ?? 30}s rest between` : "";
        lines.push(`${block.name.toUpperCase()}  (${block.totalYards.toLocaleString()} ${unit})${roundNote}`);
        const renderSets = () => {
          for (const set of block.sets) {
            const ivl = set.interval ? ` @ ${set.interval}` : "";
            lines.push(`  ${set.reps} × ${set.dist} — ${set.desc}${ivl}`);
          }
        };
        if (rounds > 1) {
          for (let r = 1; r <= rounds; r++) {
            lines.push(`  — Round ${r} —`);
            renderSets();
            if (r < rounds) lines.push(`  (${block.roundRestSecs ?? 30}s rest)`);
          }
        } else {
          renderSets();
        }
        lines.push("");
      }
      return lines.join("\n").trimEnd();
    }

    // Sum reps×interval across all sets; fall back to 35 yd/min for sets with no interval.
    function calcEstimatedMin(blocks) {
      const FALLBACK_YD_PER_MIN = 35;
      let totalSecs = 0;
      for (const block of blocks) {
        const rounds = block.rounds || 1;
        let blockSecs = 0;
        for (const set of block.sets) {
          const secs = parseIntervalSecs(set.interval);
          if (secs !== null) {
            blockSecs += set.reps * secs;
          } else {
            blockSecs += (set.reps * set.dist / FALLBACK_YD_PER_MIN) * 60;
          }
        }
        totalSecs += blockSecs * rounds;
        if (rounds > 1) totalSecs += (rounds - 1) * (block.roundRestSecs ?? 30);
      }
      return Math.round(totalSecs / 60);
    }

    function getEquivalents(set) {
      const result = { shorter: null, longer: null };
      if (set.dist >= 50) {
        const newDist = set.dist / 2;
        result.shorter = { ...set, dist: newDist, reps: set.reps * 2, interval: scaleInterval(set.interval, newDist / set.dist) };
      }
      if (set.reps >= 2 && set.reps % 2 === 0 && set.dist * 2 <= 400) {
        const newDist = set.dist * 2;
        result.longer = { ...set, dist: newDist, reps: set.reps / 2, interval: scaleInterval(set.interval, newDist / set.dist) };
      }
      return result;
    }

    // ═══════════════════════════════════════════════════════════════
    //  COMPONENTS
    // ═══════════════════════════════════════════════════════════════

    function EquipmentBadge({ name }) {
      const colors = {
        kickboard: { bg: "#dbeafe", fg: "#1e40af" },
        fins:      { bg: "#cffafe", fg: "#155e75" },
        paddles:   { bg: "#fef3c7", fg: "#92400e" },
        buoy:      { bg: "#fce7f3", fg: "#9d174d" },
      };
      const c = colors[name] || { bg: "#e2e8f0", fg: "#334155" };
      return (
        <span style={{ background: c.bg, color: c.fg, fontSize: 10, fontWeight: 700,
                       padding: "2px 7px", borderRadius: 999, marginRight: 4,
                       textTransform: "uppercase", letterSpacing: "0.04em" }}>
          {name}
        </span>
      );
    }

    function SetRow({ set, idx, blockIdx, setIdx, isSwapOpen, onToggleSwap, onApplySwap, equipment, isEditingInterval, editIntervalDraft, setEditIntervalDraft, onStartEditInterval, onCommitInterval, onCancelInterval, isEditingDesc, editDescDraft, setEditDescDraft, onStartEditDesc, onCommitDesc, onCancelDesc, unit = "yds", blockSection, blockZoneId }) {
      const eqItems = equipmentForSet(set, equipment);
      const desc = enhanceDesc(set, equipment);
      const equiv = onToggleSwap ? getEquivalents(set) : {};
      const hasSwap = !!(equiv.shorter || equiv.longer);
      // H: per-set pip only when the set's zone diverges from the block's
      // dominant zone (keeps the table visually quiet most of the time).
      const setZoneId = set.zone || inferSetZone(set, blockSection);
      const showSetPip = blockZoneId && setZoneId && setZoneId !== blockZoneId;
      const setZone = showSetPip ? (ZONES[setZoneId] || null) : null;
      return (
        <React.Fragment>
          <tr style={{ background: idx % 2 === 0 ? "#ffffff" : "#f8fafc" }}>
            <td style={{ padding: "10px 16px", fontSize: 13, fontWeight: 600, color: "#334155", whiteSpace: "nowrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                {setZone && (
                  <span className="screen-only"
                    title={`This set is ${setZone.label} (block is ${(ZONES[blockZoneId] || {}).label || "n/a"})`}
                    style={{
                      width: 8, height: 8, borderRadius: "50%",
                      background: setZone.color,
                      display: "inline-block", flexShrink: 0,
                    }} />
                )}
                {set.reps > 1 ? `${set.reps} × ${set.dist}` : `${set.dist}`}
                {hasSwap && (
                  <button onClick={() => onToggleSwap(blockIdx, setIdx)}
                    style={{ fontSize: 11, padding: "2px 6px", borderRadius: 4, border: `1px solid ${isSwapOpen ? "#94a3b8" : "#cbd5e1"}`, background: isSwapOpen ? "#e2e8f0" : "transparent", cursor: "pointer", color: "#64748b", lineHeight: 1 }}>
                    ⇄
                  </button>
                )}
              </div>
            </td>
            <td style={{ padding: "10px 16px", fontSize: 13, fontWeight: 700, color: "#1e293b", whiteSpace: "nowrap" }}>
              {(set.reps * set.dist).toLocaleString()} {unit}
            </td>
            <td style={{ padding: "10px 16px", fontSize: 13, color: "#334155" }}>
              {isEditingDesc ? (
                <input
                  autoFocus
                  value={editDescDraft}
                  onChange={e => setEditDescDraft(e.target.value)}
                  onKeyDown={e => {
                    if (e.key === "Enter")  onCommitDesc(blockIdx, setIdx, editDescDraft);
                    if (e.key === "Escape") onCancelDesc();
                  }}
                  onBlur={() => onCommitDesc(blockIdx, setIdx, editDescDraft)}
                  style={{ width: "100%", fontSize: 13, padding: "2px 6px", borderRadius: 4, border: "1px solid #94a3b8", background: "#fff", color: "#1e293b", boxSizing: "border-box" }}
                />
              ) : (
                <span
                  onClick={() => onStartEditDesc && onStartEditDesc(blockIdx, setIdx, set.desc)}
                  title={onStartEditDesc ? "Click to edit" : undefined}

    function WorkoutBlock({ block, equipment, onRegenerate, regenError, blockIdx, openSwapKey, onToggleSwap, onApplySwap, editIntervalKey, editIntervalDraft, setEditIntervalDraft, onStartEditInterval, onCommitInterval, onCancelInterval, editDescKey, editDescDraft, setEditDescDraft, onStartEditDesc, onCommitDesc, onCancelDesc, isFavorited, onToggleFavorite, onRoundRestChange, unit = "yds", isPinned, onTogglePin, recentMainLabels }) {

              {block.section === "main" && block.label && onToggleFavorite && (

                      rows.push(
                        <RoundRestRow key={`rest-${r}`}
                          restSecs={block.roundRestSecs ?? 30}
