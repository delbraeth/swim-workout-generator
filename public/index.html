    // ─── Max Yardage Slider ──────────────────────────────────────────
    // Compute the minimum possible total yards for a given type
    function minYardsForType(typeId, poolMode = "25y") {
      const is25m = poolMode === "25m";
      const is50m = poolMode === "50m";
      const allWarmups   = is25m ? WARMUP_OPTIONS_SCM   : is50m ? WARMUP_OPTIONS_50M   : WARMUP_OPTIONS;
      const allCooldowns = is25m ? COOLDOWN_OPTIONS_SCM : is50m ? COOLDOWN_OPTIONS_50M : COOLDOWN_OPTIONS;
      const drillList = is25m
        ? (DRILL_OPTIONS_SCM[typeId] || DRILL_OPTIONS_SCM.mixed || DRILL_OPTIONS_50M[typeId] || DRILL_OPTIONS_50M.mixed || DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed)
        : is50m
        ? (DRILL_OPTIONS_50M[typeId] || DRILL_OPTIONS_50M.mixed || DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed)
        : (DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed);
      const mainList = is25m
        ? (MAIN_OPTIONS_SCM[typeId] || MAIN_OPTIONS_50M[typeId] || MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed)
        : is50m
        ? (MAIN_OPTIONS_50M[typeId] || MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed)
        : (MAIN_OPTIONS[typeId] || MAIN_OPTIONS.mixed);
      const minWarmup   = Math.min(...allWarmups.map(o => o.totalYards));
      const minDrill    = Math.min(...drillList.map(o => o.totalYards));
      const minMain     = Math.min(...mainList.map(o => o.totalYards));
      const minCooldown = Math.min(...allCooldowns.map(o => o.totalYards));
      return minWarmup + minDrill + minMain + minCooldown;
    }

    function YardageSlider({ value, onChange, selectedType, poolMode = "25y", paceInput = "2:00", onPaceChange, sliderMin: sliderMinProp, sliderMax: sliderMaxProp, onRangeChange }) {
      const [activePreset, setActivePreset] = React.useState(null);
      const [editingBound, setEditingBound] = React.useState(null); // 'min' | 'max' | null
      const [boundDraft,   setBoundDraft]   = React.useState("");
      const is25m    = poolMode === "25m";
      const is50m    = poolMode === "50m";
      const isMeters = is25m || is50m;
      const ABS_MIN     = isMeters ? 2000 : 1900;
      const ABS_MAX     = 6000;
      const SLIDER_STEP = is50m ? 100 : 50;     // SCM uses 50m step like SCY (more granular than LCM)
      const SLIDER_MIN  = Math.max(ABS_MIN, sliderMinProp ?? ABS_MIN);
      const SLIDER_MAX  = Math.min(ABS_MAX, sliderMaxProp ?? 5000);
      const unit = isMeters ? "m" : "yds";
      const pct = ((value - SLIDER_MIN) / (SLIDER_MAX - SLIDER_MIN) * 100).toFixed(1);
      // 5 evenly-spaced ticks between SLIDER_MIN and SLIDER_MAX
      const ticks = [0,1,2,3,4].map(i => Math.round((SLIDER_MIN + i * (SLIDER_MAX - SLIDER_MIN) / 4) / SLIDER_STEP) * SLIDER_STEP);
      const tickLabel = v => v >= 1000 ? `${(v / 1000).toFixed(1)}k` : String(v);

      function commitBound(which, raw) {
        const parsed = parseInt(raw, 10);
        if (!isNaN(parsed)) {
          const snap = Math.round(parsed / SLIDER_STEP) * SLIDER_STEP;
          let newMin = SLIDER_MIN, newMax = SLIDER_MAX;
          if (which === "min") newMin = Math.max(ABS_MIN, Math.min(snap, SLIDER_MAX - SLIDER_STEP));
          if (which === "max") newMax = Math.min(ABS_MAX, Math.max(snap, newMin + SLIDER_STEP));
          if (newMin !== SLIDER_MIN || newMax !== SLIDER_MAX) {
            onRangeChange && onRangeChange(newMin, newMax);
          }
        }
        setEditingBound(null);
        setBoundDraft("");
      }

      const typeMin = selectedType ? minYardsForType(selectedType, poolMode) : null;
      const tooLow  = typeMin !== null && value < typeMin;

      return (
        <div style={{ background: "#1e293b", border: `1px solid ${tooLow ? "#7f1d1d" : "#334155"}`, borderRadius: 12, padding: "18px 20px", marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
            <div>
              <span style={{ color: "#94a3b8", fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.1em" }}>Max {isMeters ? "Distance" : "Yardage"}</span>
              <span style={{ color: "#64748b", fontSize: 11, marginLeft: 8 }}>(min locked at {SLIDER_MIN.toLocaleString()} {unit})</span>
            </div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 4 }}>
              <span style={{ color: "#ffffff", fontSize: 26, fontWeight: 900 }}>{value.toLocaleString()}</span>
              <span style={{ color: "#94a3b8", fontSize: 12 }}>{unit}</span>
            </div>
          </div>

          {/* Pace input + time presets */}
          {(() => {
            function parsePaceSecs(p) {
              const parts = (p || "").trim().split(":");
              if (parts.length !== 2) return null;
              const m = parseInt(parts[0], 10), s = parseInt(parts[1], 10);
              if (isNaN(m) || isNaN(s) || m * 60 + s < 30) return null;
              return m * 60 + s;
            }
            function yardsForMins(mins) {
              const ps = parsePaceSecs(paceInput);
              if (!ps) return null;
              const y = Math.round(2400 * (mins / 60) * (120 / ps) / 50) * 50;
              return Math.min(5000, Math.max(isMeters ? 2000 : 1900, y));
            }
            const presets = [{ label: "~60 min", mins: 60 }, { label: "~90 min", mins: 90 }, { label: "~2 hr", mins: 120 }];
            return (
              <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
                <span style={{ color: "#64748b", fontSize: 11 }}>Pace / 100 {unit}:</span>
                <input
                  type="text"
                  value={paceInput}
                  onChange={e => { setActivePreset(null); onPaceChange && onPaceChange(e.target.value); }}
                  placeholder="M:SS"
                  style={{ width: 52, fontFamily: "monospace", fontSize: 13, padding: "4px 7px", borderRadius: 6,
                           border: "1px solid #475569", background: "#0f172a", color: "#e2e8f0", outline: "none" }}
                />
                {presets.map(({ label, mins }) => {
                  const y = yardsForMins(mins);
                  const active = activePreset === label;
                  return (
                    <button key={label} onClick={() => { if (y) { setActivePreset(label); onChange(y); } }} disabled={!y}
                      style={{ fontSize: 12, fontWeight: 600, padding: "4px 12px", borderRadius: 6,
                               border: `1px solid ${active ? "#3b82f6" : "#334155"}`,
                               background: active ? "#1d4ed8" : "#0f172a",
                               color: active ? "#fff" : "#94a3b8", cursor: y ? "pointer" : "not-allowed" }}>
                      {label}
                    </button>
                  );
                })}
              </div>
            );
          })()}

          {/* Visual track + invisible native input on top */}
          <div style={{ position: "relative", marginBottom: 4 }}>
            <div style={{ height: 6, borderRadius: 3, background: "#334155", position: "relative" }}>
              <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${pct}%`,
                            background: tooLow ? "linear-gradient(90deg,#ef4444,#f87171)" : "linear-gradient(90deg,#3b82f6,#60a5fa)",
                            borderRadius: 3 }} />
            </div>
            <input type="range" min={SLIDER_MIN} max={SLIDER_MAX} step={SLIDER_STEP} value={value}
              onChange={e => { setActivePreset(null); onChange(Number(e.target.value)); }}
              style={{ position: "absolute", top: -4, left: 0, width: "100%", opacity: 0, height: 14, cursor: "pointer", margin: 0 }} />
          </div>

          {/* Tick labels — first and last are editable bounds */}
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
            {ticks.map((v, i) => {
              const isMin = i === 0, isMax = i === ticks.length - 1;
              const boundKey = isMin ? "min" : isMax ? "max" : null;
              if (boundKey && editingBound === boundKey) {
                return (
                  <input key={v} type="number" value={boundDraft} autoFocus
                    onChange={e => setBoundDraft(e.target.value)}
                    onBlur={() => commitBound(boundKey, boundDraft)}
                    onKeyDown={e => { if (e.key === "Enter") commitBound(boundKey, boundDraft); if (e.key === "Escape") { setEditingBound(null); setBoundDraft(""); } }}
                    style={{ width: 52, fontSize: 10, fontFamily: "monospace", padding: "1px 4px", borderRadius: 4,
                             border: "1px solid #3b82f6", background: "#0f172a", color: "#60a5fa", outline: "none" }} />
                );
              }
              return (
                <span key={v}
                  onClick={() => boundKey ? (setEditingBound(boundKey), setBoundDraft(String(v))) : onChange(v)}
                  title={boundKey ? `Click to set ${boundKey} yardage` : undefined}
                  style={{ fontSize: 10, cursor: "pointer",
                            color: v === value ? "#60a5fa" : v < (typeMin||0) ? "#7f1d1d" : "#475569",
                            fontWeight: v === value ? 700 : 400,
                            textDecoration: boundKey ? "underline dotted" : undefined }}>
                  {tickLabel(v)}{boundKey ? " ✎" : ""}
                </span>
              );
            })}
          </div>

          {/* Status row */}
          {tooLow ? (
            <div style={{ background: "#450a0a", border: "1px solid #7f1d1d", borderRadius: 8, padding: "10px 14px", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 16 }}>⚠️</span>
              <div>
                <span style={{ color: "#fca5a5", fontSize: 12, fontWeight: 600 }}>
                  This workout type needs at least {typeMin.toLocaleString()} {unit}.
                </span>
                <span style={{ color: "#ef4444", fontSize: 12 }}> Raise the max or choose a different type.</span>
              </div>
            </div>
          ) : typeMin !== null ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 11, color: "#64748b" }}>Workout range:</span>
              <span style={{ fontSize: 11, color: "#34d399", background: "#064e3b", borderRadius: 6, padding: "2px 8px", fontWeight: 600 }}>
                {typeMin.toLocaleString()} – {value.toLocaleString()} {unit} ✓
              </span>
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontSize: 11, color: "#64748b" }}>Select a workout type to see its range.</span>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  SAVE-TO-HISTORY FORM — appears below a freshly generated workout
    // ═══════════════════════════════════════════════════════════════
    function StarRating({ value, onChange, size = 18, readOnly = false, allowToggleClear = true, showClear = false }) {
      // value: null or 1..5
      // allowToggleClear: when true, clicking the current-value star sets back to null
      //                   when false, clicking always sets to N (no toggle-off)
      // showClear: when true and editable, render a small × clear button when a value is set
      return (
        <div style={{ display: "inline-flex", gap: 2, alignItems: "center" }}>
          {[1,2,3,4,5].map(n => {
            const filled = value != null && n <= value;
            return (
              <span key={n}
                onClick={readOnly ? undefined : () => onChange(allowToggleClear && value === n ? null : n)}
                title={readOnly ? `${value || 0}/5` : `${n} star${n>1?'s':''}`}
                style={{
                  fontSize: size, lineHeight: 1, cursor: readOnly ? "default" : "pointer",
                  color: filled ? "#fbbf24" : "#475569",
                  transition: "color 0.1s",
                  userSelect: "none",
                }}>★</span>
            );
          })}
          {!readOnly && showClear && value != null && (
            <span onClick={() => onChange(null)}
              title="Clear rating"
              style={{
                marginLeft: 4, fontSize: Math.max(10, size - 4), lineHeight: 1,
                cursor: "pointer", color: "#64748b", userSelect: "none",
                padding: "0 4px", borderRadius: 4,
              }}>✕</span>
          )}
        </div>
      );
    }

    function SaveToHistoryForm({ dateDraft, setDateDraft, initialsDraft, setInitialsDraft, noteDraft, setNoteDraft, difficultyDraft, setDifficultyDraft, saveStatus, saveError, onSave }) {
      const isSaved  = saveStatus === "saved";
      const isSaving = saveStatus === "saving";
      return (
        <div className="screen-only" style={{ marginTop: 20, background: "#1e293b", borderRadius: 12, padding: 18, border: "1px solid #334155" }}>
          <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12 }}>
            <span style={{ fontSize: 14, fontWeight: 700, color: "#e2e8f0" }}>📒 Log this workout</span>
            <span style={{ fontSize: 11, color: "#64748b" }}>(saves to your history)</span>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "150px 90px 1fr", gap: 12, alignItems: "start" }}>
            <div>
              <label style={{ display: "block", fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>Date Performed</label>
              <input type="date" value={dateDraft} onChange={e => setDateDraft(e.target.value)} disabled={isSaving}
                style={{ width: "100%", padding: "8px 10px", background: "#0f172a", color: "#e2e8f0", border: "1px solid #475569", borderRadius: 6, fontSize: 13, fontFamily: "inherit", colorScheme: "dark" }} />
            </div>
            <div>
              <label style={{ display: "block", fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>Initials</label>
              <input type="text" value={initialsDraft}
                onChange={e => setInitialsDraft(normalizeInitials(e.target.value))}
                disabled={isSaving}
                placeholder="e.g. CD"
                maxLength={4}
                style={{ width: "100%", padding: "8px 10px", background: "#0f172a", color: "#e2e8f0", border: "1px solid #475569", borderRadius: 6, fontSize: 13, fontFamily: "inherit", textTransform: "uppercase", letterSpacing: "0.05em" }} />
            </div>
            <div>
              <label style={{ display: "block", fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 4 }}>Notes (optional)</label>
              <textarea value={noteDraft} onChange={e => setNoteDraft(e.target.value)} disabled={isSaving}
                placeholder="How did it go? Anything to remember?"
                rows={2}
                style={{ width: "100%", padding: "8px 10px", background: "#0f172a", color: "#e2e8f0", border: "1px solid #475569", borderRadius: 6, fontSize: 13, fontFamily: "inherit", resize: "vertical" }} />
            </div>
          </div>
          <div style={{ marginTop: 10, display: "flex", alignItems: "center", gap: 12 }}>
            <label style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>Difficulty</label>
            <StarRating value={difficultyDraft} onChange={setDifficultyDraft} />
            <span style={{ fontSize: 11, color: "#64748b" }}>{difficultyDraft ? `${difficultyDraft}/5` : "optional"}</span>
          </div>
          <div style={{ marginTop: 12, display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            <button onClick={onSave} disabled={isSaving}
              style={{
                padding: "9px 20px", borderRadius: 8, border: "none",
                background: isSaved ? "#16a34a" : "#3b82f6", color: "#fff",
                fontWeight: 700, fontSize: 13,
                cursor: isSaving ? "wait" : "pointer", opacity: isSaving ? 0.8 : 1,
              }}>
              {isSaving ? "Saving…" : isSaved ? "✓ Saved" : "💾 Save to History"}
            </button>
            {isSaved && (
              <span style={{ color: "#86efac", fontSize: 12 }}>
                Logged. (commit may take ~30–60s to appear in the repo)
              </span>
            )}
            {saveStatus === "error" && (
              <span style={{ color: "#fca5a5", fontSize: 12 }}>
                Save failed: {saveError}. Click Save again to retry.
              </span>
            )}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  HISTORY VIEW — list, filter, expand, edit notes, delete, re-print
    // ═══════════════════════════════════════════════════════════════
    function HistoryView({ history, historyLoaded, onUpdateNotes, onUpdateCompleted, onUpdateDifficulty, onDelete, onLoadAndPrint, onRepeat, onRun, favorites, onToggleFavorite, recentMainLabels, goals = [], mySub }) {
      const [filterType,   setFilterType]   = useState("all");
      const [filterUser,   setFilterUser]   = useState("all"); // "all" | "__unattributed__" | sub string
      const [weekMode,     setWeekMode]     = useState("all"); // "all" | "4wk"
      const [typeWindow,   setTypeWindow]   = useState("4wk"); // "4wk" | "12wk" | "all" — windows the Type Breakdown stat
      const [filterStatus, setFilterStatus] = useState("all"); // "all" | "done" | "planned"
      const [editingId,    setEditingId]    = useState(null);
      const [editingNotes, setEditingNotes] = useState("");
      const [expandedId,   setExpandedId]   = useState(null);

      // Distinct subs present in history. Display label = most common initials for that sub.
      const userBuckets = useMemo(() => {
        const subMap = new Map(); // sub → Map<initials, count>
        let hasUnattributed = false;
        for (const e of history) {
          const sub      = (e.sub          || "").trim();
          const initials = (e.userInitials || "").trim();
          if (sub) {
            if (!subMap.has(sub)) subMap.set(sub, new Map());
            const counts = subMap.get(sub);
            if (initials) counts.set(initials, (counts.get(initials) || 0) + 1);
          } else {
            hasUnattributed = true;
          }
        }
        const users = [...subMap.entries()].map(([sub, counts]) => {
          const label = counts.size > 0
            ? [...counts.entries()].sort((a, b) => b[1] - a[1])[0][0]
            : "Unknown";
          return { id: sub, label };
        }).sort((a, b) => a.label.localeCompare(b.label));
        return { users, hasUnattributed };
      }, [history]);

      // If the selected user filter no longer exists in history, reset to "all".
      useEffect(() => {
        if (filterUser === "all") return;
        if (filterUser === "__unattributed__" && !userBuckets.hasUnattributed) setFilterUser("all");
        else if (filterUser !== "__unattributed__" && !userBuckets.users.find(u => u.id === filterUser)) setFilterUser("all");
      }, [filterUser, userBuckets]);

      const filtered = useMemo(
        () => history.filter(e => {
          if (filterType !== "all" && e.type !== filterType) return false;
          const sub = (e.sub || "").trim();
          if (filterUser !== "all") {
            if (filterUser === "__unattributed__" && sub) return false;
            if (filterUser !== "__unattributed__" && sub !== filterUser) return false;
          }
          if (filterStatus !== "all") {
            const isDone = e.completed !== false; // treat missing as done (legacy entries)
            if (filterStatus === "done"    && !isDone) return false;
            if (filterStatus === "planned" &&  isDone) return false;
          }
          return true;
        }),
        [history, filterType, filterUser, filterStatus]
      );

      // Show the user-filter row only when it would offer a meaningful choice:
      // at least 2 distinct buckets among (users, unattributed).
      const userBucketCount = userBuckets.users.length + (userBuckets.hasUnattributed ? 1 : 0);
      const showUserFilter = userBucketCount > 1;

      const stats = useMemo(() => {
        // Stats count only completed entries (planned workouts excluded)
        const done     = filtered.filter(e => e.completed !== false);
        const sessions = done.length;
        const yards    = done.reduce((s, e) => s + (e.totalYards || 0), 0);
        const avg      = sessions ? Math.round(yards / sessions) : 0;

        // Workouts per week (completed only)
        const now        = Date.now();
        const msPerWeek  = 7 * 24 * 60 * 60 * 1000;
        const fourWksAgo = now - 4 * msPerWeek;
        const allDates   = done.map(e => e.dateCompleted ? new Date(e.dateCompleted).getTime() : 0).filter(Boolean);
        const firstDate  = allDates.length > 0 ? Math.min(...allDates) : now;
        // All-time: sessions / weeks since first entry
        const wkAll = allDates.length > 0
          ? sessions / Math.max(1, (now - firstDate) / msPerWeek)
          : 0;
        // 4-week: sessions in last 28 days / actual elapsed weeks (capped at 4)
        const recentCount  = done.filter(e => {
          const d = e.dateCompleted ? new Date(e.dateCompleted).getTime() : 0;
          return d >= fourWksAgo;
        }).length;
        const weeksElapsed = Math.min(4, Math.max(1, (now - firstDate) / msPerWeek));
        const wkRecent     = recentCount / weeksElapsed;

        // Weekly yards sparkline — last 12 ISO weeks, done-only.
        // Bucket key = Monday of the entry's ISO week (UTC), formatted yyyy-mm-dd.
        const SPARK_WEEKS = 12;
        const mondayUTC = (ts) => {
          const d = new Date(ts);
          // JS getUTCDay: Sun=0, Mon=1, ... Sat=6 — shift so Mon=0..Sun=6
          const dow = (d.getUTCDay() + 6) % 7;
          const m = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate() - dow));
          return m;
        };
        const fmtMonday = (d) => d.toISOString().slice(0, 10);
        const nowMonday = mondayUTC(now);
        const weeks = Array.from({ length: SPARK_WEEKS }).map((_, i) => {
          const m = new Date(nowMonday);
          m.setUTCDate(m.getUTCDate() - (SPARK_WEEKS - 1 - i) * 7);
          return { key: fmtMonday(m), monday: m, yards: 0 };
        });
        const weekIdx = new Map(weeks.map((w, i) => [w.key, i]));
        for (const e of done) {
          if (!e.dateCompleted) continue;
          // dateCompleted is yyyy-mm-dd; interpret as UTC midnight so week math is stable.
          const ts = new Date(`${e.dateCompleted}T00:00:00Z`).getTime();
          const k = fmtMonday(mondayUTC(ts));
          const i = weekIdx.get(k);
          if (i !== undefined) weeks[i].yards += (e.totalYards || 0);
        }
        const sparkMax = weeks.reduce((m, w) => Math.max(m, w.yards), 0);

        // Type distribution (completed only), windowed
        const winDays = typeWindow === "4wk" ? 28 : typeWindow === "12wk" ? 84 : null;
        const winCutoff = winDays === null ? -Infinity : (now - winDays * 24 * 60 * 60 * 1000);
        const windowed = done.filter(e => {
          if (winCutoff === -Infinity) return true;
          const d = e.dateCompleted ? new Date(e.dateCompleted).getTime() : 0;
          return d >= winCutoff;
        });
        const winSessions = windowed.length;
        const typeCounts = new Map();
        for (const e of windowed) typeCounts.set(e.type, (typeCounts.get(e.type) || 0) + 1);
        const typeBreakdown = [...typeCounts.entries()]
          .map(([type, count]) => ({ type, count, pct: winSessions ? Math.round(count / winSessions * 100) : 0 }))
          .sort((a, b) => b.count - a.count);

        // N4: Intensity distribution — yards per zone, derived from inferSetZone
        // for every set in every windowed workout. Two outputs:
        //   intensityTotals: { zoneId → yards } across the whole window
        //   weeklyIntensity: 12-week stacked-bar series (latest 12 ISO weeks)
        const intensityTotals = { easy: 0, aerobic: 0, threshold: 0, vo2: 0, anaerobic: 0 };
        const weeklyIntensity = weeks.map(w => ({
          key: w.key, monday: w.monday,
          zones: { easy: 0, aerobic: 0, threshold: 0, vo2: 0, anaerobic: 0 },
          total: 0,
        }));
        for (const e of done) {
          if (!Array.isArray(e.blocks)) continue;
          const ts = e.dateCompleted ? new Date(`${e.dateCompleted}T00:00:00Z`).getTime() : 0;
          const wIdx = weekIdx.get(fmtMonday(mondayUTC(ts)));
          const inWindow = ts >= winCutoff;
          for (const b of e.blocks) {
            for (const s of (b.sets || [])) {
              const z = s.zone || inferSetZone(s, b.section);
              const y = (s.reps || 1) * (s.dist || 0);
              if (inWindow) intensityTotals[z] = (intensityTotals[z] || 0) + y;
              if (wIdx !== undefined) {
                weeklyIntensity[wIdx].zones[z] += y;
                weeklyIntensity[wIdx].total   += y;
              }
            }
          }
        }
        const intensityYards = Object.values(intensityTotals).reduce((s, v) => s + v, 0);
        // 80/20 ratio: % of yards at or below aerobic vs everything threshold+.
        const easyAerobicYards = intensityTotals.easy + intensityTotals.aerobic;
        const hardYards        = intensityYards - easyAerobicYards;
        const ratio8020 = intensityYards > 0
          ? { easy: Math.round(easyAerobicYards / intensityYards * 100),
              hard: Math.round(hardYards / intensityYards * 100) }
          : null;
        const weeklyIntensityMax = weeklyIntensity.reduce((m, w) => Math.max(m, w.total), 0);

        return { sessions, yards, avg, wkAll, wkRecent, typeBreakdown, winSessions, weeks, sparkMax,
                 intensityTotals, intensityYards, ratio8020, weeklyIntensity, weeklyIntensityMax };
      }, [filtered, typeWindow]);

      // Goal progress vs current period (ISO week Mon..Sun, or calendar month).
      // Only counts the signed-in user's completed workouts.
      const goalProgress = useMemo(() => {
        if (!goals.length || !mySub) return [];
        const now = new Date();
        // ISO week boundaries (Mon..Sun) in local time.
        const dow = (now.getDay() + 6) % 7; // 0 = Monday
        const weekStart = new Date(now); weekStart.setHours(0,0,0,0); weekStart.setDate(now.getDate() - dow);
        const weekStartMs = weekStart.getTime();
        // Calendar month boundary in local time.
        const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).getTime();

        let wkSessions = 0, wkYards = 0, moYards = 0;
        for (const e of history) {
          if (e.sub !== mySub) continue;
          if (e.completed === false) continue;
          if (!e.dateCompleted) continue;
          const ts = new Date(`${e.dateCompleted}T00:00:00`).getTime();
          if (ts >= weekStartMs) { wkSessions += 1; wkYards += (e.totalYards || 0); }
          if (ts >= monthStart)  { moYards   += (e.totalYards || 0); }
        }
        const valueByMetric = {
          workouts_per_week: wkSessions,
          yards_per_week:    wkYards,
          yards_per_month:   moYards,
        };
        return goals.map(g => ({
          metric: g.metric,
          target: g.target_value,
          current: valueByMetric[g.metric] || 0,
        }));
      }, [goals, history, mySub]);

      if (!historyLoaded) {
        return <div style={{ textAlign: "center", color: "#64748b", padding: 40 }}>Loading history…</div>;
      }
      if (history.length === 0) {
        return (
          <div style={{ textAlign: "center", color: "#64748b", padding: 50 }}>
            <div style={{ fontSize: 44, marginBottom: 12 }}>📜</div>
            <p style={{ fontSize: 16, color: "#94a3b8", margin: 0 }}>No workouts logged yet.</p>
            <p style={{ fontSize: 12, color: "#64748b", marginTop: 6 }}>Generate a workout, swim it, then click <b>Save to History</b> to log it here.</p>
          </div>
        );
      }

      return (
        <div className="screen-only">
          {/* Favorites panel */}
          {favorites && favorites.length > 0 && (
            <div style={{ marginBottom: 18, padding: "14px 16px", borderRadius: 10, background: "#1a1f2e", border: "1px solid #2d3748" }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: "#f59e0b", textTransform: "uppercase", letterSpacing: "0.12em", marginBottom: 10 }}>
                ★ Favorite Main Sets
              </div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {favorites.map(label => {
                  const seenDays = recentMainLabels ? recentMainLabels.get(label) : undefined;
                  return (
                    <div key={label} style={{ display: "flex", alignItems: "center", gap: 6, padding: "5px 10px", borderRadius: 8, background: "#0f172a", border: "1px solid #f59e0b33" }}>
                      <span style={{ fontSize: 13, color: "#e2e8f0", fontWeight: 600 }}>{label}</span>
                      {seenDays !== undefined && (
                        <span title={`Last completed ${seenDays === 0 ? "today" : seenDays === 1 ? "yesterday" : seenDays + " days ago"}`}
                          style={{ fontSize: 10, color: "#fca5a5", background: "#7f1d1d33", border: "1px solid #7f1d1d", padding: "1px 6px", borderRadius: 999, fontWeight: 700, letterSpacing: "0.02em" }}>
                          last seen {seenDays === 0 ? "today" : `${seenDays}d ago`}
                        </span>
                      )}
                      <button
                        onClick={() => onToggleFavorite && onToggleFavorite(label)}
                        title="Remove from favorites"
                        style={{ background: "transparent", border: "none", color: "#f59e0b", fontSize: 16, cursor: "pointer", padding: "0 2px", lineHeight: 1 }}>
                        ★
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Type filter chips */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: showUserFilter ? 8 : 14 }}>
            {[{ id: "all", label: "All", emoji: "📋" }, ...WORKOUT_TYPES].map(t => {
              const active = filterType === t.id;
              return (
                <button key={t.id} onClick={() => setFilterType(t.id)}
                  style={{
                    padding: "6px 12px", borderRadius: 999, border: "none",
                    background: active ? "#3b82f6" : "#1e293b",
                    color: active ? "#fff" : "#94a3b8",
                    fontSize: 12, fontWeight: 600, cursor: "pointer",
                  }}>
                  {t.emoji} {t.label}
                </button>
              );
            })}
          </div>

          {/* User filter chips — only shown when there's a meaningful choice. */}
          {showUserFilter && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14, alignItems: "center" }}>
              <span style={{ fontSize: 10, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.08em", marginRight: 4 }}>Who:</span>
              {[
                { id: "all", label: "All" },
                ...userBuckets.users,
                ...(userBuckets.hasUnattributed ? [{ id: "__unattributed__", label: "Unattributed" }] : []),
              ].map(u => {
                const active = filterUser === u.id;
                return (
                  <button key={u.id} onClick={() => setFilterUser(u.id)}
                    style={{
                      padding: "6px 12px", borderRadius: 999, border: "none",
                      background: active ? "#0ea5e9" : "#1e293b",
                      color: active ? "#fff" : "#94a3b8",
                      fontSize: 12, fontWeight: 600, cursor: "pointer",
                      fontVariantNumeric: "tabular-nums",
                    }}>
                    {u.label}
                  </button>
                );
              })}
            </div>
          )}

          {/* Status filter chips */}
          <div style={{ display: "flex", gap: 8, marginBottom: 14, alignItems: "center" }}>
            <span style={{ fontSize: 10, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.08em", marginRight: 4 }}>Status:</span>
            {[
              { id: "all",     label: "All" },
              { id: "done",    label: "✓ Done" },
              { id: "planned", label: "Planned" },
            ].map(s => {
              const active = filterStatus === s.id;
              return (
                <button key={s.id} onClick={() => setFilterStatus(s.id)}
                  style={{
                    padding: "6px 12px", borderRadius: 999, border: "none",
                    background: active ? (s.id === "done" ? "#16a34a" : s.id === "planned" ? "#7c3aed" : "#475569") : "#1e293b",
                    color: active ? "#fff" : "#94a3b8",
                    fontSize: 12, fontWeight: 600, cursor: "pointer",
                  }}>
                  {s.label}
                </button>
              );
            })}
          </div>

          {/* Goal progress — only renders if user has set at least one goal */}
          {goalProgress.length > 0 && (
            <div style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 12, padding: 16, marginBottom: 16 }}>
              <div style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10 }}>
                🎯 Goals · current period
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
                {goalProgress.map(gp => {
                  const meta = GOAL_METRICS.find(m => m.id === gp.metric);
                  if (!meta) return null;
                  const pct = Math.min(100, gp.target > 0 ? (gp.current / gp.target) * 100 : 0);
                  const hit = gp.current >= gp.target;
                  const barColor = hit ? "#22c55e" : pct >= 75 ? "#3b82f6" : "#7c3aed";
                  return (
                    <div key={gp.metric}>
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 12, marginBottom: 4 }}>
                        <span style={{ color: "#cbd5e1", fontWeight: 600 }}>
                          {meta.label}
                          <span style={{ color: "#475569", fontWeight: 400, marginLeft: 6 }}>· this {meta.period}</span>
                        </span>
                        <span style={{ color: hit ? "#4ade80" : "#94a3b8", fontVariantNumeric: "tabular-nums", fontWeight: 700 }}>
                          {gp.current.toLocaleString()} / {gp.target.toLocaleString()} {meta.unit}
                          {hit && <span style={{ marginLeft: 6 }}>✓</span>}
                        </span>
                      </div>
                      <div style={{ background: "#0f172a", borderRadius: 4, height: 8, overflow: "hidden" }}>
                        <div style={{ width: `${pct}%`, height: "100%", background: barColor, transition: "width 0.4s" }} />
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* Stats summary */}
          <div style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 12, padding: 16, marginBottom: 16 }}>
            {/* Key numbers row */}
            <div style={{ display: "flex", gap: 28, flexWrap: "wrap", marginBottom: stats.sessions > 0 ? 16 : 0 }}>
              {[
                ["Sessions",     stats.sessions.toLocaleString()],
                ["Total Yards",  stats.yards.toLocaleString()],
                ["Avg / Session", stats.avg.toLocaleString()],
              ].map(([k, v]) => (
                <div key={k}>
                  <div style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>{k}</div>
                  <div style={{ fontSize: 22, fontWeight: 900, color: "#fff" }}>{v}</div>
                </div>
              ))}
              {/* Workouts / week with toggle */}
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 2 }}>
                  <span style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>Per Week</span>
                  <button
                    onClick={() => setWeekMode(m => m === "all" ? "4wk" : "all")}
                    style={{ fontSize: 9, padding: "1px 7px", borderRadius: 999, border: "1px solid #7c3aed", background: "#7c3aed33", color: "#c4b5fd", cursor: "pointer", fontWeight: 700 }}>
                    {weekMode === "all" ? "All time" : "4 wks"}
                  </button>
                </div>
                <div style={{ fontSize: 22, fontWeight: 900, color: "#fff" }}>
                  {(weekMode === "all" ? stats.wkAll : stats.wkRecent).toFixed(1)}
                </div>
              </div>
            </div>
            {/* Yards/week sparkline — last 12 ISO weeks */}
            {stats.sessions > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 6 }}>
                  <div style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>Yards / Week</div>
                  <div style={{ fontSize: 10, color: "#475569" }}>last 12 weeks</div>
                  {stats.sparkMax > 0 && (
                    <div style={{ marginLeft: "auto", fontSize: 10, color: "#64748b", fontVariantNumeric: "tabular-nums" }}>
                      peak {stats.sparkMax.toLocaleString()}
                    </div>
                  )}
                </div>
                {stats.sparkMax > 0 ? (
                  <svg viewBox="0 0 240 48" preserveAspectRatio="none"
                    style={{ width: "100%", height: 48, display: "block" }}>
                    {stats.weeks.map((w, i) => {
                      const bw = 240 / stats.weeks.length;
                      const x  = i * bw;
                      const h  = (w.yards / stats.sparkMax) * 44;
                      const y  = 48 - h;
                      const isCurrent = i === stats.weeks.length - 1;
                      return (
                        <g key={w.key}>
                          <rect
                            x={x + 1} y={y}
                            width={Math.max(0, bw - 2)} height={h}
                            fill={isCurrent ? "#38bdf8" : "#3b82f6"}
                            opacity={w.yards > 0 ? 0.95 : 0}
                            rx={1}
                          >
                            <title>Week of {w.key}: {w.yards.toLocaleString()} yds</title>
                          </rect>
                          {/* baseline tick so empty weeks are still legible */}
                          {w.yards === 0 && (
                            <rect x={x + 1} y={47} width={Math.max(0, bw - 2)} height={1} fill="#334155">
                              <title>Week of {w.key}: 0 yds</title>
                            </rect>
                          )}
                        </g>
                      );
                    })}
                  </svg>
                ) : (
                  <div style={{ fontSize: 11, color: "#64748b", fontStyle: "italic", padding: "4px 0" }}>
                    No completed workouts in the last 12 weeks.
                  </div>
                )}
              </div>

            {/* N4: Intensity distribution — stacked horizontal bar + 80/20 ratio */}
            {stats.sessions > 0 && stats.intensityYards > 0 && (
              <div style={{ marginBottom: 16 }}>
                <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 6 }}>
                  <div style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>Intensity</div>
                  <div style={{ fontSize: 10, color: "#475569" }}>
                    {typeWindow === "4wk" ? "4 wks" : typeWindow === "12wk" ? "12 wks" : "all time"}
                  </div>
                  {stats.ratio8020 && (
                    <div style={{ marginLeft: "auto", fontSize: 10, fontVariantNumeric: "tabular-nums" }}>
                      <span style={{ color: "#22c55e", fontWeight: 700 }}>{stats.ratio8020.easy}%</span>
                      <span style={{ color: "#475569" }}> easy/aerobic </span>
                      <span style={{ color: "#475569" }}>·</span>
                      <span style={{ color: "#f97316", fontWeight: 700 }}> {stats.ratio8020.hard}%</span>

                </div>
                {/* Stacked horizontal bar */}
                <div style={{ display: "flex", height: 14, borderRadius: 4, overflow: "hidden", background: "#0f172a", marginBottom: 6 }}>
                  {ZONE_ORDER.map(zId => {
                    const y   = stats.intensityTotals[zId] || 0;
                    const pct = stats.intensityYards > 0 ? (y / stats.intensityYards) * 100 : 0;

                    return (
                      <div key={zId}
                        title={`${ZONES[zId].label}: ${y.toLocaleString()} yds · ${pct.toFixed(1)}%`}

                <div style={{ display: "flex", flexWrap: "wrap", gap: "4px 14px", fontSize: 10 }}>
                  {ZONE_ORDER.map(zId => {

                    return (
                      <span key={zId} style={{ display: "inline-flex", alignItems: "center", gap: 4, color: pct > 0 ? "#cbd5e1" : "#475569" }}>
                        <span style={{ width: 8, height: 8, borderRadius: "50%", background: ZONES[zId].color, display: "inline-block", opacity: pct > 0 ? 1 : 0.4 }} />

                </div>
                {/* Bars-over-time: stacked weekly bars, last 12 ISO weeks */}
                {stats.weeklyIntensityMax > 0 && (
                  <div style={{ marginTop: 10 }}>
                    <div style={{ fontSize: 10, color: "#475569", marginBottom: 4 }}>last 12 weeks</div>

                      style={{ width: "100%", height: 48, display: "block" }}>
                      {stats.weeklyIntensity.map((w, i) => {
                        const bw = 240 / stats.weeklyIntensity.length;
                        const x  = i * bw;
                        const colWidth = Math.max(0, bw - 2);
                        const totalHeight = (w.total / stats.weeklyIntensityMax) * 44;
                        let yCursor = 48 - totalHeight;
                        const segments = [];
                        // Stack from easy (bottom) to anaerobic (top).
                        for (const zId of ZONE_ORDER) {
                          const ratio = w.total > 0 ? w.zones[zId] / w.total : 0;
                          if (ratio <= 0) continue;
                          const segH = totalHeight * ratio;
                          segments.push(
                            <rect key={zId}
                              x={x + 1} y={yCursor}
                              width={colWidth} height={segH}
                              fill={ZONES[zId].color} opacity={0.95}>
                              <title>{`${w.key} · ${ZONES[zId].label}: ${w.zones[zId].toLocaleString()} yds`}</title>
                            </rect>
                          );
                          yCursor += segH;
                        }
                        return (
                          <g key={w.key}>
                            {segments}
                            {/* baseline tick for empty weeks */}
                            {w.total === 0 && (
                              <rect x={x + 1} y={47} width={colWidth} height={1} fill="#334155">
                                <title>{`${w.key}: no yards`}</title>
                              </rect>
                            )}
                          </g>

                      })}

              </div>
            )}

            {/* Type distribution bars */}
            {stats.sessions > 0 && (
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
                  <div style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>Type Breakdown</div>
                  <div style={{ display: "inline-flex", gap: 4, marginLeft: "auto" }}>
                    {[
                      { id: "4wk",  label: "4 wks"  },
                      { id: "12wk", label: "12 wks" },
                      { id: "all",  label: "All"    },
                    ].map(o => {
                      const active = typeWindow === o.id;
                      return (
                        <button key={o.id} onClick={() => setTypeWindow(o.id)}
                          style={{
                            fontSize: 9, padding: "1px 7px", borderRadius: 999,
                            border: `1px solid ${active ? "#7c3aed" : "#334155"}`,
                            background: active ? "#7c3aed33" : "transparent",
                            color: active ? "#c4b5fd" : "#64748b",
                            cursor: "pointer", fontWeight: 700,
