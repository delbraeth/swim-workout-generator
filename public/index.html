                  </div>
                </div>
                {stats.typeBreakdown.length > 0 ? (
                  <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                    {stats.typeBreakdown.map(({ type, count, pct }) => {
                      const meta     = WORKOUT_TYPES.find(t => t.id === type);
                      const maxCount = stats.typeBreakdown[0].count;
                      return (
                        <div key={type} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                          <span style={{ fontSize: 11, color: "#cbd5e1", width: 90, flexShrink: 0, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                            {meta ? `${meta.emoji} ${meta.label}` : type}
                          </span>
                          <div style={{ flex: 1, background: "#0f172a", borderRadius: 4, height: 8, overflow: "hidden" }}>
                            <div style={{ width: `${(count / maxCount) * 100}%`, height: "100%", background: meta ? meta.badge : "#3b82f6", borderRadius: 4, transition: "width 0.4s" }} />
                          </div>
                          <span style={{ fontSize: 11, color: "#64748b", width: 44, textAlign: "right", flexShrink: 0, fontVariantNumeric: "tabular-nums" }}>{count} · {pct}%</span>
                        </div>
                      );
                    })}
                  </div>
                ) : (
                  <div style={{ fontSize: 11, color: "#64748b", fontStyle: "italic", padding: "4px 0" }}>
                    No completed workouts in this window.
                  </div>
                )}
              </div>
            )}
          </div>

          {/* Entries */}
          {filtered.map(entry => {
            const meta       = WORKOUT_TYPES.find(t => t.id === entry.type);
            const isExpanded = expandedId === entry.id;
            const isEditing  = editingId === entry.id;
            const eqList     = entry.equipment ? Object.entries(entry.equipment).filter(([, v]) => v).map(([k]) => k) : [];
            return (
              <div key={entry.id} style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 12, padding: 16, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 13, color: "#cbd5e1", fontVariantNumeric: "tabular-nums" }}>{entry.dateCompleted || "—"}</span>
                    <button
                      onClick={() => onUpdateCompleted(entry.id, !(entry.completed !== false))}
                      title={entry.completed !== false ? "Mark as planned" : "Mark as done"}
                      style={{
                        padding: "2px 9px", borderRadius: 999, border: "none", cursor: "pointer", fontSize: 11, fontWeight: 700,
                        background: entry.completed !== false ? "#16a34a22" : "#7c3aed22",
                        color:      entry.completed !== false ? "#86efac"   : "#c4b5fd",
                      }}>
                      {entry.completed !== false ? "✓ Done" : "Planned"}
                    </button>
                    {meta && (
                      <span style={{ background: meta.badge, color: meta.badgeText, borderRadius: 999, padding: "3px 10px", fontSize: 11, fontWeight: 700 }}>
                        {meta.emoji} {meta.label}
                      </span>
                    )}
                    {entry.userInitials && (
                      <span title="Logged by"
                        style={{ background: "#0ea5e9", color: "#fff", borderRadius: 999, padding: "3px 9px", fontSize: 10, fontWeight: 800, letterSpacing: "0.06em" }}>
                        {entry.userInitials}
                      </span>
                    )}
                    <span style={{ fontSize: 13, color: "#fff", fontWeight: 700 }}>{(entry.totalYards || 0).toLocaleString()} {(entry.poolMode === "50m" || entry.poolMode === "25m") ? "m" : "yds"}</span>
                    {entry.estimatedMin && <span style={{ fontSize: 11, color: "#64748b" }}>~{entry.estimatedMin} min</span>}
                    <span title={entry.difficulty != null ? `Self-rated difficulty: ${entry.difficulty}/5 — click to change` : "Click to rate difficulty (1–5)"}>
                      <StarRating
                        value={entry.difficulty ?? null}
                        size={14}
                        allowToggleClear={false}
                        showClear
                        onChange={n => onUpdateDifficulty(entry.id, n)}
                      />
                    </span>
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    <button onClick={() => setExpandedId(isExpanded ? null : entry.id)}
                      style={{ padding: "4px 10px", background: "transparent", color: "#93c5fd", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      {isExpanded ? "Hide" : "View"}
                    </button>
                    <button onClick={() => { setEditingId(entry.id); setEditingNotes(entry.notes || ""); }}
                      style={{ padding: "4px 10px", background: "transparent", color: "#cbd5e1", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      Notes
                    </button>
                    <button onClick={() => onRepeat(entry)}
                      title="Open this workout as a fresh, unsaved one to log again"
                      style={{ padding: "4px 10px", background: "transparent", color: "#86efac", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      🔁 Repeat
                    </button>
                    {entry.blocks && (
                      <button onClick={() => onRun(entry)}
                        title="Step through this workout section by section"
                        style={{ padding: "4px 10px", background: "transparent", color: "#93c5fd", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                        ▶ Run
                      </button>
                    )}
                    <button onClick={() => onLoadAndPrint(entry)}
                      style={{ padding: "4px 10px", background: "transparent", color: "#cbd5e1", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      🖨 Print
                    </button>
                    <button onClick={() => { if (window.confirm("Delete this workout from history?")) onDelete(entry.id); }}
                      style={{ padding: "4px 10px", background: "transparent", color: "#fca5a5", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      Delete
                    </button>
                  </div>
                </div>

                {eqList.length > 0 && (
                  <div style={{ marginTop: 8, display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {eqList.map(k => (
                      <span key={k} style={{ background: "#334155", color: "#cbd5e1", padding: "2px 8px", borderRadius: 999, fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em" }}>{k}</span>
                    ))}
                  </div>
                )}

                {entry.focusNote && (
                  <div style={{ marginTop: 8, fontSize: 12, color: "#93c5fd", fontWeight: 600 }}>
                    🎯 {entry.focusNote}
                  </div>
                )}

                {isEditing ? (
                  <div style={{ marginTop: 12 }}>
                    <textarea value={editingNotes} onChange={e => setEditingNotes(e.target.value)} rows={2}
                      style={{ width: "100%", padding: 8, background: "#0f172a", color: "#e2e8f0", border: "1px solid #475569", borderRadius: 6, fontSize: 13, fontFamily: "inherit", resize: "vertical" }} />
                    <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                      <button onClick={() => { onUpdateNotes(entry.id, editingNotes); setEditingId(null); }}
                        style={{ padding: "5px 14px", background: "#3b82f6", color: "#fff", border: "none", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Save Notes</button>
                      <button onClick={() => setEditingId(null)}
                        style={{ padding: "5px 14px", background: "transparent", color: "#94a3b8", border: "1px solid #334155", borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                    </div>
                  </div>
                ) : entry.notes ? (
                  <div style={{ marginTop: 8, color: "#cbd5e1", fontSize: 13, fontStyle: "italic", lineHeight: 1.4 }}>
                    “{entry.notes}”
                  </div>
                ) : null}

                {isExpanded && entry.blocks && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #334155" }}>
                    {entry.blocks.map((b, i) => <WorkoutBlock key={i} block={b} equipment={entry.equipment || {}} recentMainLabels={recentMainLabels} />)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PACE CLOCK
    //  Tap a set card to step through reps with a live countdown.
    // ═══════════════════════════════════════════════════════════════

    // Returns true when viewport is wider than it is tall (landscape).
    function useIsLandscape() {
      const [land, setLand] = useState(() => window.innerWidth > window.innerHeight);
      useEffect(() => {
        const update = () => setLand(window.innerWidth > window.innerHeight);
        window.addEventListener("resize", update);
        window.addEventListener("orientationchange", update);
        return () => {
          window.removeEventListener("resize", update);
          window.removeEventListener("orientationchange", update);
        };
      }, []);
      return land;
    }

    // Parse "On 2:00", "On :45", "On 1:10" → seconds. "No interval" → null.
    function parseIntervalSeconds(str) {
      if (!str || /no interval/i.test(str)) return null;
      const full = str.match(/(\d+):(\d{2})/);
      if (full) return parseInt(full[1], 10) * 60 + parseInt(full[2], 10);
      const sec  = str.match(/:(\d{2})/);
      if (sec)  return parseInt(sec[1], 10);
      return null;
    }

    function fmtTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function PaceClockView({ set, sectionName, focusNote, onClose, onNext, onWorkoutFinish, isLastSet, restSecs, autoStart, elapsed, audioCues = false, unit = "yds" }) {
      const totalSecs  = parseIntervalSeconds(set.interval);
      const hasTimer   = totalSecs !== null;
      const isLandscape = useIsLandscape();

      const [repIdx,    setRepIdx]   = useState(0);
      const [secsLeft,  setSecsLeft] = useState(totalSecs ?? 0);
      const [running,   setRunning]  = useState(() => !!(autoStart && totalSecs !== null));
      const [finished,  setFinished] = useState(false);
      const [restLeft,  setRestLeft] = useState(null); // null = not in rest phase

      // Tick down every second while running
      useEffect(() => {
        if (!running || !hasTimer) return;
        const id = setInterval(() => setSecsLeft(s => Math.max(0, s - 1)), 1000);
        return () => clearInterval(id);
      }, [running, hasTimer]);

      // When countdown hits zero, advance rep or finish
      useEffect(() => {
        if (!running || !hasTimer || secsLeft !== 0) return;
        if (repIdx + 1 >= set.reps) {
          setRunning(false);
          setFinished(true);
        } else {
          setRepIdx(r => r + 1);
          setSecsLeft(totalSecs);
        }
      }, [secsLeft, running, hasTimer]);

      // When a set finishes, kick off rest phase (or 1.5s flash for 0s)
      useEffect(() => {
        if (!finished || isLastSet || restSecs === null) return;
        if (restSecs === 0) {
          const id = setTimeout(() => { if (onNext) onNext(); }, 1500);
          return () => clearTimeout(id);
        }
        setRestLeft(restSecs);
      }, [finished, isLastSet, restSecs, onNext]);

      // Tick rest countdown; call onNext when it reaches zero.
      // W1: fire audio cues on the 3/2/1 beeps and the 0 "go" tone.
      useEffect(() => {
        if (restLeft === null) return;
        if (audioCues) {
          if (restLeft === 0)                 playRestCue("go");
          else if (restLeft <= 3)             playRestCue("beep");
        }
        if (restLeft === 0) { if (onNext) onNext(); return; }
        const id = setTimeout(() => setRestLeft(r => r - 1), 1000);
        return () => clearTimeout(id);
      }, [restLeft, audioCues]);

      const handleReset = () => {
        setRunning(false);
        setFinished(false);
        setRepIdx(0);
        setSecsLeft(totalSecs ?? 0);
      };

      const handleSkip = () => {
        if (repIdx + 1 >= set.reps) {
          setRunning(false);
          setFinished(true);
        } else {
          setRepIdx(r => r + 1);
          setSecsLeft(totalSecs ?? 0);
        }
      };

      const isAtStart = repIdx === 0 && secsLeft === (totalSecs ?? 0) && !running;

      // Rep dots shared between portrait and landscape
      const repDots = set.reps <= 20 && (
        <div style={{ display: "flex", gap: isLandscape ? 16 : 12, flexWrap: "wrap", justifyContent: "center" }}>
          {Array.from({ length: set.reps }).map((_, i) => (
            <div key={i} style={{
              width: isLandscape ? 28 : 18, height: isLandscape ? 28 : 18,
              borderRadius: "50%",
              background: i < repIdx ? "#22c55e" : i === repIdx ? "#3b82f6" : "#1e293b",
              border: `2px solid ${i < repIdx ? "#22c55e" : i === repIdx ? "#3b82f6" : "#334155"}`,
              transition: "background 0.3s, border-color 0.3s",
            }} />
          ))}
        </div>
      );

      // Controls shared between portrait and landscape
      const btnBase = {
        borderRadius: 16, fontWeight: 700, cursor: "pointer",
        padding: isLandscape ? "12px 0" : "22px 0",
        minHeight: isLandscape ? 52 : 70,
        fontSize: isLandscape ? 17 : 22,
      };
      const controls = (
        <div style={{ display: "flex", gap: isLandscape ? 10 : 14, width: "100%" }}>
          {!finished && (
            <>
              {hasTimer ? (
                <button onClick={() => setRunning(r => !r)} style={{
                  ...btnBase, flex: 2, border: "none",
                  background: running ? "#dc2626" : "#3b82f6",
                  color: "#fff", fontSize: isLandscape ? 20 : 26, fontWeight: 800,
                }}>
                  {running ? "⏸ Pause" : isAtStart ? "▶ Start" : "▶ Resume"}
                </button>
              ) : (
                <button onClick={handleSkip} style={{
                  ...btnBase, flex: 2, border: "none", background: "#3b82f6",
                  color: "#fff", fontSize: isLandscape ? 20 : 26, fontWeight: 800,
                }}>
                  {repIdx + 1 >= set.reps ? "Done ✓" : "Next Rep →"}
                </button>
              )}
              {hasTimer && (
                <button onClick={handleSkip} style={{
                  ...btnBase, flex: 1, border: "1px solid #334155",
                  background: "#0f172a", color: "#64748b",
                }}>
                  Skip →
                </button>
              )}
            </>
          )}
          {!finished ? (
            <button onClick={handleReset} style={{
              ...btnBase, border: "1px solid #1e293b", background: "transparent",
              color: "#475569", width: isLandscape ? undefined : "100%",
            }}>
              ↺ Reset
            </button>
          ) : isLastSet ? (
            <button onClick={onWorkoutFinish || onClose} style={{
              ...btnBase, flex: 1, border: "1px solid #16a34a",
              background: "#16a34a22", color: "#86efac",
            }}>
              Finish ✓
            </button>
          ) : restSecs === null ? (
            <button onClick={onNext || onClose} style={{
              ...btnBase, flex: 1, border: "1px solid #1e293b",
              background: "transparent", color: "#475569",
            }}>
              Next Set →
            </button>
          ) : restLeft !== null && restLeft > 0 ? (
            <button onClick={() => setRestLeft(0)} style={{
              ...btnBase, flex: 1, border: "1px solid #f59e0b",
              background: "transparent", color: "#f59e0b",
            }}>
              Skip Rest →
            </button>
          ) : null}
        </div>
      );

      if (isLandscape) {
        // ── LANDSCAPE: two-column layout ──────────────────────────────
        return (
          <div style={{
            position: "fixed", inset: 0, zIndex: 10000,
            background: "#020617",
            display: "flex", flexDirection: "column",
            fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          }}>
            {/* Top bar */}
            <div style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "8px 16px", borderBottom: "1px solid #1e293b", flexShrink: 0,
            }}>
              <button onClick={onClose} style={{
                background: "transparent", border: "none", color: "#94a3b8",
                fontSize: 28, lineHeight: 1, cursor: "pointer",
                padding: "4px 8px", borderRadius: 8, minWidth: 44, minHeight: 44,
              }}>✕</button>
              <div style={{ textAlign: "center", minWidth: 0, flex: 1, padding: "0 8px" }}>
                <div style={{ fontSize: 15, color: "#475569", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em" }}>
                  {sectionName || "Pace Clock"}
                </div>
                {focusNote && (
                  <div style={{ fontSize: 12, color: "#93c5fd", fontStyle: "italic", marginTop: 2, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                    🎯 {focusNote}
                  </div>
                )}
              </div>
              <div style={{ minWidth: 44, textAlign: "right" }}>
                {elapsed !== undefined && (
                  <div style={{ fontSize: 30, color: "#f59e0b", fontWeight: 700, fontFamily: "monospace", letterSpacing: "0.04em" }}>
                    {Math.floor(elapsed / 60)}:{String(elapsed % 60).padStart(2, "0")}
                  </div>
                )}
              </div>
            </div>

            {/* Two-column content */}
            <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>

              {/* Left: set info */}
              <div style={{
                flex: 1.1, display: "flex", flexDirection: "column",
                justifyContent: "center", padding: "12px 20px",
                borderRight: "1px solid #1e293b",
              }}>
                <div style={{ fontSize: 45, fontWeight: 800, color: "#e2e8f0", marginBottom: 6 }}>
                  {set.reps} × {set.dist} {unit}
                </div>
                <div style={{ fontSize: 32, color: "#cbd5e1", lineHeight: 1.35, marginBottom: 6 }}>
                  {set.desc}
                </div>
                <div style={{ fontSize: 32, color: "#475569", fontFamily: "monospace", marginBottom: 12 }}>
                  {set.interval}
                </div>
                {repDots}
              </div>

              {/* Right: clock */}
              <div style={{
                flex: 1, display: "flex", flexDirection: "column",
                alignItems: "center", justifyContent: "center", padding: "12px 16px",
              }}>
                {finished ? (
                  restLeft !== null && restLeft > 0 ? (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#f59e0b", letterSpacing: "0.12em", marginBottom: 6 }}>REST</div>
                      <div style={{ fontSize: 80, fontWeight: 900, color: "#f59e0b", fontFamily: "monospace", letterSpacing: "-0.03em", lineHeight: 1 }}>
                        {restLeft}
                      </div>
                      <div style={{ fontSize: 13, color: "#64748b", marginTop: 6 }}>Next set starting soon…</div>
                    </div>
                  ) : (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 48, marginBottom: 8 }}>✅</div>
                      <div style={{ fontSize: 28, fontWeight: 800, color: "#4ade80" }}>Set Complete!</div>
                      <div style={{ fontSize: 18, color: "#64748b", marginTop: 6 }}>
                        {set.reps} rep{set.reps !== 1 ? "s" : ""} done
                      </div>
                    </div>
                  )
                ) : (
                  <>
                    <div style={{ fontSize: 20, fontWeight: 700, color: "#64748b", marginBottom: 8, letterSpacing: "0.06em" }}>
                      REP <span style={{ color: "#e2e8f0" }}>{repIdx + 1}</span>
                      {" "}<span style={{ color: "#334155" }}>OF</span>{" "}
                      {set.reps}
                    </div>
                    {hasTimer ? (
                      <div style={{
                        fontSize: 80, fontWeight: 900,
                        color: running ? "#ffffff" : "#334155",
                        fontFamily: "monospace", letterSpacing: "-0.03em", lineHeight: 1,
                        transition: "color 0.25s",
                      }}>
                        {fmtTime(secsLeft)}
                      </div>
                    ) : (
                      <div style={{ fontSize: 20, color: "#475569", fontStyle: "italic" }}>
                        No interval — swim easy
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>

            {/* Controls */}
            <div style={{ padding: "10px 16px 14px", borderTop: "1px solid #1e293b", flexShrink: 0 }}>
              {controls}
            </div>
          </div>
        );
      }

      // ── PORTRAIT: original vertical layout ────────────────────────
      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 10000,
          background: "#020617",
          display: "flex", flexDirection: "column", alignItems: "center",
          fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        }}>
          {/* Top bar */}
          <div style={{
            width: "100%", display: "flex", justifyContent: "space-between",
            alignItems: "center", padding: "16px 20px",
            borderBottom: "1px solid #1e293b",
          }}>
            <button onClick={onClose} style={{
              background: "transparent", border: "none", color: "#94a3b8",
              fontSize: 36, lineHeight: 1, cursor: "pointer",
              padding: "4px 8px", borderRadius: 8, minWidth: 52, minHeight: 52,
            }}>✕</button>
            <div style={{ textAlign: "center", minWidth: 0, flex: 1, padding: "0 8px" }}>
              <div style={{ fontSize: 18, color: "#475569", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em" }}>
                {sectionName || "Pace Clock"}
              </div>
              {focusNote && (
                <div style={{ fontSize: 13, color: "#93c5fd", fontStyle: "italic", marginTop: 3, whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>
                  🎯 {focusNote}
                </div>
              )}
            </div>
            <div style={{ minWidth: 52, textAlign: "right" }}>
              {elapsed !== undefined && (
                <div style={{ fontSize: 36, color: "#f59e0b", fontWeight: 700, fontFamily: "monospace", letterSpacing: "0.04em" }}>
                  {Math.floor(elapsed / 60)}:{String(elapsed % 60).padStart(2, "0")}
                </div>
              )}
            </div>
          </div>

          {/* Set description + interval label */}
          <div style={{ width: "100%", padding: "20px 24px 0", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 800, color: "#e2e8f0", lineHeight: 1.3, marginBottom: 8 }}>
              {set.reps} × {set.dist} {unit}
            </div>
            <div style={{ fontSize: 30, color: "#cbd5e1", lineHeight: 1.4, marginBottom: 8 }}>
              {set.desc}
            </div>
            <div style={{ fontSize: 20, color: "#475569", fontFamily: "monospace" }}>
              {set.interval}
            </div>
          </div>

          {/* Clock area */}
          <div style={{
            flex: 1, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center",
            width: "100%", padding: "0 24px",
          }}>
            {finished ? (
              restLeft !== null ? (
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 18, fontWeight: 700, color: "#f59e0b", letterSpacing: "0.12em", marginBottom: 8 }}>REST</div>
                  <div style={{ fontSize: 110, fontWeight: 900, color: "#f59e0b", fontFamily: "monospace", letterSpacing: "-0.03em", lineHeight: 1, marginBottom: 20 }}>
                    {restLeft}
                  </div>
                  <div style={{ fontSize: 16, color: "#64748b" }}>Next set starting soon…</div>
                </div>
              ) : (
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 72, marginBottom: 16 }}>✅</div>
                  <div style={{ fontSize: 38, fontWeight: 800, color: "#4ade80" }}>Set Complete!</div>
                  <div style={{ fontSize: 24, color: "#64748b", marginTop: 12 }}>
                    {set.reps} rep{set.reps !== 1 ? "s" : ""} done
                  </div>
                </div>
              )
            ) : (
              <>
                <div style={{ fontSize: 28, fontWeight: 700, color: "#64748b", marginBottom: 16, letterSpacing: "0.06em" }}>
                  REP <span style={{ color: "#e2e8f0" }}>{repIdx + 1}</span>
                  {" "}<span style={{ color: "#334155" }}>OF</span>{" "}
                  {set.reps}
                </div>
                {hasTimer ? (
                  <div style={{
                    fontSize: 110, fontWeight: 900,
                    color: running ? "#ffffff" : "#334155",
                    fontFamily: "monospace", letterSpacing: "-0.03em", lineHeight: 1,
                    marginBottom: 28, transition: "color 0.25s",
                  }}>
                    {fmtTime(secsLeft)}
                  </div>
                ) : (
                  <div style={{ fontSize: 26, color: "#475569", marginBottom: 28, fontStyle: "italic" }}>
                    No interval — swim easy
                  </div>
                )}
                <div style={{ marginBottom: 8 }}>{repDots}</div>
              </>
            )}
          </div>

          {/* Controls */}
          <div style={{ width: "100%", padding: "0 20px 40px", display: "flex", flexDirection: "column", gap: 14 }}>
            {controls}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  REST PICKER MODAL — shown when tapping "Run Workout"
    // ═══════════════════════════════════════════════════════════════

    const REST_OPTIONS = [
      { label: "Manual", value: null },
      { label: "0s",     value: 0 },
      { label: "30s",    value: 30 },
      { label: "45s",    value: 45 },
      { label: "60s",    value: 60 },
    ];

    // ═══════════════════════════════════════════════════════════════
    //  PROFILE / ACCOUNT MODAL — identity, stats, active sessions
    // ═══════════════════════════════════════════════════════════════
    // Goal metric metadata — shared by ProfileModal (set/edit) and the
    // generator stats panel (progress bars).
    const GOAL_METRICS = [
      { id: "workouts_per_week", label: "Workouts / week", unit: "workouts", period: "week",  defaultTarget: 3 },
      { id: "yards_per_week",    label: "Yards / week",    unit: "yds",      period: "week",  defaultTarget: 8000 },
      { id: "yards_per_month",   label: "Yards / month",   unit: "yds",      period: "month", defaultTarget: 32000 },
    ];

    // Single editable row used in the Profile modal's Identity panel.
    // Click "Edit" → input + Save/Cancel. onSave throws on validation error.
    function EditableProfileField({ label, value, placeholder, maxLength, type = "text", transform, badge, onSave }) {
      const [editing, setEditing] = React.useState(false);
      const [draft, setDraft]     = React.useState("");
      const [saving, setSaving]   = React.useState(false);
      const [error, setError]     = React.useState(null);
      const startEdit = () => {
        setDraft(value || "");
        setError(null);
        setEditing(true);
      };
      const commit = async () => {
        const v = transform ? transform(draft) : draft;
        setSaving(true); setError(null);
        try {
          await onSave(v.trim());
          setEditing(false);
        } catch (err) {
          setError(err.message || String(err));
        } finally {
          setSaving(false);
        }
      };
      return (
        <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "4px 0" }}>
          <span style={{ color: "#64748b", width: 100, flexShrink: 0 }}>{label}:</span>
          {editing ? (
            <>
              <input
                type={type}
                value={draft}
                autoFocus
                maxLength={maxLength}
                placeholder={placeholder}
                onChange={e => setDraft(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
                style={{
                  flex: 1, minWidth: 0,
                  padding: "5px 9px", fontSize: 13,
                  background: "#0f172a", color: "#e2e8f0",
                  border: "1px solid #3b82f6", borderRadius: 5, outline: "none",
                }} />
              <button onClick={commit} disabled={saving}
                style={{ padding: "5px 11px", borderRadius: 5, border: "none",
                  background: saving ? "#1e3a5f" : "#3b82f6", color: "#fff",
                  fontSize: 12, fontWeight: 700, cursor: saving ? "default" : "pointer" }}>
                {saving ? "…" : "Save"}
              </button>
              <button onClick={() => setEditing(false)} disabled={saving}
                style={{ padding: "5px 9px", borderRadius: 5,
                  border: "1px solid #334155", background: "transparent",
                  color: "#64748b", fontSize: 11, cursor: "pointer" }}>
                Cancel
              </button>
            </>
          ) : (
            <>
              <span style={{ flex: 1, color: "#e2e8f0", fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                {value || <span style={{ color: "#475569", fontStyle: "italic", fontWeight: 400 }}>{placeholder || "—"}</span>}
                {badge}
              </span>
              <button onClick={startEdit}
                style={{ padding: "4px 10px", borderRadius: 5,
                  border: "1px solid #334155", background: "transparent",
                  color: "#93c5fd", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                Edit
              </button>
            </>
          )}
          {error && (
            <span style={{ color: "#fca5a5", fontSize: 11, marginLeft: 8 }}>{error}</span>
          )}
        </div>
      );
    }

    function GoalRow({ metric, value, onSave, onDelete }) {
      const [editing, setEditing] = React.useState(false);
      const [draft, setDraft]     = React.useState("");
      const startEdit = () => {
        setDraft(String(value ?? metric.defaultTarget));
        setEditing(true);
      };
      const commit = () => {
        const v = parseInt(draft, 10);
        if (v > 0) onSave(v);
        setEditing(false);
      };
      const isSet = value != null;
      return (
        <div style={{
          display: "flex", alignItems: "center", gap: 10,
          background: "#1e293b", border: "1px solid #334155",
          borderRadius: 8, padding: "8px 12px",
        }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, color: "#e2e8f0", fontWeight: 600 }}>{metric.label}</div>
            {!editing && isSet && (
              <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>
                Target: <span style={{ color: "#93c5fd", fontWeight: 700 }}>{value.toLocaleString()}</span> {metric.unit}
              </div>
            )}
          </div>
          {editing ? (
            <>
              <input type="number" autoFocus value={draft} min={1}
                onChange={e => setDraft(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
                style={{
                  width: 80, padding: "4px 8px", fontSize: 13,
                  background: "#0f172a", color: "#e2e8f0",
                  border: "1px solid #3b82f6", borderRadius: 6, outline: "none",
                  fontFamily: "monospace", textAlign: "right",
                }} />
              <button onClick={commit}
                style={{ padding: "4px 10px", borderRadius: 6, border: "none",
                  background: "#3b82f6", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                Save
              </button>
              <button onClick={() => setEditing(false)}
                style={{ padding: "4px 8px", borderRadius: 6,
                  border: "1px solid #334155", background: "transparent",
                  color: "#64748b", fontSize: 11, cursor: "pointer" }}>
                Cancel
              </button>
            </>
          ) : isSet ? (
            <>
              <button onClick={startEdit}
                style={{ padding: "4px 10px", borderRadius: 6,
                  border: "1px solid #334155", background: "transparent",
                  color: "#cbd5e1", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                Edit
              </button>
              <button onClick={onDelete}
                title="Remove this goal"
                style={{ padding: "4px 8px", borderRadius: 6,
                  border: "1px solid #334155", background: "transparent",
                  color: "#fca5a5", fontSize: 11, cursor: "pointer" }}>
                ✕
              </button>
            </>
          ) : (
            <button onClick={startEdit}
              style={{ padding: "4px 12px", borderRadius: 6, border: "1px dashed #475569",
                background: "transparent", color: "#93c5fd",
                fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
              + Set a goal
            </button>
          )}
        </div>
      );
    }

    // N5: PhaseRow lives in the Profile modal Goals section. Five buttons,
    // single-select; clicking the active one clears the phase.
    function PhaseRow({ value, onChange }) {
      const selected = value && PHASES[value] ? PHASES[value] : null;
      return (
        <div style={{
          display: "flex", flexDirection: "column", gap: 8,
          background: "#1e293b", border: "1px solid #334155",
          borderRadius: 8, padding: "8px 12px",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              <div style={{ fontSize: 13, color: "#e2e8f0", fontWeight: 600 }}>📅 Training phase</div>
              <div style={{ fontSize: 11, color: "#64748b", marginTop: 2 }}>
                {selected
                  ? <><span style={{ color: selected.color, fontWeight: 700 }}>{selected.emoji} {selected.label}</span> · {selected.description}</>
                  : <span style={{ fontStyle: "italic" }}>No phase set — generator runs without phase bias.</span>}
              </div>
            </div>
          </div>
          <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
            {PHASE_ORDER.map(pid => {
              const p = PHASES[pid];
              const active = value === pid;
              return (
                <button key={pid}
                  onClick={() => onChange(active ? null : pid)}
                  title={`${p.label} — ${p.description}`}
                  style={{
                    padding: "5px 11px", borderRadius: 999,
                    border: `1px solid ${active ? p.color : "#334155"}`,
                    background: active ? `${p.color}22` : "transparent",
                    color: active ? p.color : "#94a3b8",
                    fontSize: 12, fontWeight: 700, cursor: "pointer",
                    display: "inline-flex", alignItems: "center", gap: 4,
                  }}>
                  <span>{p.emoji}</span>
                  <span>{p.label}</span>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    function NextEventRow({ value, onSave, onClear }) {
      const [editing, setEditing] = React.useState(false);
      const [draftName, setDraftName] = React.useState("");
      const [draftDate, setDraftDate] = React.useState("");
      const startEdit = () => {
        setDraftName(value?.name || "");
        setDraftDate(value?.date || "");
        setEditing(true);
      };
      const commit = async () => {
        const ok = await onSave(draftName, draftDate);
        if (ok) setEditing(false);
      };
      const isSet = value && value.name && value.date;
      // Display "N days" relative to today for the read-only view.
      const daysLabel = (() => {
        if (!isSet) return null;
        const today = new Date(); today.setHours(0,0,0,0);
        const target = new Date(`${value.date}T00:00:00`);
        if (isNaN(target)) return null;
        const d = Math.round((target - today) / 86400000);
        if (d < 0) return `${Math.abs(d)}d ago`;
        if (d === 0) return "today!";
        if (d === 1) return "tomorrow";
        return `${d} days`;
      })();
      return (
        <div style={{
          display: "flex", alignItems: "center", gap: 10,
          background: "#1e293b", border: "1px solid #334155",
          borderRadius: 8, padding: "8px 12px",
        }}>
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ fontSize: 13, color: "#e2e8f0", fontWeight: 600 }}>🏁 Next event</div>
            {!editing && isSet && (
              <div style={{ fontSize: 11, color: "#64748b", marginTop: 2, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                <span style={{ color: "#93c5fd", fontWeight: 700 }}>{value.name}</span>
                <span> · {value.date}</span>
                {daysLabel && <span style={{ color: "#475569" }}> · {daysLabel}</span>}
              </div>
            )}
          </div>
          {editing ? (
            <>
              <input type="text" autoFocus value={draftName}
                placeholder="Event name"
                maxLength={80}
                onChange={e => setDraftName(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
                style={{
                  width: 140, padding: "4px 8px", fontSize: 13,
                  background: "#0f172a", color: "#e2e8f0",
                  border: "1px solid #3b82f6", borderRadius: 6, outline: "none",
                }} />
              <input type="date" value={draftDate}
                onChange={e => setDraftDate(e.target.value)}
                onKeyDown={e => { if (e.key === "Enter") commit(); if (e.key === "Escape") setEditing(false); }}
                style={{
                  padding: "4px 6px", fontSize: 13,
                  background: "#0f172a", color: "#e2e8f0",
                  border: "1px solid #3b82f6", borderRadius: 6, outline: "none",
                  colorScheme: "dark",
                }} />
              <button onClick={commit}
                style={{ padding: "4px 10px", borderRadius: 6, border: "none",
                  background: "#3b82f6", color: "#fff", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                Save
              </button>
              <button onClick={() => setEditing(false)}
                style={{ padding: "4px 8px", borderRadius: 6,
                  border: "1px solid #334155", background: "transparent",
                  color: "#64748b", fontSize: 11, cursor: "pointer" }}>
                Cancel
              </button>
            </>
          ) : isSet ? (
            <>
              <button onClick={startEdit}
                style={{ padding: "4px 10px", borderRadius: 6,
                  border: "1px solid #334155", background: "transparent",
                  color: "#cbd5e1", fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
                Edit
              </button>
              <button onClick={onClear}
                title="Remove this event"
                style={{ padding: "4px 8px", borderRadius: 6,
                  border: "1px solid #334155", background: "transparent",
                  color: "#fca5a5", fontSize: 11, cursor: "pointer" }}>
                ✕
              </button>
            </>
          ) : (
            <button onClick={startEdit}
              style={{ padding: "4px 12px", borderRadius: 6, border: "1px dashed #475569",
                background: "transparent", color: "#93c5fd",
                fontSize: 11, fontWeight: 700, cursor: "pointer" }}>
              + Set an event
            </button>
          )}
        </div>
      );
    }

    function ProfileModal({ onClose, onProfileChange }) {
      const [me, setMe]             = React.useState(null);
      const [sessions, setSessions] = React.useState([]);
      const [goals, setGoals]       = React.useState([]);
      const [nextEvent, setNextEventLocal] = React.useState(null); // { name, date } | null
      const [phase, setPhaseLocal]  = React.useState(null);        // N5
      const [loading, setLoading]   = React.useState(true);
      const [revoking, setRevoking] = React.useState(false);
      const [revokeMsg, setRevokeMsg] = React.useState(null);

      const loadAll = React.useCallback(async () => {
        setLoading(true);
        try {
          const [meRes, sessRes, goalsRes, settingsRes] = await Promise.all([
            fetch("/api/me", { cache: "no-store" }).then(r => r.ok ? r.json() : null),
            fetch("/api/auth/sessions", { cache: "no-store" }).then(r => r.ok ? r.json() : []),
            fetch("/api/goals", { cache: "no-store" }).then(r => r.ok ? r.json() : []),
            fetch("/api/settings", { cache: "no-store" }).then(r => r.ok ? r.json() : {}),
          ]);
          setMe(meRes);
          setSessions(Array.isArray(sessRes) ? sessRes : []);
          setGoals(Array.isArray(goalsRes) ? goalsRes : []);
          setNextEventLocal(settingsRes?.next_event && settingsRes.next_event.name && settingsRes.next_event.date ? settingsRes.next_event : null);
          setPhaseLocal(settingsRes?.phase && PHASES[settingsRes.phase] ? settingsRes.phase : null);
        } finally {
          setLoading(false);
        }
      }, []);

      React.useEffect(() => { loadAll(); }, [loadAll]);

      const handleSignoutOthers = async () => {
        setRevoking(true); setRevokeMsg(null);
        try {
          const res = await fetch("/api/auth/signout-all-others", {
            method: "POST",
            headers: { ...csrfHeaders() },
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            setRevokeMsg(`Signed out ${data.revoked} other session(s).`);
            await loadAll();
          } else {
            setRevokeMsg(`Error: ${data.error || res.status}`);
          }
        } catch (err) {
          setRevokeMsg(`Error: ${err.message}`);
        } finally {
          setRevoking(false);
        }
      };

      const handleSaveGoal = async (metric, targetValue) => {
        const v = parseInt(targetValue, 10);
        if (!v || v <= 0) return;
        const res = await fetch("/api/goals", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...csrfHeaders() },
          body: JSON.stringify({ metric, target_value: v }),
        });
        if (res.ok) {
          setGoals(prev => {
            const without = prev.filter(g => g.metric !== metric);
            return [...without, { metric, target_value: v }];
          });
        }
      };

      const handleDeleteGoal = async (metric) => {
        const res = await fetch(`/api/goals/${encodeURIComponent(metric)}`, {
          method: "DELETE",
          headers: { ...csrfHeaders() },
        });
        if (res.ok) {
          setGoals(prev => prev.filter(g => g.metric !== metric));
        }
      };

      const handleSaveNextEvent = async (name, date) => {
        const trimmed = (name || "").trim();
        if (!trimmed || !/^\d{4}-\d{2}-\d{2}$/.test(date)) return false;
        const res = await fetch("/api/settings/extra", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...csrfHeaders() },
          body: JSON.stringify({ next_event: { name: trimmed, date } }),
        });
        if (res.ok) {
          setNextEventLocal({ name: trimmed, date });
          if (onProfileChange) onProfileChange();
          return true;
        }
        return false;
      };

      const handleClearNextEvent = async () => {
        const res = await fetch("/api/settings/extra", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...csrfHeaders() },
          body: JSON.stringify({ next_event: null }),
        });
        if (res.ok) {
          setNextEventLocal(null);
          if (onProfileChange) onProfileChange();
        }
      };

      // N5: set or clear the training phase. Null = cleared (no phase bias).
      const handleSetPhase = async (phaseId) => {
        const value = phaseId && PHASES[phaseId] ? phaseId : null;
        const res = await fetch("/api/settings/extra", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...csrfHeaders() },
          body: JSON.stringify({ phase: value }),
        });
        if (res.ok) {
          setPhaseLocal(value);
          if (onProfileChange) onProfileChange();
        }
      };

      const handleRevokeOne = async (prefix) => {
        setRevokeMsg(null);
        try {
          const res = await fetch(`/api/auth/sessions/${encodeURIComponent(prefix)}`, {
            method: "DELETE",
            headers: { ...csrfHeaders() },
          });
          const data = await res.json().catch(() => ({}));
          if (res.ok) {
            setRevokeMsg(`Revoked session ${prefix}…`);
            await loadAll();
          } else {
            setRevokeMsg(`Error: ${data.error || res.status}`);
          }
        } catch (err) {
          setRevokeMsg(`Error: ${err.message}`);
        }
      };

      const fmtDate = (d) => d ? new Date(d).toLocaleDateString("en-US", { year: "numeric", month: "short", day: "numeric" }) : "—";
      const fmtTime = (d) => d ? new Date(d).toLocaleString("en-US", { dateStyle: "short", timeStyle: "short" }) : "—";
      const poolLabel = (m) => ({ "25y": "SCY (25y)", "25m": "SCM (25m)", "50m": "LCM (50m)", "yds": "SCY (legacy)" })[m] || m;
      const poolUnit  = (m) => (m === "50m" || m === "25m") ? "m" : "yds";

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,0.85)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
        }} onClick={onClose}>
          <div onClick={e => e.stopPropagation()} style={{
            background: "#0f172a", border: "1px solid #334155", borderRadius: 12,
            maxWidth: 560, width: "100%", maxHeight: "85vh", overflowY: "auto",
            color: "#cbd5e1",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px", borderBottom: "1px solid #334155" }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "#e2e8f0" }}>👤 Account</div>
              <button onClick={onClose} style={{ background: "transparent", border: "none", color: "#94a3b8", fontSize: 20, cursor: "pointer", padding: 4 }}>✕</button>
            </div>

            {loading ? (
              <div style={{ padding: 40, textAlign: "center", color: "#64748b" }}>Loading…</div>
            ) : !me ? (
              <div style={{ padding: 40, textAlign: "center", color: "#f87171" }}>Could not load profile.</div>
            ) : (
              <>
                <div style={{ padding: "18px 20px" }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10 }}>Identity</div>
                  <div style={{ display: "grid", gap: 6, fontSize: 13 }}>
                    <EditableProfileField
                      label="Name"
                      field="display_name"
                      value={me.display_name}
                      placeholder="Your name (used to personalize the app)"
                      maxLength={120}
                      onSave={async (v) => {
                        const res = await fetch("/api/me", {
                          method: "PATCH",
                          headers: { "Content-Type": "application/json", ...csrfHeaders() },
                          body: JSON.stringify({ display_name: v }),
                        });
                        if (!res.ok) {
                          const body = await res.json().catch(() => ({}));
                          throw new Error(body.error || `HTTP ${res.status}`);
                        }
                        setMe(prev => prev ? { ...prev, display_name: v || null } : prev);
                        if (onProfileChange) onProfileChange();
                      }} />
                    <EditableProfileField
                      label="Initials"
                      field="initials"
                      value={me.initials}
                      placeholder="Up to 8 characters"
                      maxLength={8}
                      transform={(v) => v.toUpperCase()}
                      onSave={async (v) => {
                        const res = await fetch("/api/me", {
                          method: "PATCH",
                          headers: { "Content-Type": "application/json", ...csrfHeaders() },
                          body: JSON.stringify({ initials: v }),
                        });
                        if (!res.ok) {
                          const body = await res.json().catch(() => ({}));
                          throw new Error(body.error || `HTTP ${res.status}`);
                        }
                        setMe(prev => prev ? { ...prev, initials: v || null } : prev);
                        if (onProfileChange) onProfileChange();
                      }} />
                    <EditableProfileField
                      label="Email"
                      field="email"
                      type="email"
                      value={me.email}
                      placeholder="you@example.com"
                      badge={me.email_verified ? <span style={{ color: "#10b981", fontSize: 11, marginLeft: 4 }}>✓ verified</span> : null}
                      onSave={async (v) => {
                        const res = await fetch("/api/me", {
                          method: "PATCH",
                          headers: { "Content-Type": "application/json", ...csrfHeaders() },
                          body: JSON.stringify({ email: v }),
                        });
                        if (!res.ok) {
                          const body = await res.json().catch(() => ({}));
                          throw new Error(body.error || `HTTP ${res.status}`);
                        }
                        setMe(prev => prev ? { ...prev, email: v || null, email_verified: (v === prev.email) ? prev.email_verified : false } : prev);
                        if (onProfileChange) onProfileChange();
                      }} />
                    <div style={{ display: "grid", gridTemplateColumns: "auto 1fr", gap: "6px 16px", marginTop: 4 }}>
                      <span style={{ color: "#64748b" }}>Member since:</span>
                      <span style={{ color: "#e2e8f0" }}>{fmtDate(me.created_at)}</span>
                      <span style={{ color: "#64748b" }}>Last login:</span>
                      <span style={{ color: "#e2e8f0" }}>{fmtTime(me.last_login_at)}</span>
                      {me.is_admin && (<>
                        <span style={{ color: "#64748b" }}>Role:</span>
                        <span style={{ color: "#a78bfa", fontWeight: 700 }}>Admin</span>
                      </>)}
                    </div>
                  </div>
                </div>

                <div style={{ padding: "18px 20px", borderTop: "1px solid #1e293b" }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10 }}>Workouts</div>
                  <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 12 }}>
                    <span style={{ fontSize: 28, fontWeight: 900, color: "#e2e8f0" }}>{me.workout_count.toLocaleString()}</span>
                    <span style={{ fontSize: 11, color: "#64748b" }}>total saved</span>
                  </div>
                  {me.stats_by_pool.length > 0 && (
                    <div style={{ fontSize: 12, display: "grid", gap: 4 }}>
                      {me.stats_by_pool.map(s => (
                        <div key={s.pool_mode} style={{ display: "flex", justifyContent: "space-between" }}>
                          <span style={{ color: "#94a3b8" }}>{poolLabel(s.pool_mode)}</span>
                          <span style={{ color: "#e2e8f0" }}>{s.count.toLocaleString()} workouts · {s.total.toLocaleString()} {poolUnit(s.pool_mode)}</span>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

                <div style={{ padding: "18px 20px", borderTop: "1px solid #1e293b" }}>
                  <div style={{ fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 10 }}>
                    🎯 Goals
                  </div>
                  <div style={{ display: "grid", gap: 8 }}>
                    {GOAL_METRICS.map(m => {
                      const existing = goals.find(g => g.metric === m.id);
                      return (
                        <GoalRow key={m.id} metric={m}
                          value={existing ? existing.target_value : null}
                          onSave={(v) => handleSaveGoal(m.id, v)}
                          onDelete={() => handleDeleteGoal(m.id)} />
                      );
                    })}
                    <NextEventRow value={nextEvent}
                      onSave={handleSaveNextEvent}
                      onClear={handleClearNextEvent} />
                    <PhaseRow value={phase} onChange={handleSetPhase} />
                  </div>
                </div>

                <div style={{ padding: "18px 20px", borderTop: "1px solid #1e293b" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
                    <div style={{ fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.1em" }}>Active sessions ({sessions.length})</div>
                    {sessions.length > 1 && (
                      <button onClick={handleSignoutOthers} disabled={revoking} style={{ background: "#334155", border: "none", borderRadius: 6, padding: "4px 10px", fontSize: 11, color: "#e2e8f0", cursor: revoking ? "wait" : "pointer", fontWeight: 600 }}>
                        {revoking ? "Revoking…" : "Sign out everywhere else"}
                      </button>
                    )}
                  </div>
                  {revokeMsg && (
                    <div style={{ fontSize: 12, color: "#10b981", marginBottom: 12 }}>{revokeMsg}</div>
                  )}
                  <div style={{ display: "grid", gap: 8, fontSize: 12 }}>
                    {sessions.map(s => (
                      <div key={s.id_prefix} style={{ background: s.is_current ? "#1e3a5f" : "#1e293b", border: "1px solid #334155", borderRadius: 8, padding: 10 }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                          <span style={{ color: "#e2e8f0", fontWeight: 600, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                            {s.user_agent ? s.user_agent.slice(0, 70) : "Unknown browser"}
                            {s.is_current && <span style={{ marginLeft: 8, fontSize: 10, color: "#10b981", fontWeight: 700 }}>● this device</span>}
                          </span>
                          <span style={{ color: "#64748b", fontSize: 10, flexShrink: 0 }}>{s.id_prefix}</span>
                        </div>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
                          <span style={{ color: "#64748b", fontSize: 11 }}>{s.ip || "—"} · last seen {fmtTime(s.last_seen_at)}</span>
                          {!s.is_current && (
                            <button onClick={() => handleRevokeOne(s.id_prefix)} style={{ background: "transparent", border: "1px solid #475569", borderRadius: 6, padding: "2px 8px", fontSize: 10, color: "#cbd5e1", cursor: "pointer", fontWeight: 600 }}>
                              Revoke
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  ADMIN VIEW — users, invites, audit log
    // ═══════════════════════════════════════════════════════════════
    function AdminView() {
      const [tab, setTab] = React.useState("users");

      const tabStyle = (active) => ({
        padding: "8px 16px", border: "none", borderRadius: 8,
        background: active ? "#a78bfa" : "#1e293b",
        color: active ? "#0f172a" : "#94a3b8",
        fontSize: 13, fontWeight: 700, cursor: "pointer",
        marginRight: 8,
      });

      return (
        <div>
          <h2 style={{ color: "#e2e8f0", marginTop: 0 }}>🛡 Admin</h2>
          <div style={{ marginBottom: 20 }}>
            <button onClick={() => setTab("users")}   style={tabStyle(tab === "users")}>Users</button>
            <button onClick={() => setTab("invites")} style={tabStyle(tab === "invites")}>Invites</button>
            <button onClick={() => setTab("audit")}   style={tabStyle(tab === "audit")}>Audit log</button>
          </div>
          {tab === "users"   && <AdminUsers />}
          {tab === "invites" && <AdminInvites />}
          {tab === "audit"   && <AdminAudit />}
        </div>
      );
    }

    function AdminUsers() {
      const [users, setUsers] = React.useState(null);
      const [msg, setMsg]     = React.useState(null);
      const [editing, setEditing] = React.useState(null); // user being edited

      const load = React.useCallback(async () => {
        const r = await fetch("/api/admin/users", { cache: "no-store" });
        setUsers(r.ok ? await r.json() : []);
      }, []);
      React.useEffect(() => { load(); }, [load]);

      const act = async (sub, action) => {
        setMsg(null);
        let url, method = "POST";
        if (action === "disable") url = `/api/admin/users/${encodeURIComponent(sub)}/disable`;
        else if (action === "enable") url = `/api/admin/users/${encodeURIComponent(sub)}/enable`;
        else if (action === "delete") {
          if (!confirm(`Delete user ${sub.slice(0, 10)}…?\n\nThis cascades and wipes all their workouts, favorites, settings, and sessions. Audit events stay (anonymized). NOT REVERSIBLE.`)) return;
          url = `/api/admin/users/${encodeURIComponent(sub)}`;
          method = "DELETE";
        }
        const r = await fetch(url, { method, headers: { ...csrfHeaders() } });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { setMsg(`Error: ${data.error || r.status}`); return; }
        setMsg(`${action} → ok`);
        await load();
      };

      if (users === null) return <div style={{ color: "#64748b" }}>Loading…</div>;
      return (
        <div>
          {msg && <div style={{ fontSize: 12, color: "#10b981", marginBottom: 10 }}>{msg}</div>}
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, color: "#cbd5e1" }}>
            <thead>
              <tr style={{ borderBottom: "1px solid #334155", color: "#64748b", textAlign: "left" }}>
                <th style={{ padding: "8px 6px" }}>Initials</th>
                <th style={{ padding: "8px 6px" }}>Name</th>
                <th style={{ padding: "8px 6px" }}>Email</th>
                <th style={{ padding: "8px 6px", textAlign: "right" }}>Workouts</th>
                <th style={{ padding: "8px 6px" }}>Last login</th>
                <th style={{ padding: "8px 6px" }}>Flags</th>
                <th style={{ padding: "8px 6px" }}>Actions</th>
              </tr>
            </thead>
            <tbody>
              {users.map(u => (
                <tr key={u.sub} style={{ borderBottom: "1px solid #1e293b" }}>
                  <td style={{ padding: "8px 6px", fontWeight: 700 }}>{u.initials || "—"}</td>
                  <td style={{ padding: "8px 6px" }}>{u.display_name || "—"}</td>
                  <td style={{ padding: "8px 6px" }} title={u.sub}>{u.email || u.sub.slice(0, 16) + "…"}</td>
                  <td style={{ padding: "8px 6px", textAlign: "right" }}>{u.workout_count}</td>
                  <td style={{ padding: "8px 6px", color: "#94a3b8" }}>{u.last_login_at ? new Date(u.last_login_at).toLocaleDateString() : "—"}</td>
                  <td style={{ padding: "8px 6px" }}>
                    {u.is_admin    && <span style={{ background: "#a78bfa", color: "#0f172a", padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700, marginRight: 4 }}>admin</span>}
                    {u.is_disabled && <span style={{ background: "#7f1d1d", color: "#fee2e2", padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700 }}>disabled</span>}
                  </td>
                  <td style={{ padding: "8px 6px" }}>
                    <button onClick={() => setEditing(u)} style={{ marginRight: 4, fontSize: 11, padding: "3px 8px", background: "#334155", border: "none", borderRadius: 4, color: "#cbd5e1", cursor: "pointer" }}>
                      Edit
                    </button>
                    <button onClick={() => act(u.sub, u.is_disabled ? "enable" : "disable")} style={{ marginRight: 4, fontSize: 11, padding: "3px 8px", background: "#334155", border: "none", borderRadius: 4, color: "#cbd5e1", cursor: "pointer" }}>
                      {u.is_disabled ? "Enable" : "Disable"}
                    </button>
                    <button onClick={() => act(u.sub, "delete")} style={{ fontSize: 11, padding: "3px 8px", background: "#7f1d1d", border: "none", borderRadius: 4, color: "#fee2e2", cursor: "pointer" }}>
                      Delete
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
          {editing && (
            <EditUserModal user={editing} onClose={() => setEditing(null)} onSaved={() => { setEditing(null); setMsg("updated"); load(); }} />
          )}
        </div>
      );
    }

    function EditUserModal({ user, onClose, onSaved }) {
      const [initials,    setInitials]    = React.useState(user.initials     || "");
      const [displayName, setDisplayName] = React.useState(user.display_name || "");
      const [email,       setEmail]       = React.useState(user.email        || "");
      const [saving, setSaving] = React.useState(false);
      const [error,  setError]  = React.useState(null);

      const save = async () => {
        setSaving(true); setError(null);
        try {
          const r = await fetch(`/api/admin/users/${encodeURIComponent(user.sub)}`, {
            method: "PATCH",
            headers: { "Content-Type": "application/json", ...csrfHeaders() },
            body: JSON.stringify({ initials, display_name: displayName, email }),
          });
          const data = await r.json().catch(() => ({}));
          if (!r.ok) { setError(data.error || `HTTP ${r.status}`); return; }
          onSaved();
        } catch (err) { setError(err.message); }
        finally { setSaving(false); }
      };

      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 9999, background: "rgba(0,0,0,0.85)",
          display: "flex", alignItems: "center", justifyContent: "center", padding: 16,
        }} onClick={onClose}>
          <div onClick={e => e.stopPropagation()} style={{
            background: "#0f172a", border: "1px solid #334155", borderRadius: 12,
            maxWidth: 480, width: "100%", color: "#cbd5e1",
          }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "16px 20px", borderBottom: "1px solid #334155" }}>

    function AdminInvites() {
      const [invites, setInvites] = React.useState(null);
      const [note, setNote] = React.useState("");
      const [maxUses, setMaxUses] = React.useState(1);
      const [expiresAt, setExpiresAt] = React.useState("");
      const [msg, setMsg] = React.useState(null);
      const [copiedCode, setCopiedCode] = React.useState(null);

      const copyShareUrl = (code) => {
        navigator.clipboard.writeText(`${window.location.origin}/api/auth/apple?invite=${code}`);
        setCopiedCode(code);
        setTimeout(() => setCopiedCode(c => c === code ? null : c), 1500);
      };

      const load = React.useCallback(async () => {
        const r = await fetch("/api/admin/invites", { cache: "no-store" });
        setInvites(r.ok ? await r.json() : []);
      }, []);
      React.useEffect(() => { load(); }, [load]);

      const create = async () => {
        setMsg(null);
        const body = { note: note || null, maxUses: Number(maxUses) || 1, expiresAt: expiresAt || null };
        const r = await fetch("/api/admin/invites", {
          method: "POST",
          headers: { "Content-Type": "application/json", ...csrfHeaders() },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { setMsg(`Error: ${data.error || r.status}`); return; }
        setMsg(`Created: ${data.code}`);
        setNote(""); setMaxUses(1); setExpiresAt("");
        await load();
      };

      const remove = async (code) => {
        if (!confirm(`Delete invite ${code}?`)) return;
        setMsg(null);
        const r = await fetch(`/api/admin/invites/${encodeURIComponent(code)}`, { method: "DELETE", headers: { ...csrfHeaders() } });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) { setMsg(`Error: ${data.error || r.status}`); return; }
        await load();
      };

      if (invites === null) return <div style={{ color: "#64748b" }}>Loading…</div>;
      return (
        <div>
          <div style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 8, padding: 12, marginBottom: 16 }}>
            <div style={{ fontSize: 11, fontWeight: 600, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.1em", marginBottom: 8 }}>Create invite</div>
            <div style={{ display: "grid", gridTemplateColumns: "2fr 1fr 1.5fr auto", gap: 8, alignItems: "center" }}>
              <input value={note} onChange={e => setNote(e.target.value)} placeholder="Note (e.g., for Sarah)"
                style={{ background: "#0f172a", border: "1px solid #334155", borderRadius: 4, color: "#e2e8f0", padding: "6px 8px", fontSize: 12 }} />
              <input type="number" value={maxUses} onChange={e => setMaxUses(e.target.value)} min={1} max={100} placeholder="Max uses"
                style={{ background: "#0f172a", border: "1px solid #334155", borderRadius: 4, color: "#e2e8f0", padding: "6px 8px", fontSize: 12 }} />
              <input type="date" value={expiresAt} onChange={e => setExpiresAt(e.target.value)}
                style={{ background: "#0f172a", border: "1px solid #334155", borderRadius: 4, color: "#e2e8f0", padding: "6px 8px", fontSize: 12 }} />
              <button onClick={create} style={{ background: "#a78bfa", color: "#0f172a", border: "none", borderRadius: 4, padding: "6px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Create</button>
            </div>
          </div>
          {msg && <div style={{ fontSize: 12, color: "#10b981", marginBottom: 10 }}>{msg}</div>}
          <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12, color: "#cbd5e1" }}>
            <thead>
              <tr style={{ borderBottom: "1px solid #334155", color: "#64748b", textAlign: "left" }}>
                <th style={{ padding: "8px 6px" }}>Code</th>
                <th style={{ padding: "8px 6px" }}>Note</th>
                <th style={{ padding: "8px 6px" }}>Uses</th>
                <th style={{ padding: "8px 6px" }}>Status</th>
                <th style={{ padding: "8px 6px" }}>Expires</th>
                <th style={{ padding: "8px 6px" }}>Actions</th>
              </tr>
            </thead>
            <tbody>
              {invites.map(i => (
                <tr key={i.code} style={{ borderBottom: "1px solid #1e293b" }}>
                  <td style={{ padding: "8px 6px", fontFamily: "monospace" }}>{i.code}</td>
                  <td style={{ padding: "8px 6px" }}>{i.note || "—"}</td>
                  <td style={{ padding: "8px 6px" }}>{i.times_used}/{i.max_uses}</td>
                  <td style={{ padding: "8px 6px" }}>
                    <span style={{
                      background: i.status === "active" ? "#10b98122" : "#7f1d1d22",
                      color:      i.status === "active" ? "#10b981"   : "#fca5a5",
                      padding: "1px 6px", borderRadius: 4, fontSize: 10, fontWeight: 700,
                    }}>{i.status}</span>
                  </td>
                  <td style={{ padding: "8px 6px", color: "#94a3b8" }}>{i.expires_at ? new Date(i.expires_at).toLocaleDateString() : "—"}</td>
                  <td style={{ padding: "8px 6px" }}>
                    <button onClick={() => copyShareUrl(i.code)} style={{ marginRight: 4, fontSize: 11, padding: "3px 8px", background: copiedCode === i.code ? "#10b981" : "#334155", border: "none", borderRadius: 4, color: copiedCode === i.code ? "#0f172a" : "#cbd5e1", cursor: "pointer", fontWeight: copiedCode === i.code ? 700 : 400, transition: "background 0.15s, color 0.15s" }}>
                      {copiedCode === i.code ? "✓ Copied!" : "Copy link"}
                    </button>
                    <button onClick={() => remove(i.code)} style={{ fontSize: 11, padding: "3px 8px", background: "#7f1d1d", border: "none", borderRadius: 4, color: "#fee2e2", cursor: "pointer" }}>
                      Delete
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      );
    }
