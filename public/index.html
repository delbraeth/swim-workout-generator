<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Swim Workout Generator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { background: #0f172a; margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }

    /* Slider styling */
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    /* Default visibility for the print/screen helper classes */
    .print-only { display: none; }

    /* Equipment picker — responsive grid (auto-fits 4 cols on desktop, 2 on mobile) */
    .equipment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

    /* ────────────────────────────────────────────────────────────
       PRINT STYLES — clean, high-contrast, 8.5×11 B&W
       Hides all interactive UI, strips backgrounds and colors,
       and uses serif typography for readable swim-deck output.
       ──────────────────────────────────────────────────────────── */
    @media print {
      @page { size: letter portrait; margin: 0.55in 0.5in; }

      html, body {
        background: #fff !important;
        color: #000 !important;
        font-family: Georgia, "Times New Roman", serif !important;
        font-size: 11pt !important;
        line-height: 1.35 !important;
      }

      /* Strip every background, shadow, and color so output is pure B&W */
      *, *::before, *::after {
        background: #fff !important;
        background-color: #fff !important;
        background-image: none !important;
        color: #000 !important;
        box-shadow: none !important;
        text-shadow: none !important;
        border-color: #000 !important;
      }

      .screen-only { display: none !important; }
      .print-only  { display: block !important; }

      /* Print header — workout title, type, date, totals */
      .print-header {
        border-bottom: 2.5pt solid #000 !important;
        padding-bottom: 8pt !important;
        margin-bottom: 14pt !important;
      }
      .print-title {
        font-size: 22pt !important;
        font-weight: 700 !important;
        margin: 0 !important;
        letter-spacing: -0.01em !important;
      }
      .print-subtitle {
        font-size: 11pt !important;
        margin: 4pt 0 0 0 !important;
        font-style: italic !important;
      }
      .print-meta {
        margin-top: 6pt !important;
        font-size: 11pt !important;
      }
      .print-meta span { margin-right: 18pt !important; }
      .print-meta b { font-weight: 700 !important; }

      /* Workout block — keep section together on one page when possible */
      .workout-block {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        border: 1.5pt solid #000 !important;
        border-radius: 0 !important;
        margin-bottom: 10pt !important;
      }
      .workout-block-header {
        border-bottom: 1pt solid #000 !important;
        padding: 5pt 9pt !important;
        font-size: 11.5pt !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
      }
      .workout-block-header > div > span:first-child { display: none !important; } /* hide colored dot */

      /* Tables */
      .workout-block table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      .workout-block thead tr { border-bottom: 1pt solid #000 !important; }
      .workout-block th {
        padding: 4pt 7pt !important;
        font-size: 8.5pt !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.04em !important;
        text-align: left !important;
        font-family: Georgia, serif !important;
      }
      .workout-block td {
        padding: 5pt 7pt !important;
        font-size: 10pt !important;
        font-style: normal !important;
        border-top: 0.5pt solid #555 !important;
        font-family: Georgia, serif !important;
        vertical-align: top !important;
      }
      .workout-block td:nth-child(1) { font-weight: 700 !important; white-space: nowrap !important; width: 11% !important; }
      .workout-block td:nth-child(2) { font-weight: 700 !important; white-space: nowrap !important; width: 12% !important; }
      .workout-block td:nth-child(3) { width: 42% !important; }
      .workout-block td:nth-child(4) { font-family: "Courier New", monospace !important; white-space: nowrap !important; width: 12% !important; }
      .workout-block td:nth-child(5) { font-style: italic !important; width: 23% !important; }

      /* Equipment badges hidden — equipment is in description text */
      .equipment-badges { display: none !important; }
    }
  </style>
</head>

    // Normalize raw initials input: trim, uppercase, alphanumeric only, max 4 chars.
    function normalizeInitials(raw) {
      return (raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 4);
    }

    function loadLocalHistory() {
      try { const raw = localStorage.getItem(HISTORY_LOCAL_KEY); return raw ? JSON.parse(raw) : []; }
      catch (_) { return []; }
    }
    function saveLocalHistory(entries) {
      try { localStorage.setItem(HISTORY_LOCAL_KEY, JSON.stringify(entries)); } catch (_) {}
    }
    // Merge two entry lists by id (b wins on conflict), then sort newest-first by dateCompleted.
    function mergeById(a, b) {
      const map = new Map();
      for (const e of a) if (e && e.id) map.set(e.id, e);
      for (const e of b) if (e && e.id) map.set(e.id, e);
      return [...map.values()].sort((x, y) => (y.dateCompleted || "").localeCompare(x.dateCompleted || ""));
    }
    function makeEntryId() {
      return "w" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // ═══════════════════════════════════════════════════════════════
    //  BUDGET-AWARE GENERATOR
    //  Filters options so the workout stays within [1900, maxYards]
    // ═══════════════════════════════════════════════════════════════

    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
    const MIN_YARDS = 1900;

    // Minimum yards each section can contribute
    const MIN_WARMUP   = Math.min(...WARMUP_OPTIONS.map(o => o.totalYards));   // 400
    const MIN_DRILL    = 300;  // smallest drill option across types
    const MIN_MAIN     = 1000; // smallest main set
    const MIN_COOLDOWN = 200;  // smallest cooldown

    // Each checked equipment item must be satisfied by ≥ 1 set in the drill+main blocks.
    // satisfiedBy lists the eq tags whose presence counts for that equipment.
    const EQUIP_REQUIREMENTS = {
      kickboard: ["kick", "kickPart"],
      fins:      ["kick", "kickPart", "underkick"],
      paddles:   ["pull"],
      pullBuoy:  ["pull"],
    };

    function eqTagsIn(option) {
      return new Set(option.sets.filter(s => s.eq).map(s => s.eq));
    }

    function combinationSatisfies(dr, ma, equipment) {
      if (!equipment) return true;
      const tags = new Set([...eqTagsIn(dr), ...eqTagsIn(ma)]);
      for (const k of Object.keys(EQUIP_REQUIREMENTS)) {
        if (equipment[k] && !EQUIP_REQUIREMENTS[k].some(t => tags.has(t))) return false;
      }
      return true;
    }

    function generateWorkout(typeId, maxYards, equipment) {
      const drillList = DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed;
      const mainList  = MAIN_OPTIONS[typeId]  || MAIN_OPTIONS.mixed;
      const hasEquipReq = equipment && Object.values(EQUIP_REQUIREMENTS).length > 0
                         && Object.keys(EQUIP_REQUIREMENTS).some(k => equipment[k]);

      // Up to 60 attempts to find a valid combination (more attempts when equipment
      // requirements are added since fewer combinations satisfy)
      const attempts = hasEquipReq ? 60 : 30;
      for (let attempt = 0; attempt < attempts; attempt++) {
        // 1. Pick warmup — must leave room for min drill + min main + min cooldown
        const validWarmups = WARMUP_OPTIONS.filter(o =>
          o.totalYards <= maxYards - MIN_DRILL - MIN_MAIN - MIN_COOLDOWN
        );
        if (!validWarmups.length) break;
        const wu = pick(validWarmups);

        // 2. Pick drill — must leave room for min main + min cooldown
        const validDrills = drillList.filter(o =>
          o.totalYards <= maxYards - wu.totalYards - MIN_MAIN - MIN_COOLDOWN
        );
        if (!validDrills.length) continue;
        const dr = pick(validDrills);

        // 3. Pick main — must leave room for min cooldown
        const validMain = mainList.filter(o =>
          o.totalYards <= maxYards - wu.totalYards - dr.totalYards - MIN_COOLDOWN
        );
        if (!validMain.length) continue;
        const ma = pick(validMain);

        // 4. Equipment satisfaction check — every checked item needs a matching set
        if (hasEquipReq && !combinationSatisfies(dr, ma, equipment)) continue;

        // 5. Pick cooldown — must fit within remaining budget
        const remaining = maxYards - wu.totalYards - dr.totalYards - ma.totalYards;
        const validCooldowns = COOLDOWN_OPTIONS.filter(o => o.totalYards <= remaining);
        if (!validCooldowns.length) continue;
        const cd = pick(validCooldowns);

        const total = wu.totalYards + dr.totalYards + ma.totalYards + cd.totalYards;
        if (total >= MIN_YARDS && total <= maxYards) {
          return buildWorkout(typeId, wu, dr, ma, cd, total);
        }
      }

      // Fallback: use smallest valid combination, preferring equipment-satisfying drills
      const wu = WARMUP_OPTIONS[0]; // 400
      let drillCandidates = drillList.filter(o => o.totalYards <= maxYards - wu.totalYards - MIN_MAIN - MIN_COOLDOWN);
      if (!drillCandidates.length) drillCandidates = drillList;
      if (hasEquipReq) {
        // Prefer the first drill option that, when paired with any main, would satisfy
        const eqPreferred = drillCandidates.filter(d =>
          mainList.some(m =>
            m.totalYards <= maxYards - wu.totalYards - d.totalYards - MIN_COOLDOWN &&
            combinationSatisfies(d, m, equipment)
          )
        );
        if (eqPreferred.length) drillCandidates = eqPreferred;
      }
      const dr = drillCandidates[0];
      let mainCandidates = mainList.filter(o => o.totalYards <= maxYards - wu.totalYards - dr.totalYards - MIN_COOLDOWN);
      if (!mainCandidates.length) mainCandidates = mainList;
      if (hasEquipReq) {
        const eqMain = mainCandidates.filter(m => combinationSatisfies(dr, m, equipment));
        if (eqMain.length) mainCandidates = eqMain;
      }
      const ma = mainCandidates[0];
      const cd = COOLDOWN_OPTIONS[0];
      const total = wu.totalYards + dr.totalYards + ma.totalYards + cd.totalYards;
      return buildWorkout(typeId, wu, dr, ma, cd, total);
    }

    function buildWorkout(typeId, wu, dr, ma, cd, total) {
      const blocks = [
        { name: "Warm-Up",              section: "warmup",   ...wu },
        { name: "Drill / Pre-Main Set", section: "drill",    ...dr },
        { name: `Main Set — ${ma.label}`,section: "main",    ...ma },
        { name: "Cool-Down",            section: "cooldown", ...cd },
      ];
      const estimatedMin = calcEstimatedMin(blocks);
      return { blocks, totalYards: total, estimatedMin, typeId };
    }

    // ─── Per-section regeneration ────────────────────────────────────
    // Replace ONE section of an existing workout. The other three sections
    // are held fixed, so the new pick must (a) keep total yardage in
    // [MIN_YARDS, maxYards] and (b) preserve the equipment-coverage invariant
    // across drill+main if any equipment is checked.
    const SECTION_KEYS = ["warmup", "drill", "main", "cooldown"];

    // Stable signature so we can exclude the current pick when alternatives exist.
    // Built from the full sets array so it matches across (a) fresh blocks
    // (which spread the option, including `label`), (b) raw pool options, and
    // (c) history-loaded blocks (which have `label` stripped by handleSave).
    function sectionFingerprint(b) {
      if (!b || !Array.isArray(b.sets)) return "";
      const sig = b.sets.map(s => `${s.reps}x${s.dist}|${s.desc}`).join("/");
      return `${b.totalYards}|${sig}`;
    }

    // Returns { workout, error }. On success, workout is a fresh object with the
    // requested section replaced. On failure, error is a human-readable reason
    // and the caller should keep the prior workout unchanged.
    function regenerateSection(workout, typeId, sectionKey, maxYards, equipment) {
      if (!workout || !Array.isArray(workout.blocks) || workout.blocks.length !== 4) {
        return { workout: null, error: "No workout to update." };
      }
      const idx = SECTION_KEYS.indexOf(sectionKey);
      if (idx < 0) return { workout: null, error: "Unknown section." };

      const blocks = workout.blocks;
      const current = blocks[idx];
      const others = blocks.reduce((sum, b, i) => i === idx ? sum : sum + b.totalYards, 0);
      const lower = Math.max(0, MIN_YARDS - others);
      const upper = maxYards - others;

      let pool;
      if (sectionKey === "warmup")        pool = WARMUP_OPTIONS;
      else if (sectionKey === "cooldown") pool = COOLDOWN_OPTIONS;
      else if (sectionKey === "drill")    pool = DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed;
      else                                pool = MAIN_OPTIONS[typeId]  || MAIN_OPTIONS.mixed;

      const hasEquipReq = equipment && Object.keys(EQUIP_REQUIREMENTS).some(k => equipment[k]);
      const partnerDrill = blocks[1]; // used when regenerating main
      const partnerMain  = blocks[2]; // used when regenerating drill

      const passesEquip = (candidate) => {
        if (!hasEquipReq) return true;
        if (sectionKey === "drill") return combinationSatisfies(candidate, partnerMain, equipment);
        if (sectionKey === "main")  return combinationSatisfies(partnerDrill, candidate, equipment);
        return true; // warmup/cooldown carry no equipment tags
      };

      const fitsBudget = (o) => o.totalYards >= lower && o.totalYards <= upper;
      const validAll = pool.filter(o => fitsBudget(o) && passesEquip(o));
      if (!validAll.length) {
        return { workout: null, error: hasEquipReq
          ? "No option for this section fits the remaining yardage and your equipment selection."
          : "No option for this section fits the remaining yardage budget." };
      }

      const curFp = sectionFingerprint(current);
      const novel = validAll.filter(o => sectionFingerprint(o) !== curFp);
      if (!novel.length) {
        return { workout: null, error: "Only one option fits these constraints — adjust max yards or equipment for more variety." };
      }
      const picked = pick(novel);

      const NAME_BY_SECTION = {
        warmup:   "Warm-Up",
        drill:    "Drill / Pre-Main Set",
        cooldown: "Cool-Down",
      };
      const newBlock = sectionKey === "main"
        ? { name: `Main Set — ${picked.label}`, section: "main", ...picked }
        : { name: NAME_BY_SECTION[sectionKey], section: sectionKey, ...picked };

      const newBlocks = blocks.map((b, i) => i === idx ? newBlock : b);
      const total = newBlocks.reduce((s, b) => s + b.totalYards, 0);

      return { workout: { blocks: newBlocks, totalYards: total, estimatedMin: calcEstimatedMin(newBlocks), typeId }, error: null };
    }

    // ═══════════════════════════════════════════════════════════════
    //  EQUIPMENT — checkbox state shapes set descriptions at render time
    //  (yardage, intervals, and focus are unchanged — equipment is a
    //   "what gear you use" detail, not a different exercise)
    // ═══════════════════════════════════════════════════════════════

    const EQUIPMENT_LIST = [
      { id: "kickboard", label: "Kickboard", icon: "🟦", description: "Use a board for kick sets" },
      { id: "fins",      label: "Fins",      icon: "🐬", description: "Add fins to kick & underwater sets" },
      { id: "paddles",   label: "Paddles",   icon: "🤚", description: "Add paddles to pull sets" },
      { id: "pullBuoy",  label: "Pull Buoy", icon: "🛟", description: "Confirms buoy use on pull sets" },
    ];

    // Returns the equipment items (in display order) that apply to a given set
    // based on the set's `eq` tag and the user's current checkbox state.
    function equipmentForSet(set, equip) {
      if (!set.eq) return [];
      const items = [];
      if (set.eq === "kick" || set.eq === "kickPart") {
        if (equip.kickboard) items.push("kickboard");
        if (equip.fins)      items.push("fins");
      } else if (set.eq === "underkick") {
        // Underwater kick is from streamline — kickboard doesn't apply, fins do
        if (equip.fins)      items.push("fins");
      } else if (set.eq === "pull") {
        if (equip.paddles)   items.push("paddles");
        if (equip.pullBuoy)  items.push("buoy");
      }
      return items;
    }

    // Rewrite a set's description based on which compatible equipment is checked.
    // Yardage and intervals never change — only the prose updates to be explicit
    // about which gear to grab.
    function enhanceDesc(set, equip) {
      const items = equipmentForSet(set, equip);
      if (items.length === 0) return set.desc;
      const eqText = items.join(" + ");
      if (set.eq === "kick") {
        return set.desc
          .replace(/\s*\(board optional\)/i, "")
          .replace(/^IM order kick\b/, `IM order kick with ${eqText}`)
          .replace(/^Kick\b/, `Kick with ${eqText}`);
      }
      if (set.eq === "underkick") {
        return set.desc.replace(/^Underwater kick\b/, `Underwater kick with ${eqText}`);
      }
      if (set.eq === "kickPart") {
        // Multi-part set ("Kick 25 / Drill 25 / Swim 25") — annotate kick portions
        return `${set.desc}  ·  kick portions with ${eqText}`;
      }
      if (set.eq === "pull") {
        return set.desc.replace(/Pull\s*\(buoy\)/i, `Pull with ${eqText}`);
      }
      return set.desc;
    }

    // ═══════════════════════════════════════════════════════════════
    //  SET SWAP HELPERS
    // ═══════════════════════════════════════════════════════════════

    function parseIntervalSecs(str) {
      if (!str) return null;
      const m = str.match(/^On\s+(\d*):(\d{1,2})/i);
      if (!m) return null;
      const mins = m[1] === "" ? 0 : parseInt(m[1], 10);
      const secs = parseInt(m[2], 10);
      if (isNaN(mins) || isNaN(secs)) return null;
      return mins * 60 + secs;
    }

    function formatIntervalSecs(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `On ${m}:${String(s).padStart(2, "0")}`;
    }

    function scaleInterval(intervalStr, ratio) {
      const secs = parseIntervalSecs(intervalStr);
      if (secs === null) return intervalStr;
      const scaled = Math.max(30, Math.round((secs * ratio) / 5) * 5);
      return formatIntervalSecs(scaled);
    }

    // Sum reps×interval across all sets; fall back to 35 yd/min for sets with no interval.
    function calcEstimatedMin(blocks) {
      const FALLBACK_YD_PER_MIN = 35;
      let totalSecs = 0;
      for (const block of blocks) {
        for (const set of block.sets) {
          const secs = parseIntervalSecs(set.interval);
          if (secs !== null) {
            totalSecs += set.reps * secs;
          } else {
            totalSecs += (set.reps * set.dist / FALLBACK_YD_PER_MIN) * 60;
          }
        }
      }
      return Math.round(totalSecs / 60);
    }

    function getEquivalents(set) {
      const result = { shorter: null, longer: null };
      if (set.dist >= 50) {
        const newDist = set.dist / 2;
        result.shorter = { ...set, dist: newDist, reps: set.reps * 2, interval: scaleInterval(set.interval, newDist / set.dist) };
      }
      if (set.reps >= 2 && set.reps % 2 === 0 && set.dist * 2 <= 400) {
        const newDist = set.dist * 2;
        result.longer = { ...set, dist: newDist, reps: set.reps / 2, interval: scaleInterval(set.interval, newDist / set.dist) };
      }
      return result;
    }

    // ═══════════════════════════════════════════════════════════════
    //  COMPONENTS
    // ═══════════════════════════════════════════════════════════════

    function EquipmentBadge({ name }) {
      const colors = {
        kickboard: { bg: "#dbeafe", fg: "#1e40af" },
        fins:      { bg: "#cffafe", fg: "#155e75" },
        paddles:   { bg: "#fef3c7", fg: "#92400e" },
        buoy:      { bg: "#fce7f3", fg: "#9d174d" },
      };
      const c = colors[name] || { bg: "#e2e8f0", fg: "#334155" };
      return (
        <span style={{ background: c.bg, color: c.fg, fontSize: 10, fontWeight: 700,
                       padding: "2px 7px", borderRadius: 999, marginRight: 4,
                       textTransform: "uppercase", letterSpacing: "0.04em" }}>
          {name}
        </span>
      );
    }

    function SetRow({ set, idx, blockIdx, setIdx, isSwapOpen, onToggleSwap, onApplySwap, equipment, isEditingInterval, editIntervalDraft, setEditIntervalDraft, onStartEditInterval, onCommitInterval, onCancelInterval }) {
      const eqItems = equipmentForSet(set, equipment);
      const desc = enhanceDesc(set, equipment);
      const equiv = onToggleSwap ? getEquivalents(set) : {};
      const hasSwap = !!(equiv.shorter || equiv.longer);
      return (
        <React.Fragment>
          <tr style={{ background: idx % 2 === 0 ? "#ffffff" : "#f8fafc" }}>
            <td style={{ padding: "10px 16px", fontSize: 13, fontWeight: 600, color: "#334155", whiteSpace: "nowrap" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                {set.reps > 1 ? `${set.reps} × ${set.dist}` : `${set.dist}`}
                {hasSwap && (
                  <button onClick={() => onToggleSwap(blockIdx, setIdx)}
                    style={{ fontSize: 11, padding: "2px 6px", borderRadius: 4, border: `1px solid ${isSwapOpen ? "#94a3b8" : "#cbd5e1"}`, background: isSwapOpen ? "#e2e8f0" : "transparent", cursor: "pointer", color: "#64748b", lineHeight: 1 }}>
                    ⇄
                  </button>
                )}
              </div>
            </td>
            <td style={{ padding: "10px 16px", fontSize: 13, fontWeight: 700, color: "#1e293b", whiteSpace: "nowrap" }}>
              {(set.reps * set.dist).toLocaleString()} yds
            </td>
            <td style={{ padding: "10px 16px", fontSize: 13, color: "#334155" }}>
              {desc}
              {eqItems.length > 0 && (
                <div className="equipment-badges" style={{ marginTop: 6 }}>
                  {eqItems.map(e => <EquipmentBadge key={e} name={e} />)}
                </div>
              )}
            </td>
            <td style={{ padding: "10px 16px", fontSize: 12, color: "#64748b", fontFamily: "monospace" }}>
              {isEditingInterval ? (() => {
                const hasOn = /^On\s+/i.test(editIntervalDraft);
                const timePart = hasOn ? editIntervalDraft.replace(/^On\s+/i, "") : editIntervalDraft;
                return (
                  <span style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
                    {hasOn && <span style={{ color: "#94a3b8" }}>On</span>}
                    <input
                      autoFocus
                      value={timePart}
                      onChange={e => setEditIntervalDraft(hasOn ? "On " + e.target.value : e.target.value)}
                      onKeyDown={e => {
                        if (e.key === "Enter")  onCommitInterval(blockIdx, setIdx, editIntervalDraft);
                        if (e.key === "Escape") onCancelInterval();
                      }}
                      onBlur={() => onCommitInterval(blockIdx, setIdx, editIntervalDraft)}
                      style={{ width: 52, fontFamily: "monospace", fontSize: 12, padding: "2px 5px", borderRadius: 4, border: "1px solid #94a3b8", background: "#fff", color: "#1e293b" }}
                    />
                  </span>
                );
              })() : (
                <span
                  onClick={() => onStartEditInterval && onStartEditInterval(blockIdx, setIdx, set.interval)}
                  title={onStartEditInterval ? "Click to edit" : undefined}
                  style={{ cursor: onStartEditInterval ? "text" : "default", borderBottom: onStartEditInterval ? "1px dashed #94a3b8" : "none", paddingBottom: onStartEditInterval ? 1 : 0 }}>
                  {set.interval}
                </span>
              )}
            </td>
            <td style={{ padding: "10px 16px", fontSize: 12, color: "#64748b", fontStyle: "italic" }}>{set.focus}</td>
          </tr>
          {isSwapOpen && (
            <tr>
              <td colSpan={5} style={{ padding: "0 16px 12px 16px", background: "#f0f9ff", borderBottom: "2px solid #bae6fd" }}>
                <div style={{ display: "flex", gap: 8, alignItems: "center", flexWrap: "wrap", paddingTop: 8 }}>
                  <span style={{ fontSize: 11, fontWeight: 600, color: "#475569", textTransform: "uppercase", letterSpacing: "0.05em" }}>Swap to:</span>
                  {equiv.shorter && (
                    <button onClick={() => onApplySwap(blockIdx, setIdx, equiv.shorter)}
                      style={{ fontSize: 12, padding: "5px 12px", borderRadius: 6, border: "1px solid #7dd3fc", background: "#e0f2fe", color: "#0369a1", cursor: "pointer", fontWeight: 600 }}>
                      ↙ Shorter — {equiv.shorter.reps} × {equiv.shorter.dist} yds &nbsp;<span style={{ fontWeight: 400, color: "#0284c7" }}>{equiv.shorter.interval}</span>
                    </button>
                  )}
                  {equiv.longer && (
                    <button onClick={() => onApplySwap(blockIdx, setIdx, equiv.longer)}
                      style={{ fontSize: 12, padding: "5px 12px", borderRadius: 6, border: "1px solid #86efac", background: "#f0fdf4", color: "#15803d", cursor: "pointer", fontWeight: 600 }}>
                      ↗ Longer — {equiv.longer.reps} × {equiv.longer.dist} yds &nbsp;<span style={{ fontWeight: 400, color: "#16a34a" }}>{equiv.longer.interval}</span>
                    </button>
                  )}
                  <button onClick={() => onToggleSwap(blockIdx, setIdx)}
                    style={{ fontSize: 11, padding: "4px 10px", borderRadius: 6, border: "1px solid #cbd5e1", background: "#f1f5f9", color: "#64748b", cursor: "pointer", marginLeft: 4 }}>
                    Cancel
                  </button>
                </div>
              </td>
            </tr>
          )}
        </React.Fragment>
      );
    }

    function EquipmentPicker({ equipment, onChange }) {
      return (
        <div style={{ marginBottom: 20 }}>
          <p style={{ color: "#93c5fd", fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.15em", marginBottom: 8, marginTop: 0 }}>
            Equipment Available
            <span style={{ color: "#64748b", textTransform: "none", letterSpacing: 0, fontWeight: 400, marginLeft: 8 }}>
              (check what you'll use — kick & pull sets adjust accordingly)
            </span>
          </p>
          <div className="equipment-grid">
            {EQUIPMENT_LIST.map(eq => {
              const isOn = !!equipment[eq.id];
              return (
                <label key={eq.id}
                  style={{
                    display: "flex", alignItems: "center", gap: 10,
                    padding: "12px 14px", borderRadius: 10,
                    border: `2px solid ${isOn ? "#3b82f6" : "#334155"}`,
                    background: isOn ? "#1e3a5f" : "#1e293b",
                    cursor: "pointer", userSelect: "none",
                    transition: "all 0.15s",
                  }}>
                  <input type="checkbox"
                    checked={isOn}
                    onChange={e => onChange(eq.id, e.target.checked)}
                    style={{
                      width: 18, height: 18, cursor: "pointer", margin: 0,
                      accentColor: "#3b82f6",
                    }} />
                  <span style={{ fontSize: 18 }}>{eq.icon}</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ fontSize: 13, fontWeight: 700, color: isOn ? "#fff" : "#e2e8f0", whiteSpace: "nowrap" }}>
                      {eq.label}
                    </div>
                    <div style={{ fontSize: 10, color: isOn ? "#bfdbfe" : "#64748b", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                      {eq.description}
                    </div>
                  </div>
                </label>
              );
            })}
          </div>
        </div>
      );
    }

    function WorkoutBlock({ block, equipment, onRegenerate, regenError, blockIdx, openSwapKey, onToggleSwap, onApplySwap, editIntervalKey, editIntervalDraft, setEditIntervalDraft, onStartEditInterval, onCommitInterval, onCancelInterval }) {
      const s = SECTION_STYLES[block.section];
      // Light header text (e.g. main set on dark slate) → use white-tinted button.
      // Dark header text → use dark-tinted button.
      const isDarkHeader = s.headerText === "#ffffff";
      const btnBg     = isDarkHeader ? "rgba(255,255,255,0.12)" : "rgba(15,23,42,0.06)";
      const btnHoverBg = isDarkHeader ? "rgba(255,255,255,0.20)" : "rgba(15,23,42,0.12)";
      const btnBorder = isDarkHeader ? "rgba(255,255,255,0.25)" : "rgba(15,23,42,0.15)";
      const [hovered, setHovered] = useState(false);
      return (
        <div className="workout-block" style={{ borderRadius: 12, border: `1px solid ${s.border}`, overflow: "hidden", marginBottom: 16 }}>
          <div className="workout-block-header" style={{ background: s.headerBg, color: s.headerText, padding: "12px 20px", display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ width: 10, height: 10, borderRadius: "50%", background: s.dot, display: "inline-block" }} />
              <span style={{ fontWeight: 700, fontSize: 12, textTransform: "uppercase", letterSpacing: "0.1em" }}>{block.name}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <span style={{ fontWeight: 600, fontSize: 13 }}>{block.totalYards.toLocaleString()} yds</span>
              {onRegenerate && (
                <button
                  type="button"
                  className="screen-only"
                  onClick={() => onRegenerate(block.section)}
                  onMouseEnter={() => setHovered(true)}
                  onMouseLeave={() => setHovered(false)}
                  title={`Regenerate ${block.name} only`}
                  aria-label={`Regenerate ${block.name}`}
                  style={{
                    display: "inline-flex", alignItems: "center", gap: 4,
                    padding: "4px 9px", borderRadius: 6,
                    background: hovered ? btnHoverBg : btnBg,
                    color: s.headerText, border: `1px solid ${btnBorder}`,
                    fontSize: 12, fontWeight: 600, cursor: "pointer",
                    lineHeight: 1, transition: "background 0.15s",
                  }}>
                  <span style={{ fontSize: 13 }}>🔄</span>
                  <span>Regenerate</span>
                </button>
              )}
            </div>
          </div>
          {regenError && (
            <div className="screen-only" role="alert" style={{
              background: "#fef2f2", borderBottom: `1px solid ${s.border}`,
              color: "#991b1b", fontSize: 12, padding: "8px 20px",
              display: "flex", alignItems: "center", gap: 8,
            }}>
              <span>⚠️</span>
              <span>{regenError}</span>
            </div>
          )}
          <div style={{ background: s.bg, overflowX: "auto" }}>
            <table style={{ width: "100%", borderCollapse: "collapse" }}>
              <thead>
                <tr style={{ borderBottom: "1px solid #e2e8f0" }}>
                  {["Reps × Dist", "Total", "Description", "Interval", "Focus"].map(h => (
                    <th key={h} style={{ padding: "8px 16px", textAlign: "left", fontSize: 11, fontWeight: 600, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.05em" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {block.sets.map((set, i) => (
                  <SetRow key={i} set={set} idx={i} equipment={equipment}
                    blockIdx={blockIdx} setIdx={i}
                    isSwapOpen={openSwapKey === `${blockIdx}-${i}`}
                    onToggleSwap={onToggleSwap} onApplySwap={onApplySwap}
                    isEditingInterval={editIntervalKey === `${blockIdx}-${i}`}
                    editIntervalDraft={editIntervalDraft}
                    setEditIntervalDraft={setEditIntervalDraft}
                    onStartEditInterval={onStartEditInterval}
                    onCommitInterval={onCommitInterval}
                    onCancelInterval={onCancelInterval}
                  />
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // ─── Max Yardage Slider ──────────────────────────────────────────
    // Compute the minimum possible total yards for a given type
    function minYardsForType(typeId) {
      const drillList = DRILL_OPTIONS[typeId] || DRILL_OPTIONS.mixed;
      const mainList  = MAIN_OPTIONS[typeId]  || MAIN_OPTIONS.mixed;
      const minWarmup   = Math.min(...WARMUP_OPTIONS.map(o => o.totalYards));
      const minDrill    = Math.min(...drillList.map(o => o.totalYards));
      const minMain     = Math.min(...mainList.map(o => o.totalYards));
      const minCooldown = Math.min(...COOLDOWN_OPTIONS.map(o => o.totalYards));
      return minWarmup + minDrill + minMain + minCooldown;
    }

    function YardageSlider({ value, onChange, selectedType }) {
      const SLIDER_MIN = 1900;
      const SLIDER_MAX = 2500;
      const pct = ((value - SLIDER_MIN) / (SLIDER_MAX - SLIDER_MIN) * 100).toFixed(1);

      const typeMin = selectedType ? minYardsForType(selectedType) : null;
      const tooLow  = typeMin !== null && value < typeMin;

      return (
        <div style={{ background: "#1e293b", border: `1px solid ${tooLow ? "#7f1d1d" : "#334155"}`, borderRadius: 12, padding: "18px 20px", marginBottom: 20 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 12 }}>
            <div>
              <span style={{ color: "#94a3b8", fontSize: 11, fontWeight: 600, textTransform: "uppercase", letterSpacing: "0.1em" }}>Max Yardage</span>
              <span style={{ color: "#64748b", fontSize: 11, marginLeft: 8 }}>(min locked at 1,900 yds)</span>
            </div>
            <div style={{ display: "flex", alignItems: "baseline", gap: 4 }}>
              <span style={{ color: "#ffffff", fontSize: 26, fontWeight: 900 }}>{value.toLocaleString()}</span>
              <span style={{ color: "#94a3b8", fontSize: 12 }}>yds</span>
            </div>
          </div>

          {/* Visual track + invisible native input on top */}
          <div style={{ position: "relative", marginBottom: 4 }}>
            <div style={{ height: 6, borderRadius: 3, background: "#334155", position: "relative" }}>
              <div style={{ position: "absolute", left: 0, top: 0, height: "100%", width: `${pct}%`,
                            background: tooLow ? "linear-gradient(90deg,#ef4444,#f87171)" : "linear-gradient(90deg,#3b82f6,#60a5fa)",
                            borderRadius: 3 }} />
            </div>
            <input type="range" min={SLIDER_MIN} max={SLIDER_MAX} step={50} value={value}
              onChange={e => onChange(Number(e.target.value))}
              style={{ position: "absolute", top: -4, left: 0, width: "100%", opacity: 0, height: 14, cursor: "pointer", margin: 0 }} />
          </div>

          {/* Tick labels */}
          <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
            {[1900,2000,2100,2200,2300,2400,2500].map(v => (
              <span key={v} onClick={() => onChange(v)}
                style={{ fontSize: 10, cursor: "pointer",
                          color: v === value ? "#60a5fa" : v < (typeMin||0) ? "#7f1d1d" : "#475569",
                          fontWeight: v === value ? 700 : 400 }}>
                {v === 1900 ? "1.9k" : v === 2000 ? "2.0k" : v === 2100 ? "2.1k" : v === 2200 ? "2.2k" : v === 2300 ? "2.3k" : v === 2400 ? "2.4k" : "2.5k"}
              </span>
            ))}
          </div>

          {/* Status row */}
          {tooLow ? (
            <div style={{ background: "#450a0a", border: "1px solid #7f1d1d", borderRadius: 8, padding: "10px 14px", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 16 }}>⚠️</span>
              <div>
                <span style={{ color: "#fca5a5", fontSize: 12, fontWeight: 600 }}>
                  This workout type needs at least {typeMin.toLocaleString()} yds.
                </span>
                <span style={{ color: "#ef4444", fontSize: 12 }}> Raise the max or choose a different type.</span>
              </div>
            </div>
          ) : typeMin !== null ? (
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <span style={{ fontSize: 11, color: "#64748b" }}>Workout range:</span>
              <span style={{ fontSize: 11, color: "#34d399", background: "#064e3b", borderRadius: 6, padding: "2px 8px", fontWeight: 600 }}>
                {typeMin.toLocaleString()} – {value.toLocaleString()} yds ✓
              </span>
            </div>
          ) : (
            <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
              <span style={{ fontSize: 11, color: "#64748b" }}>Select a workout type to see its yardage range.</span>
            </div>
          )}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  SAVE-TO-HISTORY FORM — appears below a freshly generated workout
    // ═══════════════════════════════════════════════════════════════
    function SaveToHistoryForm({ dateDraft, setDateDraft, initialsDraft, setInitialsDraft, noteDraft, setNoteDraft, saveStatus, saveError, onSave }) {

      const isSaving = saveStatus === "saving";

        <div className="screen-only" style={{ marginTop: 20, background: "#1e293b", borderRadius: 12, padding: 18, border: "1px solid #334155" }}>

            <span style={{ fontSize: 14, fontWeight: 700, color: "#e2e8f0" }}>📒 Log this workout</span>

          </div>
          <div style={{ display: "grid", gridTemplateColumns: "150px 90px 1fr", gap: 12, alignItems: "start" }}>

                style={{ width: "100%", padding: "8px 10px", background: "#0f172a", color: "#e2e8f0", border: "1px solid #475569", borderRadius: 6, fontSize: 13, fontFamily: "inherit", textTransform: "uppercase", letterSpacing: "0.05em" }} />

    // ═══════════════════════════════════════════════════════════════
    //  HISTORY VIEW — list, filter, expand, edit notes, delete, re-print
    // ═══════════════════════════════════════════════════════════════
    function HistoryView({ history, historyLoaded, onUpdateNotes, onDelete, onLoadAndPrint, onRepeat, onRun }) {
      const [filterType,   setFilterType]   = useState("all");
      const [filterUser,   setFilterUser]   = useState("all"); // "all" | "__unattributed__" | initials string
      const [editingId,    setEditingId]    = useState(null);
      const [editingNotes, setEditingNotes] = useState("");
      const [expandedId,   setExpandedId]   = useState(null);

      // Distinct initials present in history (sorted), plus a flag for entries
      // missing initials so we can render an "Unattributed" chip when relevant.
      const userBuckets = useMemo(() => {
        const set = new Set();
        let hasUnattributed = false;
        for (const e of history) {
          const u = (e.userInitials || "").trim();
          if (u) set.add(u);
          else hasUnattributed = true;
        }
        return { users: [...set].sort(), hasUnattributed };
      }, [history]);

      // If the selected user filter no longer exists in history (last entry
      // for that user was deleted), reset to "all" so the list isn't empty.
      useEffect(() => {
        if (filterUser === "all") return;
        if (filterUser === "__unattributed__" && !userBuckets.hasUnattributed) setFilterUser("all");
        else if (filterUser !== "__unattributed__" && !userBuckets.users.includes(filterUser)) setFilterUser("all");
      }, [filterUser, userBuckets]);

      const filtered = useMemo(
        () => history.filter(e => {
          if (filterType !== "all" && e.type !== filterType) return false;
          const u = (e.userInitials || "").trim();
          if (filterUser === "all") return true;
          if (filterUser === "__unattributed__") return !u;
          return u === filterUser;
        }),
        [history, filterType, filterUser]
      );

      // Show the user-filter row only when it would offer a meaningful choice:
      // at least 2 distinct buckets among (users, unattributed).
      const userBucketCount = userBuckets.users.length + (userBuckets.hasUnattributed ? 1 : 0);
      const showUserFilter = userBucketCount > 1;

      const stats = useMemo(() => {
        const sessions = filtered.length;
        const yards    = filtered.reduce((s, e) => s + (e.totalYards || 0), 0);
        const avg      = sessions ? Math.round(yards / sessions) : 0;
        return { sessions, yards, avg };
      }, [filtered]);

      if (!historyLoaded) {
        return <div style={{ textAlign: "center", color: "#64748b", padding: 40 }}>Loading history…</div>;
      }
      if (history.length === 0) {
        return (
          <div style={{ textAlign: "center", color: "#64748b", padding: 50 }}>
            <div style={{ fontSize: 44, marginBottom: 12 }}>📜</div>
            <p style={{ fontSize: 16, color: "#94a3b8", margin: 0 }}>No workouts logged yet.</p>
            <p style={{ fontSize: 12, color: "#64748b", marginTop: 6 }}>Generate a workout, swim it, then click <b>Save to History</b> to log it here.</p>
          </div>
        );
      }

      return (
        <div className="screen-only">
          {/* Type filter chips */}
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: showUserFilter ? 8 : 14 }}>
            {[{ id: "all", label: "All", emoji: "📋" }, ...WORKOUT_TYPES].map(t => {
              const active = filterType === t.id;
              return (
                <button key={t.id} onClick={() => setFilterType(t.id)}
                  style={{
                    padding: "6px 12px", borderRadius: 999, border: "none",
                    background: active ? "#3b82f6" : "#1e293b",
                    color: active ? "#fff" : "#94a3b8",
                    fontSize: 12, fontWeight: 600, cursor: "pointer",
                  }}>
                  {t.emoji} {t.label}
                </button>
              );
            })}
          </div>

          {/* User filter chips — only shown when there's a meaningful choice. */}
          {showUserFilter && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 14, alignItems: "center" }}>
              <span style={{ fontSize: 10, color: "#64748b", textTransform: "uppercase", letterSpacing: "0.08em", marginRight: 4 }}>Who:</span>
              {[
                { id: "all", label: "All" },
                ...userBuckets.users.map(u => ({ id: u, label: u })),
                ...(userBuckets.hasUnattributed ? [{ id: "__unattributed__", label: "Unattributed" }] : []),
              ].map(u => {
                const active = filterUser === u.id;
                return (
                  <button key={u.id} onClick={() => setFilterUser(u.id)}
                    style={{
                      padding: "6px 12px", borderRadius: 999, border: "none",
                      background: active ? "#0ea5e9" : "#1e293b",
                      color: active ? "#fff" : "#94a3b8",
                      fontSize: 12, fontWeight: 600, cursor: "pointer",
                      fontVariantNumeric: "tabular-nums",
                    }}>
                    {u.label}
                  </button>
                );
              })}
            </div>
          )}

          {/* Stats summary */}
          <div style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 12, padding: 16, marginBottom: 16, display: "flex", gap: 32, flexWrap: "wrap" }}>
            {[
              ["Sessions",   stats.sessions.toLocaleString()],
              ["Total Yards", stats.yards.toLocaleString()],
              ["Avg / Session", stats.avg.toLocaleString()],
            ].map(([k, v]) => (
              <div key={k}>
                <div style={{ fontSize: 10, color: "#94a3b8", textTransform: "uppercase", letterSpacing: "0.08em" }}>{k}</div>
                <div style={{ fontSize: 22, fontWeight: 900, color: "#fff" }}>{v}</div>
              </div>
            ))}
          </div>

          {/* Entries */}
          {filtered.map(entry => {
            const meta       = WORKOUT_TYPES.find(t => t.id === entry.type);
            const isExpanded = expandedId === entry.id;
            const isEditing  = editingId === entry.id;
            const eqList     = entry.equipment ? Object.entries(entry.equipment).filter(([, v]) => v).map(([k]) => k) : [];
            return (
              <div key={entry.id} style={{ background: "#1e293b", border: "1px solid #334155", borderRadius: 12, padding: 16, marginBottom: 12 }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 12 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 13, color: "#cbd5e1", fontVariantNumeric: "tabular-nums" }}>{entry.dateCompleted || "—"}</span>
                    {meta && (
                      <span style={{ background: meta.badge, color: meta.badgeText, borderRadius: 999, padding: "3px 10px", fontSize: 11, fontWeight: 700 }}>
                        {meta.emoji} {meta.label}
                      </span>
                    )}
                    {entry.userInitials && (
                      <span title="Logged by"
                        style={{ background: "#0ea5e9", color: "#fff", borderRadius: 999, padding: "3px 9px", fontSize: 10, fontWeight: 800, letterSpacing: "0.06em" }}>
                        {entry.userInitials}
                      </span>
                    )}
                    <span style={{ fontSize: 13, color: "#fff", fontWeight: 700 }}>{(entry.totalYards || 0).toLocaleString()} yds</span>
                    {entry.estimatedMin && <span style={{ fontSize: 11, color: "#64748b" }}>~{entry.estimatedMin} min</span>}
                  </div>
                  <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                    <button onClick={() => setExpandedId(isExpanded ? null : entry.id)}
                      style={{ padding: "4px 10px", background: "transparent", color: "#93c5fd", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      {isExpanded ? "Hide" : "View"}
                    </button>
                    <button onClick={() => { setEditingId(entry.id); setEditingNotes(entry.notes || ""); }}
                      style={{ padding: "4px 10px", background: "transparent", color: "#cbd5e1", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      Notes
                    </button>
                    <button onClick={() => onRepeat(entry)}
                      title="Open this workout as a fresh, unsaved one to log again"
                      style={{ padding: "4px 10px", background: "transparent", color: "#86efac", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      🔁 Repeat
                    </button>
                    {entry.blocks && (
                      <button onClick={() => onRun(entry)}
                        title="Step through this workout section by section"
                        style={{ padding: "4px 10px", background: "transparent", color: "#93c5fd", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                        ▶ Run
                      </button>
                    )}
                    <button onClick={() => onLoadAndPrint(entry)}
                      style={{ padding: "4px 10px", background: "transparent", color: "#cbd5e1", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      🖨 Print
                    </button>
                    <button onClick={() => { if (window.confirm("Delete this workout from history?")) onDelete(entry.id); }}
                      style={{ padding: "4px 10px", background: "transparent", color: "#fca5a5", border: "1px solid #334155", borderRadius: 6, fontSize: 11, cursor: "pointer" }}>
                      Delete
                    </button>
                  </div>
                </div>

                {eqList.length > 0 && (
                  <div style={{ marginTop: 8, display: "flex", gap: 6, flexWrap: "wrap" }}>
                    {eqList.map(k => (
                      <span key={k} style={{ background: "#334155", color: "#cbd5e1", padding: "2px 8px", borderRadius: 999, fontSize: 9, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.04em" }}>{k}</span>
                    ))}
                  </div>
                )}

                {isEditing ? (
                  <div style={{ marginTop: 12 }}>
                    <textarea value={editingNotes} onChange={e => setEditingNotes(e.target.value)} rows={2}
                      style={{ width: "100%", padding: 8, background: "#0f172a", color: "#e2e8f0", border: "1px solid #475569", borderRadius: 6, fontSize: 13, fontFamily: "inherit", resize: "vertical" }} />
                    <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                      <button onClick={() => { onUpdateNotes(entry.id, editingNotes); setEditingId(null); }}
                        style={{ padding: "5px 14px", background: "#3b82f6", color: "#fff", border: "none", borderRadius: 6, fontSize: 12, fontWeight: 600, cursor: "pointer" }}>Save Notes</button>
                      <button onClick={() => setEditingId(null)}
                        style={{ padding: "5px 14px", background: "transparent", color: "#94a3b8", border: "1px solid #334155", borderRadius: 6, fontSize: 12, cursor: "pointer" }}>Cancel</button>
                    </div>
                  </div>
                ) : entry.notes ? (
                  <div style={{ marginTop: 8, color: "#cbd5e1", fontSize: 13, fontStyle: "italic", lineHeight: 1.4 }}>
                    “{entry.notes}”
                  </div>
                ) : null}

                {isExpanded && entry.blocks && (
                  <div style={{ marginTop: 12, paddingTop: 12, borderTop: "1px solid #334155" }}>
                    {entry.blocks.map((b, i) => <WorkoutBlock key={i} block={b} equipment={entry.equipment || {}} />)}
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ═══════════════════════════════════════════════════════════════
    //  PACE CLOCK
    //  Tap a set card to step through reps with a live countdown.
    // ═══════════════════════════════════════════════════════════════

    // Returns true when viewport is wider than it is tall (landscape).
    function useIsLandscape() {
      const [land, setLand] = useState(() => window.innerWidth > window.innerHeight);
      useEffect(() => {
        const update = () => setLand(window.innerWidth > window.innerHeight);
        window.addEventListener("resize", update);
        window.addEventListener("orientationchange", update);
        return () => {
          window.removeEventListener("resize", update);
          window.removeEventListener("orientationchange", update);
        };
      }, []);
      return land;
    }

    // Parse "On 2:00", "On :45", "On 1:10" → seconds. "No interval" → null.
    function parseIntervalSeconds(str) {
      if (!str || /no interval/i.test(str)) return null;
      const full = str.match(/(\d+):(\d{2})/);
      if (full) return parseInt(full[1], 10) * 60 + parseInt(full[2], 10);
      const sec  = str.match(/:(\d{2})/);
      if (sec)  return parseInt(sec[1], 10);
      return null;
    }

    function fmtTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function PaceClockView({ set, sectionName, onClose, onNext, isLastSet, restSecs }) {
      const totalSecs  = parseIntervalSeconds(set.interval);
      const hasTimer   = totalSecs !== null;
      const isLandscape = useIsLandscape();

      const [repIdx,    setRepIdx]   = useState(0);
      const [secsLeft,  setSecsLeft] = useState(totalSecs ?? 0);
      const [running,   setRunning]  = useState(false);
      const [finished,  setFinished] = useState(false);
      const [restLeft,  setRestLeft] = useState(null); // null = not in rest phase

      // Tick down every second while running
      useEffect(() => {
        if (!running || !hasTimer) return;
        const id = setInterval(() => setSecsLeft(s => Math.max(0, s - 1)), 1000);
        return () => clearInterval(id);
      }, [running, hasTimer]);

      // When countdown hits zero, advance rep or finish
      useEffect(() => {
        if (!running || !hasTimer || secsLeft !== 0) return;
        if (repIdx + 1 >= set.reps) {
          setRunning(false);
          setFinished(true);
        } else {
          setRepIdx(r => r + 1);
          setSecsLeft(totalSecs);
        }
      }, [secsLeft, running, hasTimer]);

      // When a set finishes, kick off rest phase (or 1.5s flash for 0s)
      useEffect(() => {
        if (!finished || isLastSet || restSecs === null) return;
        if (restSecs === 0) {
          const id = setTimeout(() => { if (onNext) onNext(); }, 1500);
          return () => clearTimeout(id);
        }
        setRestLeft(restSecs);
      }, [finished]);

      // Tick rest countdown; call onNext when it reaches zero
      useEffect(() => {
        if (restLeft === null) return;
        if (restLeft === 0) { if (onNext) onNext(); return; }
        const id = setTimeout(() => setRestLeft(r => r - 1), 1000);
        return () => clearTimeout(id);
      }, [restLeft]);

      const handleReset = () => {
        setRunning(false);
        setFinished(false);
        setRepIdx(0);
        setSecsLeft(totalSecs ?? 0);
      };

      const handleSkip = () => {
        if (repIdx + 1 >= set.reps) {
          setRunning(false);
          setFinished(true);
        } else {
          setRepIdx(r => r + 1);
          setSecsLeft(totalSecs ?? 0);
        }
      };

      const isAtStart = repIdx === 0 && secsLeft === (totalSecs ?? 0) && !running;

      // Rep dots shared between portrait and landscape
      const repDots = set.reps <= 20 && (
        <div style={{ display: "flex", gap: isLandscape ? 16 : 12, flexWrap: "wrap", justifyContent: "center" }}>
          {Array.from({ length: set.reps }).map((_, i) => (
            <div key={i} style={{
              width: isLandscape ? 28 : 18, height: isLandscape ? 28 : 18,
              borderRadius: "50%",
              background: i < repIdx ? "#22c55e" : i === repIdx ? "#3b82f6" : "#1e293b",
              border: `2px solid ${i < repIdx ? "#22c55e" : i === repIdx ? "#3b82f6" : "#334155"}`,
              transition: "background 0.3s, border-color 0.3s",
            }} />
          ))}
        </div>
      );

      // Controls shared between portrait and landscape
      const btnBase = {
        borderRadius: 16, fontWeight: 700, cursor: "pointer",
        padding: isLandscape ? "12px 0" : "22px 0",
        minHeight: isLandscape ? 52 : 70,
        fontSize: isLandscape ? 17 : 22,
      };
      const controls = (
        <div style={{ display: "flex", gap: isLandscape ? 10 : 14, width: "100%" }}>
          {!finished && (
            <>
              {hasTimer ? (
                <button onClick={() => setRunning(r => !r)} style={{
                  ...btnBase, flex: 2, border: "none",
                  background: running ? "#dc2626" : "#3b82f6",
                  color: "#fff", fontSize: isLandscape ? 20 : 26, fontWeight: 800,
                }}>
                  {running ? "⏸ Pause" : isAtStart ? "▶ Start" : "▶ Resume"}
                </button>
              ) : (
                <button onClick={handleSkip} style={{
                  ...btnBase, flex: 2, border: "none", background: "#3b82f6",
                  color: "#fff", fontSize: isLandscape ? 20 : 26, fontWeight: 800,
                }}>
                  {repIdx + 1 >= set.reps ? "Done ✓" : "Next Rep →"}
                </button>
              )}
              {hasTimer && (
                <button onClick={handleSkip} style={{
                  ...btnBase, flex: 1, border: "1px solid #334155",
                  background: "#0f172a", color: "#64748b",
                }}>
                  Skip →
                </button>
              )}
            </>
          )}
          {!finished ? (
            <button onClick={handleReset} style={{
              ...btnBase, border: "1px solid #1e293b", background: "transparent",
              color: "#475569", width: isLandscape ? undefined : "100%",
            }}>
              ↺ Reset
            </button>
          ) : isLastSet ? (
            <button onClick={onClose} style={{
              ...btnBase, flex: 1, border: "1px solid #1e293b",
              background: "transparent", color: "#475569",
            }}>
              Finish ✓
            </button>
          ) : restSecs === null ? (
            <button onClick={onNext || onClose} style={{
              ...btnBase, flex: 1, border: "1px solid #1e293b",
              background: "transparent", color: "#475569",
            }}>
              Next Set →
            </button>
          ) : restLeft !== null && restLeft > 0 ? (
            <button onClick={() => setRestLeft(0)} style={{
              ...btnBase, flex: 1, border: "1px solid #f59e0b",
              background: "transparent", color: "#f59e0b",
            }}>
              Skip Rest →
            </button>
          ) : null}
        </div>
      );

      if (isLandscape) {
        // ── LANDSCAPE: two-column layout ──────────────────────────────
        return (
          <div style={{
            position: "fixed", inset: 0, zIndex: 10000,
            background: "#020617",
            display: "flex", flexDirection: "column",
            fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
          }}>
            {/* Top bar */}
            <div style={{
              display: "flex", justifyContent: "space-between", alignItems: "center",
              padding: "8px 16px", borderBottom: "1px solid #1e293b", flexShrink: 0,
            }}>
              <button onClick={onClose} style={{
                background: "transparent", border: "none", color: "#94a3b8",
                fontSize: 28, lineHeight: 1, cursor: "pointer",
                padding: "4px 8px", borderRadius: 8, minWidth: 44, minHeight: 44,
              }}>✕</button>
              <div style={{ fontSize: 15, color: "#475569", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em" }}>
                {sectionName || "Pace Clock"}
              </div>
              <div style={{ minWidth: 44 }} />
            </div>

            {/* Two-column content */}
            <div style={{ flex: 1, display: "flex", overflow: "hidden" }}>

              {/* Left: set info */}
              <div style={{
                flex: 1.1, display: "flex", flexDirection: "column",
                justifyContent: "center", padding: "12px 20px",
                borderRight: "1px solid #1e293b",
              }}>
                <div style={{ fontSize: 45, fontWeight: 800, color: "#e2e8f0", marginBottom: 6 }}>
                  {set.reps} × {set.dist} yds
                </div>
                <div style={{ fontSize: 32, color: "#cbd5e1", lineHeight: 1.35, marginBottom: 6 }}>
                  {set.desc}
                </div>
                <div style={{ fontSize: 32, color: "#475569", fontFamily: "monospace", marginBottom: 12 }}>
                  {set.interval}
                </div>
                {repDots}
              </div>

              {/* Right: clock */}
              <div style={{
                flex: 1, display: "flex", flexDirection: "column",
                alignItems: "center", justifyContent: "center", padding: "12px 16px",
              }}>
                {finished ? (
                  restLeft !== null && restLeft > 0 ? (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 13, fontWeight: 700, color: "#f59e0b", letterSpacing: "0.12em", marginBottom: 6 }}>REST</div>
                      <div style={{ fontSize: 80, fontWeight: 900, color: "#f59e0b", fontFamily: "monospace", letterSpacing: "-0.03em", lineHeight: 1 }}>
                        {restLeft}
                      </div>
                      <div style={{ fontSize: 13, color: "#64748b", marginTop: 6 }}>Next set starting soon…</div>
                    </div>
                  ) : (
                    <div style={{ textAlign: "center" }}>
                      <div style={{ fontSize: 48, marginBottom: 8 }}>✅</div>
                      <div style={{ fontSize: 28, fontWeight: 800, color: "#4ade80" }}>Set Complete!</div>
                      <div style={{ fontSize: 18, color: "#64748b", marginTop: 6 }}>
                        {set.reps} rep{set.reps !== 1 ? "s" : ""} done
                      </div>
                    </div>
                  )
                ) : (
                  <>
                    <div style={{ fontSize: 20, fontWeight: 700, color: "#64748b", marginBottom: 8, letterSpacing: "0.06em" }}>
                      REP <span style={{ color: "#e2e8f0" }}>{repIdx + 1}</span>
                      {" "}<span style={{ color: "#334155" }}>OF</span>{" "}
                      {set.reps}
                    </div>
                    {hasTimer ? (
                      <div style={{
                        fontSize: 80, fontWeight: 900,
                        color: running ? "#ffffff" : "#334155",
                        fontFamily: "monospace", letterSpacing: "-0.03em", lineHeight: 1,
                        transition: "color 0.25s",
                      }}>
                        {fmtTime(secsLeft)}
                      </div>
                    ) : (
                      <div style={{ fontSize: 20, color: "#475569", fontStyle: "italic" }}>
                        No interval — swim easy
                      </div>
                    )}
                  </>
                )}
              </div>
            </div>

            {/* Controls */}
            <div style={{ padding: "10px 16px 14px", borderTop: "1px solid #1e293b", flexShrink: 0 }}>
              {controls}
            </div>
          </div>
        );
      }

      // ── PORTRAIT: original vertical layout ────────────────────────
      return (
        <div style={{
          position: "fixed", inset: 0, zIndex: 10000,
          background: "#020617",
          display: "flex", flexDirection: "column", alignItems: "center",
          fontFamily: "-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif",
        }}>
          {/* Top bar */}
          <div style={{
            width: "100%", display: "flex", justifyContent: "space-between",
            alignItems: "center", padding: "16px 20px",
            borderBottom: "1px solid #1e293b",
          }}>
            <button onClick={onClose} style={{
              background: "transparent", border: "none", color: "#94a3b8",
              fontSize: 36, lineHeight: 1, cursor: "pointer",
              padding: "4px 8px", borderRadius: 8, minWidth: 52, minHeight: 52,
            }}>✕</button>
            <div style={{ fontSize: 18, color: "#475569", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.1em" }}>
              Pace Clock
            </div>
            <div style={{ minWidth: 52 }} />
          </div>

          {/* Set description + interval label */}
          <div style={{ width: "100%", padding: "20px 24px 0", textAlign: "center" }}>
            <div style={{ fontSize: 26, fontWeight: 800, color: "#e2e8f0", lineHeight: 1.3, marginBottom: 8 }}>
              {set.reps} × {set.dist} yds
            </div>
            <div style={{ fontSize: 30, color: "#cbd5e1", lineHeight: 1.4, marginBottom: 8 }}>
              {set.desc}
            </div>
            <div style={{ fontSize: 20, color: "#475569", fontFamily: "monospace" }}>
              {set.interval}
            </div>
          </div>

          {/* Clock area */}
          <div style={{
            flex: 1, display: "flex", flexDirection: "column",
            alignItems: "center", justifyContent: "center",
            width: "100%", padding: "0 24px",
          }}>
            {finished ? (
              restLeft !== null && restLeft > 0 ? (
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 18, fontWeight: 700, color: "#f59e0b", letterSpacing: "0.12em", marginBottom: 8 }}>REST</div>
                  <div style={{ fontSize: 110, fontWeight: 900, color: "#f59e0b", fontFamily: "monospace", letterSpacing: "-0.03em", lineHeight: 1, marginBottom: 20 }}>
                    {restLeft}
                  </div>
                  <div style={{ fontSize: 16, color: "#64748b" }}>Next set starting soon…</div>
                </div>
              ) : (
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: 72, marginBottom: 16 }}>✅</div>
                  <div style={{ fontSize: 38, fontWeight: 800, color: "#4ade80" }}>Set Complete!</div>
                  <div style={{ fontSize: 24, color: "#64748b", marginTop: 12 }}>
                    {set.reps} rep{set.reps !== 1 ? "s" : ""} done

              <>
                <div style={{ fontSize: 28, fontWeight: 700, color: "#64748b", marginBottom: 16, letterSpacing: "0.06em" }}>
                  REP <span style={{ color: "#e2e8f0" }}>{repIdx + 1}</span>
                  {" "}<span style={{ color: "#334155" }}>OF</span>{" "}
                  {set.reps}
                </div>

                    fontSize: 110, fontWeight: 900,

            background: "#1e293b", borderRadius: 20, padding: "28px 24px",

            <div style={{ fontSize: 13, color: "#64748b", marginBottom: 20 }}>

            <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>

              </button>
              <button onClick={onStart} style={{
