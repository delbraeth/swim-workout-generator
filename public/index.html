<head>

  <!-- Open Graph + Twitter card (Phase 1 item 2 — 2026-05-26).
       Image is 1200×630, generated by tools/make_og_image.py. -->

  <meta property="og:site_name" content="SetForge" />

  <!-- SetForge favicons & app icons (M1 Pace Clock — 2026-05-20) -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

  <!-- theme-color: must be a literal hex/rgb; CSS vars don't resolve in <meta>.
       Value matches --color-bg (#0f172a, slate-900). Phase 1 item 3, 2026-05-26. -->
  <meta name="theme-color" content="#0f172a" />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Inter+Tight:wght@600;700;800&display=swap" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <style>
    /* Setforge rebrand 2026-05-20 — Locked palette (REBRAND_SCOPE §3.1).
       Use var(--color-*) refs going forward; legacy literal hex stays in
       inline styles until the Phase 4 CSS refactor lands. */
    :root {
      --color-primary:     #3b82f6;   /* blue   — generator + generic primary action */
      --color-warn:        #f59e0b;   /* amber  — coach actions, Mix pills, multi-pace */
      --color-positive:    #22c55e;   /* green  — completion, success, health states */
      --color-destructive: #ef4444;   /* red    — delete, error, blocked */
      --color-bg:          #0f172a;   /* slate-900 — page background */
      --color-card:        #1e293b;   /* slate-800 — card surfaces */
      --color-border:      #334155;   /* slate-700 — card/input borders */
      --color-border-strong:#475569;  /* slate-600 — dividers */
      --color-text:        #e2e8f0;   /* slate-200 — main body text on dark bg */
      --color-text-muted:  #94a3b8;   /* slate-400 — secondary text */
      --color-text-dim:    #8b95a6;   /* lifted from slate-500 #64748b to pass WCAG AA 4.5:1 over --color-card (Phase 1 item 8, 2026-05-26) */
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: var(--color-bg);
      margin: 0;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--color-text);
    }
    /* Tabular figures for numeric-dense contexts (pace clock, intervals,
       yardage totals). Components opt in via className="tnum" or by
       applying the rule via inline style where granularity is needed. */
    .tnum { font-variant-numeric: tabular-nums; }
    /* Display face for headings + wordmark + modal titles. */
    .display { font-family: "Inter Tight", "Inter", -apple-system, sans-serif; }

    /* Slider styling */
    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
    input[type=range]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--color-primary); cursor: pointer; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }

    /* Default visibility for the print/screen helper classes */
    .print-only { display: none; }

    /* Equipment picker — responsive grid (auto-fits 4 cols on desktop, 2 on mobile) */
    .equipment-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }

    /* Setforge rebrand 2026-05-20 — mobile pool-row wrap (REBRAND_SCOPE §8.3).
       On narrow viewports, the pool-mode buttons take the full row so the
       modifier pills (Recovery, phase, mix) wrap cleanly to row 2 instead of
       getting squeezed alongside. */
    @media (max-width: 640px) {
      .pool-mode-buttons { flex-basis: calc(100% - 70px); }
    }

    /* ── Phone UI pass (PHONE_UI_REVIEW.md) ───────────────────────────── */
    /* Touch devices: give the shared .btn a real tap target (≥44px Apple HIG).
       Desktop (pointer:fine) is untouched, so dense toolbars stay compact. */
    @media (pointer: coarse) {
      .btn { min-height: 40px; }
    }
    /* Set-editor row: a 7-column grid is unusable < ~640px. Stack the cells
       (the JSX carries the desktop grid inline; this class overrides it on
       narrow screens — see the add-row editor). */
    @media (max-width: 640px) {
      .editor-row {
        grid-template-columns: 1fr 1fr !important;
        gap: 6px !important;
      }
      .editor-row > .editor-row-wide { grid-column: 1 / -1; }
      /* Workout-type cards: 3-up is too tight on a phone — drop to 2. */
      .type-card-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }

    /* Phase 4 CSS refactor — button design system (slice 5).
       Spec: BUTTONS_SCOPE.md. Composition = .btn + size + variant + color.
       Defaults absorbed by .btn so most call sites need only 2-3 modifiers. */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
      border: 1px solid transparent;
      line-height: 1;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn:focus-visible { outline: 2px solid var(--btn-color); outline-offset: 2px; }

    /* Size classes — pick one */
    .btn-sm { padding: 3px 10px; font-size: 11px; }
    .btn-md { padding: 6px 12px; font-size: 13px; }
    .btn-lg { padding: 8px 14px; font-size: 13px; }

    /* Shape variants — pick one. Each references --btn-color set by the color class. */
    .btn-outlined {
      background: transparent;
      border-color: var(--btn-color);
      color: var(--btn-color);
    }
    .btn-outlined:hover:not(:disabled) {
      background: color-mix(in srgb, var(--btn-color) 12%, transparent);
    }
    .btn-filled {
      background: var(--btn-color);
      border-color: var(--btn-color);
      color: var(--color-bg);
    }
    .btn-filled:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .btn-ghost {
      background: transparent;
      border-color: transparent;
      color: var(--btn-color);
    }
    .btn-ghost:hover:not(:disabled) {
      background: color-mix(in srgb, var(--btn-color) 10%, transparent);
    }

    /* Color modifiers — pick one. Sets the --btn-color CSS var. */
    .btn-primary     { --btn-color: var(--color-primary); }
    .btn-warn        { --btn-color: var(--color-warn); }
    .btn-positive    { --btn-color: var(--color-positive); }
    .btn-destructive { --btn-color: var(--color-destructive); }
    .btn-neutral     { --btn-color: var(--color-text-muted); }

    /* Phase 4 CSS refactor — card pattern (slice 3).
       Standard slate-800 surface with slate-700 border. Used for content
       blocks, list-item containers, modal bodies, etc. Padding /
       borderRadius / marginBottom stay inline because they vary widely
       across uses (radius 4-12, padding 10-22). Only the surface treatment
       lives in the class — that's the single source of truth for future
       palette tweaks. */
    .card {
      background: var(--color-card);
      border: 1px solid var(--color-border);
    }

    /* Phase 4 CSS refactor — pill pattern (slice 2).
       Rounded-rectangle indicator/toggle commonly used for type chips, mix
       selectors, training-phase pills, role badges. Colors (border /
       background / text) stay inline because pills toggle between active /
       inactive states with state-dependent colors. fontSize stays inline too
       (varies 10-12). cursor stays inline (pointer for interactive,
       inherited/none for display-only). */
    .pill {
      padding: 5px 11px;
      border-radius: 999px;
      font-weight: 700;
    }

    /* Phase 4 CSS refactor — modal overlay pattern.
       Canonical centered-modal backdrop used across IntentForm, Copy
       workout, Schedule for…, Save as intent, and others. Padding stays
       inline (varies per modal — usually 20, occasionally 16). Inner body
       div styles stay inline (different maxWidth + maxHeight per modal).
       Stacked overlays (zIndex 10000) like IntentPreviewOverlay keep their
       inline style. Click-outside-to-close is a JSX onClick prop, not CSS. */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ────────────────────────────────────────────────────────────
       PRINT STYLES — clean, high-contrast, 8.5×11 B&W
       Hides all interactive UI, strips backgrounds and colors,
       and uses serif typography for readable swim-deck output.
       ──────────────────────────────────────────────────────────── */
    @media print {
      @page { size: letter portrait; margin: 0.55in 0.5in; }

      html, body {
        background: #fff !important;
        color: #000 !important;
        font-family: Georgia, "Times New Roman", serif !important;
        font-size: 11pt !important;
        line-height: 1.35 !important;
      }

      /* Strip every background, shadow, and color so output is pure B&W */
      *, *::before, *::after {
        background: #fff !important;
        background-color: #fff !important;
        background-image: none !important;
        color: #000 !important;
        box-shadow: none !important;
        text-shadow: none !important;
        border-color: #000 !important;
      }

      .screen-only { display: none !important; }
      .print-only  { display: block !important; }

      /* Print header — workout title, type, date, totals */
      .print-header {
        border-bottom: 2.5pt solid #000 !important;
        padding-bottom: 8pt !important;
        margin-bottom: 14pt !important;
      }
      .print-title {
        font-size: 22pt !important;
        font-weight: 700 !important;
        margin: 0 !important;
        letter-spacing: -0.01em !important;
      }
      .print-subtitle {
        font-size: 11pt !important;
        margin: 4pt 0 0 0 !important;
        font-style: italic !important;
      }
      .print-meta {
        margin-top: 6pt !important;
        font-size: 11pt !important;
      }
      .print-meta span { margin-right: 18pt !important; }
      .print-meta b { font-weight: 700 !important; }

      /* Workout block — keep section together on one page when possible */
      .workout-block {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        border: 1.5pt solid #000 !important;
        border-radius: 0 !important;
        margin-bottom: 10pt !important;
      }
      .workout-block-header {
        border-bottom: 1pt solid #000 !important;
        padding: 5pt 9pt !important;
        font-size: 11.5pt !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.06em !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
      }
      .workout-block-header > div > span:first-child { display: none !important; } /* hide colored dot */

      /* Tables */
      .workout-block table {
        border-collapse: collapse !important;
        width: 100% !important;
      }
      .workout-block thead tr { border-bottom: 1pt solid #000 !important; }
      .workout-block th {
        padding: 4pt 7pt !important;
        font-size: 8.5pt !important;
        font-weight: 700 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.04em !important;
        text-align: left !important;
        font-family: Georgia, serif !important;
      }
      .workout-block td {
        padding: 5pt 7pt !important;
        font-size: 10pt !important;
        font-style: normal !important;
        border-top: 0.5pt solid #555 !important;
        font-family: Georgia, serif !important;
        vertical-align: top !important;
      }
      .workout-block td:nth-child(1) { font-weight: 700 !important; white-space: nowrap !important; width: 11% !important; }
      .workout-block td:nth-child(2) { font-weight: 700 !important; white-space: nowrap !important; width: 12% !important; }
      .workout-block td:nth-child(3) { width: 42% !important; }
      .workout-block td:nth-child(4) { font-family: "Courier New", monospace !important; white-space: nowrap !important; width: 12% !important; }
      .workout-block td:nth-child(5) { font-style: italic !important; width: 23% !important; }

      /* Equipment badges hidden — equipment is in description text */
      .equipment-badges { display: none !important; }

      /* Catalog: keep each option together on one page where possible */
      .catalog-option {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
        margin-bottom: 6pt !important;
        border: 0.5pt solid #000 !important;
      }
      .catalog-option table { width: 100% !important; border-collapse: collapse !important; }
      .catalog-option th, .catalog-option td { border-top: 0.3pt solid #999 !important; padding: 3pt 6pt !important; }

      /* N6 — Multi-pace export print layout. Per-lane pages get a hard
         break after each lane's page; matrix rows stay together. The
         in-app .screen-only close button is already hidden via the
         existing rule above. */
      body.multipace-active > *:not(.multipace-overlay) { display: none !important; }
      .multipace-page { page-break-after: always !important; break-after: page !important; }
      .multipace-page:last-child { page-break-after: auto !important; break-after: auto !important; }
      .multipace-matrix-row { page-break-inside: avoid !important; break-inside: avoid !important; }
      .multipace-block { page-break-inside: avoid !important; break-inside: avoid !important; }
      .multipace-overlay { position: static !important; overflow: visible !important; }
      /* Phase E — Reports print overlay. Same scope-isolation pattern. */
      body.reports-print-active > *:not(.reports-print-overlay) { display: none !important; }
      .reports-print-overlay { position: static !important; overflow: visible !important; }
    }

    /* N6 — Multi-pace overlay on screen: the .multipace-overlay element is
       position:fixed inset:0 so it visually covers everything. We also
       suppress body scroll so wheel/scroll doesn't leak through. */
    body.multipace-active { overflow: hidden !important; }
    /* Phase E — Reports print overlay (same screen-side behavior). */
    body.reports-print-active { overflow: hidden !important; }
  </style>
</head>
